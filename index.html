<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#D8E7DC" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#2A3B31" media="(prefers-color-scheme: dark)" />
    <meta name="description" content="Your debt-free date in 15 minutes, and a clear amount to pay every payday." />
    <link rel="icon" type="image/svg+xml" href="/icon.svg" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="PaidInYellow" />
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
    <script>
      // Apply the saved theme and text size before the first paint (no flash of light)
      try {
        var a = JSON.parse(localStorage.getItem('piy-appearance') || 'null');
        if (a) {
          var r = document.documentElement;
          if (a.theme === 'dark' || a.theme === 'light') r.setAttribute('data-theme', a.theme);
          r.style.setProperty('--text-scale', String([0.92, 1, 1.15, 1.3][a.textSize] || 1));
        }
      } catch (e) {}
    </script>
    <title>PaidInYellow · Paycheck Payoff Planner</title>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
