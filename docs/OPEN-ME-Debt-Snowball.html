/* =====================================================================
   Debt Snowball design tokens. Warm oat paper, brass accent, deep slate ink.
   ===================================================================== */
:root{
  --bg:#F7F3EC;
  --bg-soft:#EFE8DC;
  --card:#FFFDF9;
  --line:#E2D8C7;
  --line-soft:#EFE7DA;
  --text:#17272B;
  --text-soft:#526163;
  --text-faint:#626A6B;
  --accent:#C6892F;
  --accent-ink:#895F20;
  --on-accent:#17272B;
  --accent-soft:#F3E5CB;
  --green:#2F6D57;
  --on-green:#FFFFFF;
  --green-soft:#DDEBE3;
  --clay:#A24C34;
  --on-clay:#FFFFFF;
  --clay-soft:#F6DFD7;
  --sky:#436C80;
  --sky-soft:#DDE8EE;
  --violet:#6C5B8E;
  --violet-soft:#E5DFEE;
  --shadow:0 1px 2px rgba(23,39,43,.06),0 8px 24px rgba(23,39,43,.06);
  --radius:14px;
  --radius-sm:10px;
  --font-display:'Debt Snowball Serif',Georgia,serif;
  --font-ui:'Debt Snowball Sans',-apple-system,BlinkMacSystemFont,sans-serif;
  --rail:232px;
  --rail-mini:64px;
  --top:60px;
  --maxw:1180px;
  --ease:cubic-bezier(.2,.7,.2,1);
}
[data-theme="dark"]{
  --bg:#12191B;
  --bg-soft:#0D1315;
  --card:#1A2326;
  --line:#2C3A3E;
  --line-soft:#232F32;
  --text:#EDE6DA;
  --text-soft:#A5B1B3;
  --text-faint:#7D8B8F;
  --accent:#E0A64B;
  --accent-ink:#E0A64B;
  --on-accent:#12191B;
  --accent-soft:#3A2E1A;
  --green:#63A78B;
  --on-green:#12191B;
  --green-soft:#1D3730;
  --clay:#D8785B;
  --on-clay:#12191B;
  --clay-soft:#3A231C;
  --sky:#7FAFC6;
  --sky-soft:#1D2E36;
  --violet:#9A87BE;
  --violet-soft:#282139;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 8px 24px rgba(0,0,0,.28);
}

/* ---------- reset ---------- */
*{box-sizing:border-box;margin:0;padding:0}
html{-webkit-text-size-adjust:100%}
body{font-family:var(--font-ui);font-size:15px;line-height:1.5;color:var(--text);background:var(--bg);min-height:100vh;-webkit-font-smoothing:antialiased;overflow-x:hidden}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;background:none;border:0;color:inherit}
a{color:var(--accent-ink);text-decoration:none}
a:hover{text-decoration:underline}
table{border-collapse:collapse;width:100%}
::selection{background:var(--accent-soft);color:var(--text)}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:4px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.hidden,[hidden]{display:none !important}
.grow{flex:1}
.nowrap{white-space:nowrap}
.ic{display:inline-block;vertical-align:-.18em;flex:none}
.serif{font-family:var(--font-display)}
.muted{color:var(--text-soft)}
.faint{color:var(--text-faint)}
.tiny{font-size:12px}
.small{font-size:13px}
.b{font-weight:600}
.right{text-align:right}
.centre{text-align:center}
.mt8{margin-top:8px}.mt12{margin-top:12px}.mt16{margin-top:16px}.mt24{margin-top:24px}
.mb8{margin-bottom:8px}.mb12{margin-bottom:12px}.mb16{margin-bottom:16px}
.c-accent{color:var(--accent-ink)}.c-green{color:var(--green)}.c-clay{color:var(--clay)}.c-sky{color:var(--sky)}.c-violet{color:var(--violet)}

/* ---------- skip link ---------- */
.skip{position:absolute;left:-9999px;top:0;z-index:100;background:var(--accent);color:var(--on-accent);padding:10px 16px;min-height:44px;display:inline-flex;align-items:center;border-radius:0 0 var(--radius-sm) 0;font-weight:600}
.skip:focus{left:0;text-decoration:none}

/* ---------- top bar ---------- */
.topbar{position:fixed;top:0;left:0;right:0;height:var(--top);z-index:40;display:flex;align-items:center;gap:10px;padding:0 16px;background:var(--card);border-bottom:1px solid var(--line)}
.topbar h1{font-family:var(--font-display);font-weight:600;font-size:21px;line-height:1.1;letter-spacing:-.2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:46vw}
.ib{display:inline-flex;align-items:center;justify-content:center;width:38px;height:38px;border-radius:var(--radius-sm);color:var(--text-soft);transition:background .15s,color .15s;flex:none}
.ib:hover{background:var(--bg-soft);color:var(--text)}
.ib.on{color:var(--accent-ink);background:var(--accent-soft)}
.menu-btn{display:none}
.savedot{width:9px;height:9px;border-radius:50%;background:var(--line);flex:none;transition:background .25s,transform .25s;margin-left:2px}
.savedot.saving{background:var(--accent);transform:scale(1.35)}
.savedot.saved{background:var(--green)}

/* ---------- pills and chips ---------- */
.pill{display:inline-flex;align-items:center;gap:7px;height:34px;padding:0 13px;border-radius:999px;background:var(--accent);color:var(--on-accent);font-weight:600;font-size:13.5px;white-space:nowrap;border:0}
.pill.ghost{background:var(--card);color:var(--text);border:1px solid var(--line)}
.pill.good{background:var(--green-soft);color:var(--green)}
.pill.warn{background:var(--clay-soft);color:var(--clay)}
.pill b{font-weight:700}
.chip{display:inline-flex;align-items:center;gap:6px;height:28px;padding:0 10px;border-radius:999px;border:1px solid var(--line);background:var(--card);color:var(--text-soft);font-size:12.5px;font-weight:600;white-space:nowrap}
.chip.accent{background:var(--accent-soft);color:var(--accent-ink);border-color:transparent}
.chip.good{background:var(--green-soft);color:var(--green);border-color:transparent}
.chip.warn{background:var(--clay-soft);color:var(--clay);border-color:transparent}
.chip.sky{background:var(--sky-soft);color:var(--sky);border-color:transparent}
.chip.violet{background:var(--violet-soft);color:var(--violet);border-color:transparent}
.chip.on{background:var(--accent);color:var(--on-accent);border-color:transparent}
.chip button,button.chip{cursor:pointer}
.dot{width:8px;height:8px;border-radius:50%;flex:none;display:inline-block}

/* ---------- rail ---------- */
.scrim{position:fixed;inset:0;background:rgba(23,39,43,.42);z-index:35;opacity:0;pointer-events:none;transition:opacity .2s}
.rail{position:fixed;top:var(--top);left:0;bottom:0;width:var(--rail);z-index:36;background:var(--bg-soft);border-right:1px solid var(--line);overflow-y:auto;padding:12px 10px 48px;transition:width .18s var(--ease),transform .22s var(--ease)}
.rail-grp{padding:12px 0 0}
.rail-grp:first-child{padding-top:0}
.rail-grp-h{font-size:12px;font-weight:700;letter-spacing:.9px;color:var(--text-faint);padding:4px 10px 6px}
.nav{display:flex;align-items:center;gap:11px;width:100%;padding:9px 10px;border-radius:var(--radius-sm);text-align:left;color:var(--text-soft);font-weight:600;font-size:14px;margin:1px 0;transition:background .14s,color .14s;min-height:38px}
.nav .ic{color:var(--text-faint);transition:color .14s}
.nav:hover{background:var(--card);color:var(--text)}
.nav.on{background:var(--card);color:var(--accent-ink);border:1px solid var(--line);box-shadow:var(--shadow)}
.nav.on .ic{color:var(--accent-ink)}
.rail-foot{padding:18px 10px 0;border-top:1px solid var(--line);margin-top:18px;color:var(--text-faint);font-size:12px}
.rail-toggle{margin-top:10px;width:100%;justify-content:flex-start;gap:11px;padding:9px 10px;border-radius:var(--radius-sm);display:flex;align-items:center;color:var(--text-faint);font-size:13px;font-weight:600}
.rail-toggle:hover{background:var(--card);color:var(--text)}
[data-rail="mini"] .rail{width:var(--rail-mini);padding-left:8px;padding-right:8px}
[data-rail="mini"] .rail .nav-label,[data-rail="mini"] .rail-grp-h,[data-rail="mini"] .rail-foot,[data-rail="mini"] .rail-toggle span{display:none}
[data-rail="mini"] .rail-grp{padding-top:6px}
[data-rail="mini"] .nav{justify-content:center;padding:11px 0}
[data-rail="mini"] .rail-toggle{justify-content:center}

/* ---------- main ---------- */
.main{padding:calc(var(--top) + 26px) 28px 96px calc(var(--rail) + 28px);max-width:calc(var(--rail) + var(--maxw) + 56px)}
[data-rail="mini"] .main{padding-left:calc(var(--rail-mini) + 28px)}
.sec{margin:0 0 26px}
.sec-head{display:flex;align-items:flex-end;gap:14px;flex-wrap:wrap;margin-bottom:14px}
.sec-head h2{font-family:var(--font-display);font-weight:600;font-size:22px;line-height:1.2;letter-spacing:-.2px}
.sec-head p{color:var(--text-soft);font-size:13.5px;max-width:62ch}
.page-intro{color:var(--text-soft);font-size:14.5px;max-width:70ch;margin:-6px 0 22px}
.page-fade{animation:rise .28s var(--ease)}
@keyframes rise{from{opacity:0;transform:translateY(7px)}to{opacity:1;transform:none}}

/* ---------- cards ---------- */
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow);padding:18px 20px;position:relative}
.card + .card{margin-top:16px}
.grid > .card + .card{margin-top:0}
.sheet-card{display:flex;flex-direction:column}
.sheet-card > .card-body{display:flex;flex-direction:column;flex:1 1 auto}
.sheet-card .sheet-acts{margin-top:auto;padding-top:12px}
.card-h{display:flex;align-items:flex-start;gap:12px;flex-wrap:wrap;margin-bottom:14px}
.card-h .card-t{font-family:var(--font-display);font-weight:600;font-size:17px;line-height:1.25}
.card-h .card-sub{color:var(--text-soft);font-size:13px;margin-top:3px}
.card-h .card-actions{margin-left:auto;display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.card.flat{box-shadow:none}
.card.tight{padding:14px 16px}
.card.link-card{display:block;text-align:left;width:100%;color:inherit;transition:transform .16s var(--ease),box-shadow .16s var(--ease),border-color .16s}
.card.link-card:hover{transform:translateY(-2px);border-color:var(--accent);text-decoration:none;box-shadow:0 2px 4px rgba(23,39,43,.07),0 14px 30px rgba(23,39,43,.09)}
.hero{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow);padding:26px 26px 24px;position:relative;overflow:hidden}
.hero::before{content:"";position:absolute;inset:0;pointer-events:none;background:radial-gradient(120% 130% at 88% -20%,var(--accent-soft) 0,transparent 58%);opacity:.85}
.hero > *{position:relative}

/* ---------- grids ---------- */
.grid{display:grid;gap:16px}
.g2{grid-template-columns:repeat(2,minmax(0,1fr))}
.g3{grid-template-columns:repeat(3,minmax(0,1fr))}
.g4{grid-template-columns:repeat(4,minmax(0,1fr))}
.gauto{grid-template-columns:repeat(auto-fill,minmax(268px,1fr))}
.row{display:flex;gap:12px;flex-wrap:wrap;align-items:center}
.row.tight{gap:8px}
.split{display:flex;gap:22px;align-items:flex-start;flex-wrap:wrap}
/* paired figures inside one tile sit side by side, never stacked */
.pair{display:flex;gap:0;align-items:stretch;border:1px solid var(--line);border-radius:var(--radius-sm);overflow:hidden}
.pair > div{flex:1 1 0;min-width:0;padding:12px 14px}
.pair > div + div{border-left:1px solid var(--line)}
.pair .pair-l{font-size:12px;font-weight:600;letter-spacing:.4px;color:var(--text-faint);text-transform:uppercase}
.pair .pair-v{font-family:var(--font-display);font-size:24px;font-weight:600;line-height:1.15;margin-top:3px;overflow-wrap:anywhere}

/* ---------- stats ---------- */
.stat{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow);padding:15px 17px;display:block;width:100%;text-align:left;color:inherit;transition:transform .16s var(--ease),border-color .16s}
a.stat:hover,button.stat:hover{transform:translateY(-2px);border-color:var(--accent);text-decoration:none}
.stat-l{font-size:12px;font-weight:600;letter-spacing:.4px;text-transform:uppercase;color:var(--text-faint)}
.stat-v{font-family:var(--font-display);font-size:27px;font-weight:600;line-height:1.15;margin-top:6px;overflow-wrap:anywhere}
.stat-s{font-size:12.5px;color:var(--text-soft);margin-top:5px}
.stat.tone-good .stat-v{color:var(--green)}
.stat.tone-warn .stat-v{color:var(--clay)}
.stat.tone-accent .stat-v{color:var(--accent-ink)}
.stat.tone-sky .stat-v{color:var(--sky)}
.figure{font-family:var(--font-display);font-weight:600;line-height:1.05;letter-spacing:-1px}
.figure.xl{font-size:52px}
.figure.lg{font-size:34px}

/* ---------- buttons ---------- */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:7px;height:38px;padding:0 15px;border-radius:var(--radius-sm);border:1px solid var(--line);background:var(--card);color:var(--text);font-weight:600;font-size:14px;transition:background .14s,border-color .14s,transform .1s;white-space:nowrap}
.btn:hover{background:var(--bg-soft);text-decoration:none}
.btn:active{transform:translateY(1px)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.btn.primary:hover{filter:brightness(1.06);background:var(--accent)}
.btn.ghost{background:transparent;border-color:transparent;color:var(--text-soft)}
.btn.ghost:hover{background:var(--bg-soft);color:var(--text)}
.btn.danger{background:var(--clay-soft);border-color:transparent;color:var(--clay)}
.btn.danger:hover{background:var(--clay);color:var(--on-clay)}
.btn.sm{height:32px;padding:0 11px;font-size:13px}
.btn.block{width:100%}
.btn[disabled]{opacity:.5;cursor:not-allowed}
.btn-set{display:inline-flex;border:1px solid var(--line);border-radius:var(--radius-sm);overflow:hidden;background:var(--card)}
.btn-set button{height:38px;padding:0 14px;font-size:13.5px;font-weight:600;color:var(--text-soft);border-right:1px solid var(--line)}
.btn-set button:last-child{border-right:0}
.btn-set button.on{background:var(--accent);color:var(--on-accent)}

/* ---------- inputs ---------- */
.field{display:block;margin-bottom:13px}
.field > label,.lbl{display:block;font-size:12.5px;font-weight:600;color:var(--text-soft);margin-bottom:5px}
.in,input[type=text],input[type=number],input[type=date],input[type=month],input[type=search],select,textarea{width:100%;height:42px;padding:0 12px;border:1px solid var(--line);border-radius:var(--radius-sm);background:var(--card);color:var(--text);font-size:16px;transition:border-color .14s,box-shadow .14s}
textarea{height:auto;min-height:82px;padding:10px 12px;line-height:1.5;resize:vertical}
select{appearance:none;-webkit-appearance:none;background-image:linear-gradient(45deg,transparent 50%,currentColor 50%),linear-gradient(135deg,currentColor 50%,transparent 50%);background-position:calc(100% - 17px) 19px,calc(100% - 12px) 19px;background-size:5px 5px,5px 5px;background-repeat:no-repeat;padding-right:34px}
.in:focus,input:focus,select:focus,textarea:focus{outline:0;border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
.in.err{border-color:var(--clay)}
.hint{font-size:12px;color:var(--text-faint);margin-top:5px}
.search{position:relative}
.search input{padding-left:38px}
.search .ic{position:absolute;left:12px;top:50%;transform:translateY(-50%);color:var(--text-faint);pointer-events:none}
.chk{display:flex;align-items:center;gap:9px;min-height:40px;font-size:14px;cursor:pointer}
.chk input[type=checkbox],.chk input[type=radio]{width:19px;height:19px;flex:none;accent-color:var(--accent);cursor:pointer}
.swatch{width:34px;height:34px;border-radius:9px;border:1px solid var(--line);padding:0;cursor:pointer}
.swatch.on{box-shadow:0 0 0 2px var(--accent)}
input[type=range]{width:100%;height:34px;padding:0;background:transparent;border:0;accent-color:var(--accent);cursor:pointer}
.filters{display:flex;gap:10px;flex-wrap:wrap;align-items:flex-end;margin-bottom:16px}
.filters .f{min-width:150px;flex:0 1 190px}
.filters .f.wide{flex:1 1 240px}
.filters label{display:block;font-size:12px;font-weight:600;color:var(--text-faint);margin-bottom:4px}

/* ---------- tables ---------- */
.tbl-wrap{border:1px solid var(--line);border-radius:var(--radius);overflow:auto;background:var(--card);max-height:min(72vh,760px);-webkit-overflow-scrolling:touch}
table.tbl{min-width:520px;font-size:14px}
table.tbl th{position:sticky;top:0;z-index:2;background:var(--bg-soft);text-align:left;font-size:12px;font-weight:700;letter-spacing:.5px;text-transform:uppercase;color:var(--text-faint);padding:10px 13px;border-bottom:1px solid var(--line);white-space:nowrap}
table.tbl th.sortable{cursor:pointer}
table.tbl th.sortable:hover{color:var(--text)}
table.tbl td{padding:11px 13px;border-bottom:1px solid var(--line-soft);vertical-align:middle}
table.tbl tr:last-child td{border-bottom:0}
table.tbl tbody tr:hover{background:var(--bg-soft)}
table.tbl tr.group-row td{background:var(--bg-soft);font-weight:700;font-size:12.5px;letter-spacing:.4px;color:var(--text-soft)}
table.tbl tr.total-row td{font-weight:700;background:var(--bg-soft)}
table.tbl .num{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
table.tbl .acts{white-space:nowrap;text-align:right}
table.tbl .nowrap{white-space:nowrap}
table.tbl th.notecell,table.tbl td.notecell{min-width:150px}
.empty{padding:30px 18px;text-align:center;color:var(--text-faint);font-size:14px}
.scroll-note{font-size:12px;color:var(--text-faint);margin-top:7px;display:none}

/* ---------- progress, utilisation, thermometer ---------- */
.prog{height:8px;border-radius:99px;background:var(--bg-soft);overflow:hidden;border:1px solid var(--line-soft)}
.prog span{display:block;height:100%;background:var(--green);border-radius:99px;transition:width .5s var(--ease)}
.prog.accent span{background:var(--accent)}
.prog-l{display:flex;justify-content:space-between;font-size:12px;color:var(--text-soft);margin-bottom:5px}
.util{position:relative;height:12px;border-radius:99px;background:var(--bg-soft);border:1px solid var(--line-soft);overflow:hidden}
.util span{display:block;height:100%;background:var(--sky);border-radius:99px}
.util span.mid{background:var(--accent)}
.util span.high{background:var(--clay)}
.util i{position:absolute;top:-3px;bottom:-3px;width:1px;background:var(--text-faint);opacity:.55}
.util-legend{display:flex;gap:14px;font-size:12px;color:var(--text-faint);margin-top:5px}
.thermo{display:flex;align-items:center;gap:14px}
.thermo .tube{position:relative;flex:1;height:26px;border-radius:99px;background:var(--bg-soft);border:1px solid var(--line);overflow:hidden;min-width:120px}
.thermo .tube > span{position:absolute;left:0;top:0;bottom:0;background:linear-gradient(90deg,var(--green),var(--accent));border-radius:99px;transition:width .6s var(--ease)}
.thermo .tube > i{position:absolute;top:0;bottom:0;width:1px;background:var(--line);opacity:.9}
.thermo .tval{font-family:var(--font-display);font-size:21px;font-weight:600;white-space:nowrap}
.thermo .tlab{font-size:12.5px;color:var(--text-soft)}

/* ---------- warning cards ---------- */
.warn-card{display:flex;gap:12px;align-items:flex-start;background:var(--clay-soft);border:1px solid var(--clay);border-left-width:3px;border-radius:var(--radius-sm);padding:13px 15px;text-align:left;width:100%;color:var(--text)}
.warn-card .ic{color:var(--clay);flex:none;margin-top:1px}
.warn-card b{display:block;font-size:13.5px;margin-bottom:2px;color:var(--clay)}
.warn-card p{font-size:13px;color:var(--text-soft)}
.warn-card + .warn-card{margin-top:10px}
.note{background:var(--bg-soft);border:1px solid var(--line);border-radius:var(--radius-sm);padding:13px 15px;font-size:13.5px;color:var(--text-soft)}
.note.good{background:var(--green-soft);border-color:transparent;color:var(--green)}
.note.accent{background:var(--accent-soft);border-color:transparent;color:var(--text)}

/* ---------- strategy picker ---------- */
.strat-grid{display:grid;gap:14px;grid-template-columns:repeat(auto-fill,minmax(232px,1fr))}
.strat{text-align:left;background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:15px 16px;transition:border-color .16s,transform .16s var(--ease),box-shadow .16s;color:inherit;position:relative}
.strat:hover{transform:translateY(-2px);box-shadow:var(--shadow);border-color:var(--accent)}
.strat.on{border-color:var(--accent);border-width:2px;padding:14px 15px;background:var(--card);box-shadow:var(--shadow)}
.strat .sname{font-family:var(--font-display);font-size:17px;font-weight:600;display:flex;align-items:center;gap:8px}
.strat .srule{font-size:12.5px;color:var(--text-faint);margin-top:2px}
.strat .sblurb{font-size:13px;color:var(--text-soft);margin-top:8px;line-height:1.45}
.strat .sfigs{display:flex;gap:0;margin-top:12px;border-top:1px solid var(--line-soft);padding-top:10px}
.strat .sfigs > div{flex:1 1 0;min-width:0}
.strat .sfigs .k{font-size:12px;color:var(--text-faint);text-transform:uppercase;letter-spacing:.4px}
.strat .sfigs .v{font-family:var(--font-display);font-size:16px;font-weight:600;margin-top:2px}
.strat .tickmark{position:absolute;top:12px;right:12px;color:var(--accent-ink)}

/* ---------- order list and drag handles ---------- */
.olist{display:flex;flex-direction:column;gap:8px}
.oitem{display:flex;align-items:center;gap:12px;background:var(--card);border:1px solid var(--line);border-radius:var(--radius-sm);padding:11px 13px;min-height:56px}
.oitem.dragging{opacity:.5;border-style:dashed}
.oitem.over{border-color:var(--accent)}
.oitem .rank{width:26px;height:26px;border-radius:50%;background:var(--accent-soft);color:var(--accent-ink);display:flex;align-items:center;justify-content:center;font-size:12.5px;font-weight:700;flex:none}
.oitem .oname{font-weight:600;font-size:14px}
.oitem .owhy{font-size:12.5px;color:var(--text-faint)}
.oitem .ofig{margin-left:auto;text-align:right;font-family:var(--font-display);font-size:16px;font-weight:600;white-space:nowrap}
.drag{width:34px;height:34px;display:inline-flex;align-items:center;justify-content:center;color:var(--text-faint);cursor:grab;flex:none;border-radius:8px;touch-action:none}
.drag:hover{background:var(--bg-soft);color:var(--text)}
.drag:active{cursor:grabbing}

/* ---------- milestone path ---------- */
.mpath{position:relative;padding-left:34px}
.mpath::before{content:"";position:absolute;left:15px;top:6px;bottom:6px;width:2px;background:var(--line)}
.mstone{position:relative;padding:12px 0 12px 4px;display:flex;gap:14px;align-items:flex-start}
.mstone::before{content:"";position:absolute;left:-26px;top:16px;width:16px;height:16px;border-radius:50%;background:var(--card);border:2px solid var(--line);z-index:1}
.mstone.done::before{background:var(--green);border-color:var(--green);animation:pop .45s var(--ease)}
.mstone.next::before{border-color:var(--accent);box-shadow:0 0 0 4px var(--accent-soft)}
@keyframes pop{0%{transform:scale(.4)}60%{transform:scale(1.25)}100%{transform:scale(1)}}
.mstone .mt{font-weight:600;font-size:14.5px}
.mstone .ms{font-size:12.5px;color:var(--text-soft);margin-top:2px}
.mstone .mdate{margin-left:auto;font-size:12.5px;color:var(--text-faint);white-space:nowrap}
.mstone.done .mt{color:var(--green)}

/* ---------- colouring-in grid ---------- */
.colour-grid{display:grid;grid-template-columns:repeat(20,1fr);gap:4px;max-width:520px}
.colour-grid .sq{aspect-ratio:1;border:1px solid var(--line);border-radius:3px;background:var(--card)}
.colour-grid .sq.on{background:var(--green);border-color:var(--green);animation:fill .4s var(--ease)}
.colour-grid .sq.part{background:linear-gradient(90deg,var(--green) 50%,var(--card) 50%)}
@keyframes fill{from{transform:scale(.6);opacity:.3}to{transform:scale(1);opacity:1}}

/* ---------- charts ---------- */
.chart{width:100%;overflow:visible}
.chart text{font-family:var(--font-ui);fill:var(--text-faint);font-size:12px}
.chart .axis{stroke:var(--line);stroke-width:1}
.chart .gridline{stroke:var(--line-soft);stroke-width:1}
.chart .val{fill:var(--text);font-weight:600;font-size:12px}
.chart-legend{display:flex;gap:14px;flex-wrap:wrap;font-size:12.5px;color:var(--text-soft);margin-top:10px}
.chart-legend span{display:inline-flex;align-items:center;gap:6px}
.chart-wrap{overflow-x:auto;-webkit-overflow-scrolling:touch}

/* ---------- modal ---------- */
.modal-scrim{position:fixed;inset:0;background:rgba(23,39,43,.5);z-index:60;display:flex;align-items:flex-start;justify-content:center;padding:24px 16px;overflow-y:auto;animation:fade .16s}
@keyframes fade{from{opacity:0}to{opacity:1}}
.modal{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);box-shadow:0 30px 70px rgba(23,39,43,.28);width:100%;max-width:520px;margin:auto;animation:lift .2s var(--ease)}
.modal.wide{max-width:820px}
@keyframes lift{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
.modal-h{display:flex;align-items:center;gap:12px;padding:17px 20px;border-bottom:1px solid var(--line)}
.modal-h h3{font-family:var(--font-display);font-size:19px;font-weight:600;flex:1}
.modal-b{padding:18px 20px;max-height:min(64vh,620px);overflow-y:auto}
.modal-f{display:flex;gap:10px;justify-content:flex-end;flex-wrap:wrap;padding:15px 20px;border-top:1px solid var(--line);background:var(--bg-soft);border-radius:0 0 var(--radius) var(--radius)}

/* ---------- toast ---------- */
.toasts{position:fixed;left:50%;bottom:22px;transform:translateX(-50%);z-index:70;display:flex;flex-direction:column;gap:8px;align-items:center;pointer-events:none;width:calc(100% - 32px);max-width:420px}
.toast{background:var(--text);color:var(--bg);padding:11px 17px;border-radius:99px;font-size:14px;font-weight:600;box-shadow:0 10px 30px rgba(23,39,43,.28);animation:toastin .22s var(--ease);max-width:100%;text-align:center}
.toast.good{background:var(--green);color:var(--on-green)}
.toast.warn{background:var(--clay);color:var(--on-clay)}
@keyframes toastin{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}

/* ---------- debt cards ---------- */
.debt-card{display:flex;flex-direction:column;gap:11px}
.debt-card > .row.tight:last-child{margin-top:auto;padding-top:2px}
.debt-card .dtop{display:flex;align-items:flex-start;gap:10px}
.debt-card .dname{font-weight:700;font-size:15px;line-height:1.25}
.debt-card .dlender{font-size:12.5px;color:var(--text-faint);margin-top:1px}
.debt-card .dbal{font-family:var(--font-display);font-size:28px;font-weight:600;line-height:1.05}
.debt-card .dmeta{display:flex;gap:0;border-top:1px solid var(--line-soft);padding-top:10px}
.debt-card .dmeta > div{flex:1 1 0;min-width:0}
.debt-card .dmeta .k{font-size:12px;color:var(--text-faint);text-transform:uppercase;letter-spacing:.4px}
.debt-card .dmeta .v{font-weight:600;font-size:14px;margin-top:2px}
.debt-card .dbar{border-left:3px solid var(--accent);padding-left:0}
.colour-bar{position:absolute;left:0;top:14px;bottom:14px;width:3px;border-radius:0 3px 3px 0}

/* ---------- print ---------- */
.printable{display:block}
.print-only{display:none}
/* ---- shared component classes as js3 (S.ui) emits them --------------
   One source of truth: the long names below and the short names above
   (card-h, stat-l, modal-h ...) are both styled here, so no page file
   needs a compat shim. */
.card-head{display:flex;align-items:flex-start;gap:12px;flex-wrap:wrap;margin-bottom:14px}
.card-titles{min-width:0;flex:1 1 200px}
.card-head h3,.card-titles h3{font-family:var(--font-display);font-weight:600;font-size:17px;line-height:1.25}
.card-titles .sub,.card-head .card-sub{color:var(--text-soft);font-size:13px;margin-top:3px}
.card-acts{margin-left:auto;display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.card-body{min-width:0}
.sub{color:var(--text-soft);font-size:13px}
.sub[style*="font-size:11"],.sub[style*="font-size:10"]{font-size:12px !important}
.stat-label{font-size:12px;font-weight:600;letter-spacing:.4px;text-transform:uppercase;color:var(--text-faint)}
.stat-value{font-family:var(--font-display);font-size:27px;font-weight:600;line-height:1.15;margin-top:6px;overflow-wrap:anywhere}
.stat-sub{font-size:12.5px;color:var(--text-soft);margin-top:5px}
.stat .figure{margin-top:6px;overflow-wrap:anywhere}
.stat.tone-good .stat-value,.stat.tone-good .figure{color:var(--green)}

.stat.tone-accent .stat-value,.stat.tone-accent .figure{color:var(--accent-ink)}
.stat.tone-sky .stat-value,.stat.tone-sky .figure{color:var(--sky)}
.pair .stat{border:0;box-shadow:none;background:transparent;border-radius:0;padding:12px 14px}
.pair .figure.lg{font-size:24px}
.modal-head{display:flex;align-items:center;gap:12px;padding:17px 20px;border-bottom:1px solid var(--line)}
.modal-head h2{font-family:var(--font-display);font-size:19px;font-weight:600;flex:1;line-height:1.25}
.modal-body{padding:18px 20px;max-height:min(64vh,620px);overflow-y:auto}
.modal-foot{display:flex;gap:10px;justify-content:flex-end;flex-wrap:wrap;padding:15px 20px;border-top:1px solid var(--line);background:var(--bg-soft);border-radius:0 0 var(--radius) var(--radius)}
.chip.tone-accent{background:var(--accent-soft);color:var(--accent-ink);border-color:transparent}
.chip.tone-good{background:var(--green-soft);color:var(--green);border-color:transparent}
.chip.tone-warn{background:var(--clay-soft);color:var(--clay);border-color:transparent}
.chip.tone-sky{background:var(--sky-soft);color:var(--sky);border-color:transparent}
.chip.tone-violet{background:var(--violet-soft);color:var(--violet);border-color:transparent}
.pill.tone-good{background:var(--green-soft);color:var(--green)}
.pill.tone-warn{background:var(--clay-soft);color:var(--clay)}
.pill.tone-ghost{background:var(--card);color:var(--text);border:1px solid var(--line)}
.prog.tone-accent span{background:var(--accent)}
.prog.tone-warn span{background:var(--clay)}
.prog.tone-sky span{background:var(--sky)}
/* utilisation as js3 draws it: a labelled bar block, not the bare 12px track */
.util.tone-good,.util.tone-warn,.util.tone-bad{height:auto;border:0;background:none;border-radius:0;overflow:visible}
.util-bar{position:relative;height:12px;border-radius:99px;background:var(--bg-soft);border:1px solid var(--line-soft);overflow:hidden}
.util-bar span{display:block;height:100%;border-radius:99px;background:var(--sky)}
.util.tone-warn .util-bar span{background:var(--accent)}
.util.tone-bad .util-bar span{background:var(--clay)}
.util-num{font-size:12px;color:var(--text-faint);margin-top:5px}
/* vertical thermometer as js3 draws it (the horizontal .tube above is the dashboard one) */
.thermo:has(.thermo-tube){gap:20px}
.thermo-tube{position:relative;width:34px;height:148px;border-radius:99px;background:var(--bg-soft);border:1px solid var(--line);overflow:hidden;flex:none}
.thermo-fill{position:absolute;left:0;right:0;bottom:0;background-image:linear-gradient(0deg,var(--green),var(--accent));background-size:100% 148px;background-position:bottom;border-radius:0 0 99px 99px;min-height:6px;transition:height .6s var(--ease)}
.thermo-bulb{display:none}
.thermo-side{min-width:0}
.thermo-side .sub{font-size:12.5px;color:var(--text-soft);margin-top:4px}
/* charts as js3 draws them */
.ch{width:100%;height:auto;overflow:visible;display:block}
.ch text{font-family:var(--font-ui)}
.ch-grid{stroke:var(--line-soft);stroke-width:1}
.ch-box{position:relative}
.ch-dot{position:absolute;width:8px;height:8px;border-radius:50%;transform:translate(-50%,-50%);pointer-events:none}
.ch-top{font-size:12px;color:var(--text-faint);margin-bottom:4px}
.ch-x{display:flex;justify-content:space-between;gap:10px;font-size:12px;color:var(--text-faint);margin-top:6px}
.chart-narrow text{font-size:13.5px}
.ch-t{fill:var(--text-faint);font-size:12px}
.ch-ends{display:flex;justify-content:space-between;font-size:12.5px;font-weight:600;color:var(--text-soft);margin-top:2px}
.ch-legend{display:flex;gap:14px;flex-wrap:wrap;font-size:12.5px;color:var(--text-soft);margin-top:10px;list-style:none;padding:0}
.ch-legend.col{display:block;margin-top:0}
.ch-key{display:flex;align-items:center;gap:7px}
.ch-legend.col .ch-key{padding:4px 0}
.ch-key i{width:10px;height:10px;border-radius:3px;flex:none;display:inline-block}
.ch-key .k{flex:1;min-width:0;overflow-wrap:anywhere}
.ch-key .v{font-weight:600;color:var(--text);font-variant-numeric:tabular-nums}
.chart.bars{width:100%}
.bar-row{display:flex;align-items:center;gap:12px;padding:5px 0}
.bar-label{flex:0 0 132px;font-size:12.5px;color:var(--text-soft);min-width:0;overflow-wrap:anywhere}
.bar-label i{display:block;font-style:normal;font-size:12px;color:var(--text-faint)}
.bar-track{flex:1 1 60px;height:14px;border-radius:99px;background:var(--bg-soft);border:1px solid var(--line-soft);overflow:hidden;min-width:40px}
.bar-track span{display:block;height:100%;border-radius:99px}
.bar-value{flex:none;font-size:12.5px;font-weight:600;font-variant-numeric:tabular-nums;white-space:nowrap;text-align:right;min-width:78px}
.donut-wrap{display:flex;gap:20px;align-items:center;flex-wrap:wrap}
.donut{position:relative;flex:none}
.donut svg{display:block}
.donut-mid{position:absolute;left:0;right:0;top:0;bottom:0;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;pointer-events:none}
.donut-mid .figure{font-size:19px}
.donut-mid .sub{font-size:12px;color:var(--text-soft)}
.donut-wrap .ch-legend.col{flex:1 1 210px;min-width:0}
/* table blocks: the live search sits beside the filter selects */
.filters .search{flex:1 1 240px;min-width:170px}
.filters .search input{width:100%}
.tbl-block .sub{font-size:12.5px;color:var(--text-soft);margin-top:8px}
.no-hits{padding:16px 4px;color:var(--text-faint);font-size:13.5px}
tr[data-parent]{background:var(--bg-soft)}
.tbl tr.search-miss{display:none}
@media print{

  .main{padding:0 !important;max-width:none !important}
  body{background:#fff;color:#000;font-size:11.5pt;line-height:1.4}
  .print-only{display:block}
  .card,.stat,.hero{box-shadow:none !important;border:1px solid #bbb !important;break-inside:avoid;page-break-inside:avoid;background:#fff !important}

  .page-break{page-break-before:always;break-before:page}
  .colour-grid .sq.on{background:#999 !important;border-color:#777 !important;-webkit-print-color-adjust:exact;print-color-adjust:exact}
  a{color:#000;text-decoration:none}
  @page{size:A4;margin:14mm}
}

/* ---------- responsive ---------- */

  .g4{grid-template-columns:repeat(2,minmax(0,1fr))}

}
@media (max-width:900px){
  .menu-btn{display:inline-flex}
  .rail{transform:translateX(-100%);width:274px;box-shadow:0 0 40px rgba(23,39,43,.2);padding-bottom:70px}
  [data-drawer="open"] .rail{transform:none}
  [data-drawer="open"] .scrim{opacity:1;pointer-events:auto}
  .main{padding:calc(var(--top) + 18px) 16px 92px 16px !important;max-width:100%}
  [data-rail="mini"] .rail{width:274px;padding-left:10px;padding-right:10px}
  [data-rail="mini"] .rail .nav-label,[data-rail="mini"] .rail-grp-h,[data-rail="mini"] .rail-foot{display:block}

  .rail-toggle{display:none}
  .g2,.g3,.g4,.gauto,.strat-grid{grid-template-columns:minmax(0,1fr)}

  .topbar{flex-wrap:wrap;align-content:center;row-gap:4px;padding:0 18px 0 12px;gap:6px}
  .topbar h1{flex:1 1 auto;min-width:0;max-width:none;font-size:18px}
  .topbar .grow{flex:0 0 100%;height:0}
  .topbar #currencyChip{margin-left:auto}
  .figure.xl{font-size:40px}
  .figure.lg{font-size:28px}
  .nav,.btn,.pill,.ib,.chk,.drag,.btn-set button{min-height:44px}

  .btn{height:44px}
  .btn.sm{height:40px}
  .pill{height:40px}
  .chip{height:32px}
  button.chip,.chip button,.topbar .chip{min-height:44px;height:44px}
  .in,input[type=text],input[type=number],input[type=date],input[type=month],input[type=search],select{height:44px;min-height:44px}
  textarea{height:auto;min-height:110px}
  input,select,textarea{font-size:16px}
  input[type=range],input.snl-range[type=range]{height:44px}
  .chk input[type=checkbox],.chk input[type=radio]{width:22px;height:22px}
  .chk{min-height:44px}
  .oitem .oname,table.tbl td > a:not(.btn){display:inline-flex;align-items:center;min-height:44px;margin:-12px 0}
  .topbar{position:fixed}
  .savedot{position:absolute;right:8px;top:8px;margin:0;width:8px;height:8px}
  .card-head{flex-wrap:nowrap;align-items:flex-start}
  .card-head:has(.card-acts > :nth-child(2)){flex-wrap:wrap}
  .card-head .card-titles{flex:1 1 auto}
  .card-acts{flex:none;margin-left:auto;flex-wrap:wrap;min-width:0;max-width:100%}
  .card-head:has(.card-acts > :nth-child(2)) .card-acts{flex:1 1 100%;margin-left:0}
  .card-acts .btn{padding:0 12px}
  .modal-b,.modal-body{max-height:none}
  .modal-scrim{padding:12px 10px}
  /* a long dialog scrolls the scrim on a phone, so the head has to stay put
     or the close button rides off the top of the screen. */
  .modal-h,.modal-head{position:sticky;top:0;z-index:2;background:var(--card);border-radius:var(--radius) var(--radius) 0 0}
  .modal-f,.modal-foot{position:sticky;bottom:0;z-index:2}
  .tbl-search{min-height:44px}
  .bar-label{flex:0 0 96px;font-size:12px}
  .bar-value{min-width:66px;font-size:12px}
  .filters .search{flex:1 1 100%;min-width:0}
  .scroll-note{display:block}
  .colour-grid{grid-template-columns:repeat(10,1fr)}
  .filters .f,.filters .f.wide{flex:1 1 100%;min-width:0}
  .sec-head h2{font-size:19px}
  .split{gap:16px}
  body{font-size:16px}
  .page-intro{font-size:16px}
  /* phone reading scale: anything a customer reads as a sentence sits at
     16px on a phone. Micro labels (stat-l, pair-l, table heads) stay small
     on purpose, they are labels rather than body copy. */
  .sec-head p{font-size:16px}
  .note{font-size:16px}
  .sub,.card-sub{font-size:16px}
  .card-titles .sub,.card-head .card-sub,.card-h .card-sub{font-size:16px}
  .warn-card p{font-size:16px}
  .strat .sblurb{font-size:16px}
  .hint{font-size:16px}
  .scroll-note{font-size:16px}
  .empty{font-size:16px}
  .chk{font-size:16px}
  .mstone .ms{font-size:16px}
  .mstone .mt{font-size:16.5px}
  .rail-foot{font-size:16px;line-height:1.45}
  .rail-foot .rail-toggle{font-size:15px}
  table.tbl td{vertical-align:top}
  table.tbl td .btn,table.tbl td .ib{vertical-align:top}
}
@media (max-width:640px){
  /* phone column budget: keep the money column inside the first screenful so a
     figure is never cut mid number. Every column is still there on the swipe. */

  table.tbl th,table.tbl td{padding-left:9px;padding-right:9px}
  table.tbl td .chip{white-space:normal;height:auto;min-height:28px;padding-top:5px;padding-bottom:5px;line-height:1.2}

  .topbar h1{font-size:17px}
  .pair > div{padding:10px 11px}

}
@media (prefers-reduced-motion:reduce){
  *{animation-duration:.01ms !important;transition-duration:.01ms !important}
}
/* gauntlet 2026-09-03: three debt cards per row on desktop so the action row never wraps, chosen strategy row readable, phone tap targets */
#d4Grid{grid-template-columns:repeat(auto-fill,minmax(310px,1fr))}
.debt-card > .row.tight:last-child .btn.sm{padding:0 10px}

  .swatch{width:44px;height:44px;border-radius:11px}

}

<body>
<a class="skip" href="#view">Skip to the page content</a>

<div class="app" id="app" data-dlayout="1" data-rail="full" data-drawer="closed">

  <header class="topbar" id="topbar" data-dsec="d-topbar">
    <button class="ib menu-btn" id="menuBtn" aria-label="Open the menu" aria-expanded="false" aria-controls="rail"></button>
    <h1 id="pageTitle">Dashboard</h1>
    <button class="ib" id="guideBtn" aria-label="How this page works" title="How this page works"></button>
    <div class="grow"></div>
    <button class="pill" id="freeDatePill" title="Your projected debt-free date"><span id="freeDateText">Debt free</span></button>
    <button class="chip" id="currencyChip" title="Currency and formatting"><span id="currencyText">AUD</span></button>
    <button class="ib" id="themeBtn" aria-label="Switch between light and dark" title="Switch between light and dark"></button>
    <span class="savedot" id="saveDot" role="status" aria-live="polite" title="All changes are saved on this device"></span>
  </header>

  <div class="scrim" id="scrim" hidden></div>

  <nav class="rail" id="rail" data-dsec="d-rail" data-dcol="rail" aria-label="Sections">
    <div id="railNav"></div>
    <div class="rail-foot" id="railFoot">
      <div class="b">Debt Snowball</div>
      <div>Pick a payoff method, see your debt-free date, and watch it get closer.</div>
      <button class="rail-toggle" id="railToggle" aria-label="Narrow the side menu"><span>Narrow the menu</span></button>
    </div>
  </nav>

  <main class="main" id="view" data-dcol="main" tabindex="-1"></main>

</div>

<div id="modalRoot"></div>
<div id="toastRoot" class="toasts" aria-live="polite" role="status"></div>

<script>
(function(){

/* =====================================================================
   Debt Snowball js1: storage, the document, and the shared helpers.
   Everything hangs off the single global S. Top level uses var on
   purpose: js1 to js8 all share one IIFE scope, so a re-declaration
   must never throw.
   ===================================================================== */

/* Kept from the first release on purpose: it is the local-storage key, so
   changing it with the rename would orphan an existing plan on someone's device. */
var STORE_KEY = 'ay_snowline_v1';
var ONLINE = window.__AY_ONLINE && window.__AY_ONLINE.api ? window.__AY_ONLINE : null;
var memFallback = null, cloudTimer = null, cloudReady = !ONLINE;
var storage = {
  read: function(){ try { return window.localStorage.getItem(STORE_KEY); } catch (e) { return memFallback; } },
  write: function(v){
    try { window.localStorage.setItem(STORE_KEY, v); } catch (e) { memFallback = v; }
    if (ONLINE && cloudReady) {
      clearTimeout(cloudTimer);
      cloudTimer = setTimeout(function(){
        fetch(ONLINE.api, { method: 'PUT', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ data: JSON.parse(v) }) })
          .then(function(r){ if (r.status === 401) window.location.href = ONLINE.loginUrl; })
          .catch(function(){});
      }, 600);
    }
  },
  clear: function(){ try { window.localStorage.removeItem(STORE_KEY); } catch (e) {} memFallback = null; }
};
function bootFromCloud(done){
  if (!ONLINE) return done();
  fetch(ONLINE.api).then(function(r){ return r.status === 401 ? (window.location.href = ONLINE.loginUrl, null) : r.json(); })
    .then(function(res){ if (res && res.data) { try { window.localStorage.setItem(STORE_KEY, JSON.stringify(res.data)); } catch (e) { memFallback = JSON.stringify(res.data); } } cloudReady = true; done(); })
    .catch(function(){ cloudReady = true; done(); });
}

/* ---------------------------------------------------------------- */

var S = window.S = {};

S.VERSION = 1;
S.NAME = 'Debt Snowball';

S.CURRENCIES = [
  { code: 'AUD', symbol: '$', locale: 'en-AU' },
  { code: 'NZD', symbol: '$', locale: 'en-NZ' },
  { code: 'USD', symbol: '$', locale: 'en-US' },
  { code: 'CAD', symbol: '$', locale: 'en-CA' },
  { code: 'GBP', symbol: '£', locale: 'en-GB' },
  { code: 'EUR', symbol: '€', locale: 'en-IE' },
  { code: 'SGD', symbol: '$', locale: 'en-SG' },
  { code: 'ZAR', symbol: 'R', locale: 'en-ZA' },
  { code: 'INR', symbol: '₹', locale: 'en-IN' }
];

S.DEBT_TYPES = [
  { key: 'card', label: 'Credit card', colour: '#C6892F' },
  { key: 'store', label: 'Store card', colour: '#B25439' },
  { key: 'personal', label: 'Personal loan', colour: '#4F7F97' },
  { key: 'car', label: 'Car loan', colour: '#2F6D57' },
  { key: 'student', label: 'Study loan', colour: '#6C5B8E' },
  { key: 'home', label: 'Home loan', colour: '#3F6B7A' },
  { key: 'medical', label: 'Medical', colour: '#8A6A3B' },
  { key: 'bnpl', label: 'Buy now pay later', colour: '#A24C6B' },
  { key: 'family', label: 'Family or friend', colour: '#5E7A4A' },
  { key: 'other', label: 'Something else', colour: '#6E7A7C' }
];

S.PALETTE = ['#C6892F', '#2F6D57', '#B25439', '#4F7F97', '#6C5B8E', '#8A6A3B', '#A24C6B', '#5E7A4A', '#3F6B7A', '#6E7A7C'];

S.FREQUENCIES = [
  { key: 'monthly', label: 'Monthly', perYear: 12 },
  { key: 'fortnightly', label: 'Fortnightly', perYear: 26 },
  { key: 'weekly', label: 'Weekly', perYear: 52 }
];

/* ---------------------------------------------------------------- */
/* the default document                                              */

function defaultDoc(){
  return {
    v: S.VERSION,
    settings: {
      currency: 'AUD', symbol: '$', locale: 'en-AU', theme: 'light',
      strategy: 'snowball', extraPerMonth: 0, frequency: 'monthly',
      startMonth: thisMonth(), customOrder: [], roundUp: false, name: ''
    },
    debts: [],
    payments: [],
    scores: [],
    income: { monthlyNet: 0, essentials: 0, notes: '' },
    snowflakes: [],
    milestones: { celebrated: [] },
    log: { lastOpened: null }
  };
}

function thisMonth(){
  var d = new Date();
  return d.getFullYear() + '-' + pad2(d.getMonth() + 1);
}
function pad2(n){ return (n < 10 ? '0' : '') + n; }

/* Migration keeps an older or hand-edited document usable. It only ever
   adds what is missing, it never drops a key it does not recognise. */
function migrate(doc){
  var d = defaultDoc();
  if (!doc || typeof doc !== 'object') return d;
  var out = doc;
  out.v = S.VERSION;
  out.settings = Object.assign({}, d.settings, out.settings || {});
  if (!Array.isArray(out.settings.customOrder)) out.settings.customOrder = [];
  out.settings.extraPerMonth = numOr(out.settings.extraPerMonth, 0);
  if (out.settings.theme !== 'dark') out.settings.theme = 'light';
  if (!out.settings.startMonth || !/^\d{4}-\d{2}$/.test(out.settings.startMonth)) out.settings.startMonth = thisMonth();
  out.debts = Array.isArray(out.debts) ? out.debts.map(migrateDebt) : [];
  out.payments = Array.isArray(out.payments) ? out.payments : [];
  out.scores = Array.isArray(out.scores) ? out.scores : [];
  out.snowflakes = Array.isArray(out.snowflakes) ? out.snowflakes : [];
  out.income = Object.assign({}, d.income, out.income || {});
  out.milestones = Object.assign({}, d.milestones, out.milestones || {});
  if (!Array.isArray(out.milestones.celebrated)) out.milestones.celebrated = [];
  out.log = Object.assign({}, d.log, out.log || {});
  return out;
}

function migrateDebt(x){
  var d = Object.assign({
    id: S.uid(), name: 'Debt', lender: '', type: 'card', balance: 0, apr: 0,
    minPayment: 0, minRule: { pct: 2, floor: 25 }, creditLimit: 0, dueDay: 15,
    promoApr: null, promoEndsOn: null, deferredInterest: false, openedOn: null,
    notes: '', archived: false, colour: '#C6892F', startBalance: 0
  }, x || {});
  d.minRule = Object.assign({ pct: 2, floor: 25 }, d.minRule || {});
  d.balance = numOr(d.balance, 0);
  d.apr = numOr(d.apr, 0);
  d.minPayment = numOr(d.minPayment, 0);
  d.creditLimit = numOr(d.creditLimit, 0);
  d.dueDay = Math.min(31, Math.max(1, Math.round(numOr(d.dueDay, 15))));
  if (!d.startBalance || d.startBalance < d.balance) d.startBalance = d.balance;
  if (d.promoApr !== null && d.promoApr !== undefined) d.promoApr = numOr(d.promoApr, 0);
  if (!d.colour) d.colour = '#C6892F';
  return d;
}

function numOr(v, f){ var n = Number(v); return isFinite(n) ? n : f; }

/* ---------------------------------------------------------------- */
/* load and save                                                     */

S.state = null;

S.load = function(){
  var raw = storage.read();
  var doc = null;
  if (raw) { try { doc = JSON.parse(raw); } catch (e) { doc = null; } }
  S.state = migrate(doc);
  return S.state;
};

var changeFns = [];
S.onChange = function(fn){ if (typeof fn === 'function') changeFns.push(fn); };

var saveTimer = null;
S.save = function(){
  if (!S.state) return;
  try { storage.write(JSON.stringify(S.state)); } catch (e) {}
  markSaved();
  for (var i = 0; i < changeFns.length; i++) {
    try { changeFns[i](S.state); } catch (e) {}
  }
};

function markSaved(){
  var dot = document.getElementById('saveDot');
  if (!dot) return;
  dot.className = 'savedot saving';
  dot.title = 'Saving your changes';
  clearTimeout(saveTimer);
  saveTimer = setTimeout(function(){
    dot.className = 'savedot saved';
    dot.title = ONLINE ? 'Saved to your account' : 'Saved on this device';
  }, 380);
}

/* ---------------------------------------------------------------- */
/* small helpers                                                     */

var uidN = 0;
S.uid = function(){
  uidN += 1;
  return 's' + Date.now().toString(36) + uidN.toString(36) + Math.floor(Math.random() * 1296).toString(36);
};

S.esc = function(s){
  if (s === null || s === undefined) return '';
  return String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
    .replace(/"/g, '&quot;').replace(/'/g, '&#39;');
};

S.money = function(n, opts){
  opts = opts || {};
  var st = (S.state && S.state.settings) || { symbol: '$', locale: 'en-AU' };
  var v = numOr(n, 0);
  var dp = opts.cents ? 2 : 0;
  if (opts.cents === undefined && Math.abs(v) > 0 && Math.abs(v) < 1) dp = 2;
  var neg = v < 0;
  var body;
  try {
    body = Math.abs(v).toLocaleString(st.locale || 'en-AU', { minimumFractionDigits: dp, maximumFractionDigits: dp });
  } catch (e) {
    body = Math.abs(v).toFixed(dp);
  }
  var sign = neg ? '-' : (opts.sign && v > 0 ? '+' : '');
  if (opts.bare) return sign + body;
  return sign + (st.symbol || '$') + body;
};

S.num = function(n, dp){
  var v = numOr(n, 0);
  dp = dp === undefined ? 0 : dp;
  try { return v.toLocaleString((S.state && S.state.settings.locale) || 'en-AU', { minimumFractionDigits: dp, maximumFractionDigits: dp }); }
  catch (e) { return v.toFixed(dp); }
};

S.pct = function(n, dp){
  dp = dp === undefined ? 1 : dp;
  return S.num(numOr(n, 0), dp) + '%';
};

S.MON = ['Jan', 'Feb', 'Mar', 'Apr', 'May', 'Jun', 'Jul', 'Aug', 'Sep', 'Oct', 'Nov', 'Dec'];
S.MONFULL = ['January', 'February', 'March', 'April', 'May', 'June', 'July', 'August', 'September', 'October', 'November', 'December'];
S.DOW = ['Sun', 'Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat'];

S.today = function(){
  var d = new Date();
  return d.getFullYear() + '-' + pad2(d.getMonth() + 1) + '-' + pad2(d.getDate());
};

S.parseDate = function(v){
  if (v instanceof Date) return v;
  var s = String(v || '');
  var m = s.match(/^(\d{4})-(\d{2})-(\d{2})/);
  if (m) return new Date(Number(m[1]), Number(m[2]) - 1, Number(m[3]));
  var m2 = s.match(/^(\d{4})-(\d{2})$/);
  if (m2) return new Date(Number(m2[1]), Number(m2[2]) - 1, 1);
  var d = new Date(s);
  return isNaN(d.getTime()) ? new Date() : d;
};

S.dateStr = function(d){
  if (!d) return '';
  var x = S.parseDate(d);
  return x.getDate() + ' ' + S.MON[x.getMonth()] + ' ' + x.getFullYear();
};

S.dateLong = function(d){
  if (!d) return '';
  var x = S.parseDate(d);
  return x.getDate() + ' ' + S.MONFULL[x.getMonth()] + ' ' + x.getFullYear();
};

S.monthLabel = function(ym){
  if (!ym) return '';
  var p = String(ym).split('-');
  var mi = Number(p[1]) - 1;
  if (mi < 0 || mi > 11) return String(ym);
  return S.MON[mi] + ' ' + p[0];
};

S.ymOf = function(dateStr){ return String(dateStr || '').slice(0, 7); };

S.addMonths = function(ym, n){
  var p = String(ym || thisMonth()).split('-');
  var y = Number(p[0]), m = Number(p[1]) - 1 + Number(n || 0);
  y += Math.floor(m / 12);
  m = ((m % 12) + 12) % 12;
  return y + '-' + pad2(m + 1);
};

S.monthsBetween = function(a, b){
  var pa = String(a).slice(0, 7).split('-'), pb = String(b).slice(0, 7).split('-');
  return (Number(pb[0]) - Number(pa[0])) * 12 + (Number(pb[1]) - Number(pa[1]));
};

S.daysInMonth = function(ym){
  var p = String(ym).split('-');
  return new Date(Number(p[0]), Number(p[1]), 0).getDate();
};

/* Turns a year-month plus a due day into a real date that exists. */
S.dueDate = function(ym, dueDay){
  var dim = S.daysInMonth(ym);
  return ym + '-' + pad2(Math.min(Math.max(1, Math.round(dueDay || 15)), dim));
};

S.round2 = function(n){ return Math.round((numOr(n, 0) + Number.EPSILON) * 100) / 100; };

S.sum = function(list, fn){
  var t = 0;
  for (var i = 0; i < list.length; i++) t += numOr(fn ? fn(list[i], i) : list[i], 0);
  return t;
};

S.clamp = function(n, lo, hi){ return Math.min(hi, Math.max(lo, numOr(n, lo))); };

S.plural = function(n, one, many){ return Math.abs(n) === 1 ? one : (many || one + 's'); };

S.monthsWords = function(n){
  n = Math.max(0, Math.round(numOr(n, 0)));
  var y = Math.floor(n / 12), m = n % 12;
  if (!y) return n + ' ' + S.plural(n, 'month');
  if (!m) return y + ' ' + S.plural(y, 'year');
  return y + ' ' + S.plural(y, 'year') + ' ' + m + ' ' + S.plural(m, 'month');
};

S.debounce = function(fn, ms){
  var t = null;
  return function(){
    var self = this, args = arguments;
    clearTimeout(t);
    t = setTimeout(function(){ fn.apply(self, args); }, ms || 200);
  };
};

/* ---------------------------------------------------------------- */
/* debt helpers                                                      */

S.debt = function(id){
  var list = (S.state && S.state.debts) || [];
  for (var i = 0; i < list.length; i++) if (list[i].id === id) return list[i];
  return null;
};

S.activeDebts = function(){
  return ((S.state && S.state.debts) || []).filter(function(d){ return !d.archived; });
};

S.typeLabel = function(key){
  for (var i = 0; i < S.DEBT_TYPES.length; i++) if (S.DEBT_TYPES[i].key === key) return S.DEBT_TYPES[i].label;
  return 'Something else';
};

/* The APR that actually applies in a given month. A promo rate holds
   while the month is on or before the month the promo ends. */
S.effectiveApr = function(debt, ym){
  if (!debt) return 0;
  var promo = debt.promoApr;
  if (promo === null || promo === undefined || !debt.promoEndsOn) return numOr(debt.apr, 0);
  var end = String(debt.promoEndsOn).slice(0, 7);
  var m = String(ym || thisMonth()).slice(0, 7);
  return m <= end ? numOr(promo, 0) : numOr(debt.apr, 0);
};

/* A debt's minimum payment for one month. A fixed minPayment wins. With
   no fixed figure the card rule applies: a percent of the balance plus
   this month's interest, with a floor. Never more than what is owed. */
S.minPaymentFor = function(debt, balOverride, ym){
  if (!debt) return 0;
  var bal = balOverride === undefined || balOverride === null ? numOr(debt.balance, 0) : numOr(balOverride, 0);
  if (bal <= 0) return 0;
  var min;
  if (numOr(debt.minPayment, 0) > 0) {
    min = numOr(debt.minPayment, 0);
  } else {
    var rule = debt.minRule || { pct: 2, floor: 25 };
    var rate = S.effectiveApr(debt, ym) / 100 / 12;
    min = numOr(rule.pct, 2) / 100 * bal + bal * rate;
    min = Math.max(numOr(rule.floor, 25), min);
  }
  return S.round2(Math.min(min, bal));
};

S.totalDebt = function(){ return S.round2(S.sum(S.activeDebts(), function(d){ return d.balance; })); };
S.totalStart = function(){ return S.round2(S.sum(S.activeDebts(), function(d){ return Math.max(numOr(d.startBalance, 0), numOr(d.balance, 0)); })); };
S.totalMinimums = function(){ return S.round2(S.sum(S.activeDebts(), function(d){ return S.minPaymentFor(d); })); };
S.paidOff = function(){ return S.round2(Math.max(0, S.totalStart() - S.totalDebt())); };
S.pctPaid = function(){
  var start = S.totalStart();
  return start > 0 ? S.clamp(S.paidOff() / start * 100, 0, 100) : 0;
};

S.utilisation = function(debt){
  if (!debt || numOr(debt.creditLimit, 0) <= 0) return null;
  return S.round2(numOr(debt.balance, 0) / numOr(debt.creditLimit, 1) * 100);
};

S.totalUtilisation = function(){
  var cards = S.activeDebts().filter(function(d){ return numOr(d.creditLimit, 0) > 0; });
  if (!cards.length) return null;
  var lim = S.sum(cards, function(d){ return d.creditLimit; });
  if (lim <= 0) return null;
  return S.round2(S.sum(cards, function(d){ return d.balance; }) / lim * 100);
};

/* The money available every month: every minimum plus the extra. */
S.monthlyPot = function(){
  return S.round2(S.totalMinimums() + S.extraMonthly());
};

/* Extra is entered in the chosen frequency and stored as entered, so a
   fortnightly 100 is 100 every fortnight. This is the monthly equal. */
S.extraMonthly = function(){
  var st = (S.state && S.state.settings) || {};
  var e = numOr(st.extraPerMonth, 0);
  if (st.frequency === 'fortnightly') return S.round2(e * 26 / 12);
  if (st.frequency === 'weekly') return S.round2(e * 52 / 12);
  return S.round2(e);
};

S.perPeriod = function(monthly){
  var st = (S.state && S.state.settings) || {};
  if (st.frequency === 'fortnightly') return S.round2(numOr(monthly, 0) * 12 / 26);
  if (st.frequency === 'weekly') return S.round2(numOr(monthly, 0) * 12 / 52);
  return S.round2(monthly);
};

S.frequencyLabel = function(){
  var st = (S.state && S.state.settings) || {};
  for (var i = 0; i < S.FREQUENCIES.length; i++) if (S.FREQUENCIES[i].key === st.frequency) return S.FREQUENCIES[i].label;
  return 'Monthly';
};

S.paymentsFor = function(debtId){
  return ((S.state && S.state.payments) || []).filter(function(p){ return p.debtId === debtId; });
};

S.paidThisMonth = function(ym){
  ym = ym || thisMonth();
  return S.round2(S.sum(((S.state && S.state.payments) || []).filter(function(p){ return S.ymOf(p.date) === ym; }), function(p){ return p.amount; }));
};

S.toast = function(msg, kind){
  var root = document.getElementById('toastRoot');
  if (!root) return;
  var el = document.createElement('div');
  el.className = 'toast' + (kind ? ' ' + kind : '');
  el.textContent = String(msg);
  root.appendChild(el);
  setTimeout(function(){
    el.style.transition = 'opacity .25s';
    el.style.opacity = '0';
    setTimeout(function(){ if (el.parentNode) el.parentNode.removeChild(el); }, 260);
  }, 2600);
};

S.confirmDialog = function(title, body, okLabel){
  return new Promise(function(resolve){
    var done = false;
    function finish(v){ if (done) return; done = true; S.ui.closeModal(); resolve(v); }
    S.ui.modal({
      title: title,
      body: '<p>' + S.esc(body) + '</p>',
      actions: [
        { label: 'Cancel', cls: 'btn', onClick: function(){ finish(false); } },
        { label: okLabel || 'Yes, do it', cls: 'btn primary', onClick: function(){ finish(true); } }
      ],
      onClose: function(){ finish(false); }
    });
  });
};
