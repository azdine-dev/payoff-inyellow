<script>/* design-runtime:v2 */
/* Design runtime v2: applies the staff-published design doc (edited in the
   Kit's Design Mode) at boot. Does nothing while the doc is empty. Tiny
   and dependency-free on purpose; the editor itself never ships here.

   Product-agnostic. Everything product-specific comes from the manifest in
   <script id="designManifest" type="application/json"> (see
   docs/DESIGN-MODE.md): theme mechanism (attribute or class), font
   variables, token palette, columns, section labels, and "stamp" rules
   that give JS-rendered blocks a stable data-dsec after every render. */
(function(){
  "use strict";
  function readJson(id){
    try{
      var el=document.getElementById(id);
      var v=JSON.parse((el&&el.textContent)||"{}");
      return (v && typeof v==="object") ? v : {};
    }catch(e){ return {}; }
  }
  function readDoc(){ return readJson("designOverrides"); }
  var MANIFEST=(function(){
    var m=readJson("designManifest");
    m.theme=m.theme||{mode:"attr",attr:"data-theme",value:"dark"};
    m.fonts=m.fonts||{display:"--font-display",ui:"--font-ui"};
    m.fonts.displayFallback=m.fonts.displayFallback||"Georgia, serif";
    m.fonts.uiFallback=m.fonts.uiFallback||"-apple-system, BlinkMacSystemFont, sans-serif";
    m.columns=Array.isArray(m.columns)?m.columns:[];
    m.stamp=Array.isArray(m.stamp)?m.stamp:[];
    m.phoneBreakpoint=Number(m.phoneBreakpoint)||760;
    return m;
  })();
  window.__designManifest=MANIFEST;
  var STYLE_ID="designRuntimeStyles";
  function esc(v){ return String(v).replace(/[^a-zA-Z0-9_-]/g,""); }
  function darkSelector(){
    var t=MANIFEST.theme;
    if(t.mode==="class") return "html."+esc(t.class||"dark");
    return "html["+esc(t.attr||"data-theme")+'="'+esc(t.value||"dark")+'"]';
  }
  /* Light tokens must beat an app that defines its light palette under a
     themed selector (Tidemark: html[data-theme="light"]{--bg:...}), and
     must never leak into dark mode, hence "html when not dark". */
  function lightSelector(){
    var t=MANIFEST.theme;
    if(t.mode==="class") return "html:not(."+esc(t.class||"dark")+")";
    return "html:not(["+esc(t.attr||"data-theme")+'="'+esc(t.value||"dark")+'"])';
  }
  function columnIds(){ return MANIFEST.columns.map(function(c){ return c.id; }); }
  function buildCss(doc){
    var css="";
    var t=doc.tokens||{};
    var k;
    if(t.light){ var l=[]; for(k in t.light){ if(/^--[\w-]+$/.test(k)) l.push(k+":"+String(t.light[k]).replace(/[{}<>]/g,"")+";"); } if(l.length) css+=lightSelector()+"{"+l.join("")+"}\n"; }
    if(t.dark){ var d=[]; for(k in t.dark){ if(/^--[\w-]+$/.test(k)) d.push(k+":"+String(t.dark[k]).replace(/[{}<>]/g,"")+";"); } if(d.length) css+=darkSelector()+"{"+d.join("")+"}\n"; }
    if(t.fonts){
      var fd=MANIFEST.fonts.display, fu=MANIFEST.fonts.ui;
      if(t.fonts.display && fd) css+="html:root{"+fd+":'"+String(t.fonts.display).replace(/['"<>]/g,"")+"', "+MANIFEST.fonts.displayFallback+";}\n";
      if(t.fonts.ui && fu) css+="html:root{"+fu+":'"+String(t.fonts.ui).replace(/['"<>]/g,"")+"', "+MANIFEST.fonts.uiFallback+";}\n";
    }
    if(doc.styles){
      for(var id in doc.styles){
        var props=doc.styles[id], body="";
        for(var prop in props){
          if(/^[a-zA-Z-]+$/.test(prop)) body+=prop.replace(/[A-Z]/g,function(c){return "-"+c.toLowerCase();})+":"+String(props[prop]).replace(/[{}<>]/g,"")+";";
        }
        if(body) css+='[data-dstyle="'+esc(id)+'"],[data-dsec="'+esc(id)+'"]{'+body+"}\n";
      }
    }
    if(doc.hidden && doc.hidden.length){
      css+=doc.hidden.map(function(id){return '[data-dsec="'+esc(id)+'"]';}).join(",")+"{display:none !important;}\n";
    }
    var bp=MANIFEST.phoneBreakpoint;
    var layout=doc.layout||{};
    var dm=layout.desktop||{};
    /* Column order as CSS `order` too: a flex/grid column (a JS-rendered
       dashboard grid) keeps the order even when the app re-renders its
       children before the observer moves them back. */
    columnIds().forEach(function(col){
      var ids=dm[col];
      if(!ids || !ids.length) return;
      css+="@media(min-width:"+bp+"px){";
      for(var i=0;i<ids.length;i++) css+='[data-dcol="'+esc(col)+'"]>[data-dsec="'+esc(ids[i])+'"]{order:'+(i+1)+";}";
      css+="}\n";
    });
    if(dm.float){
      for(var fid in dm.float){
        var f=dm.float[fid]||{};
        var tr="transform:translate("+(Number(f.x)||0)+"px,"+(Number(f.y)||0)+"px);";
        var wd=f.w?("width:"+(Number(f.w)||0)+"px;max-width:100%;"):"";
        css+="@media(min-width:"+bp+"px){[data-dsec=\""+esc(fid)+"\"]{"+tr+wd+"position:relative;z-index:3;}}\n";
      }
    }
    var mob=layout.mobile||{};
    if(mob.order && mob.order.length){
      css+="@media(max-width:"+(bp-1)+"px){[data-dlayout]{display:flex;flex-direction:column;gap:18px;}[data-dlayout] [data-dcol]{display:contents;}";
      for(var j=0;j<mob.order.length;j++){ css+='[data-dsec="'+esc(mob.order[j])+'"]{order:'+(j+1)+";}"; }
      css+="}\n";
    }
    if(mob.float){
      for(var mfid in mob.float){
        var mf=mob.float[mfid]||{};
        css+="@media(max-width:"+(bp-1)+"px){[data-dsec=\""+esc(mfid)+"\"]{transform:translate("+(Number(mf.x)||0)+"px,"+(Number(mf.y)||0)+"px);position:relative;z-index:3;}}\n";
      }
    }
    return css;
  }
  /* Stable element ids: a path hash RELATIVE to the nearest section
     (data-dsec), prefixed with that section's id, identical to the Design
     Mode bridge's rule. Reordering sections or inserting a custom one
     therefore never retargets an edit. */
  function pathOf(el){
    var parts=[], node=el, p, i;
    while(node && node!==document.body){
      if(node!==el && node.hasAttribute && node.hasAttribute("data-dsec")){
        return node.getAttribute("data-dsec")+"|"+parts.join("/");
      }
      p=node.parentElement; if(!p) break;
      i=Array.prototype.indexOf.call(p.children, node);
      parts.unshift(node.tagName.toLowerCase()+":"+i);
      node=p;
    }
    return "body|"+parts.join("/");
  }
  function hashStr(str){
    var h=5381;
    for(var i=0;i<str.length;i++) h=((h<<5)+h+str.charCodeAt(i))>>>0;
    return h.toString(36);
  }
  function idFor(el){
    var p=pathOf(el), sec=p.slice(0,p.indexOf("|"));
    return "ds-"+(sec==="body"?"":sec.replace(/^d-/,"")+"-")+hashStr(p);
  }
  /* Give JS-rendered blocks their data-dsec from the manifest's stamp rules
     (the app's own markup may be regenerated on every render). */
  function stampSections(){
    var rules=MANIFEST.stamp, n=0;
    for(var i=0;i<rules.length;i++){
      var r=rules[i]; if(!r || !r.sel || !r.id) continue;
      var scope=r.column?document.querySelector('[data-dcol="'+esc(r.column)+'"]'):document;
      if(!scope) continue;
      var els;
      try{ els=scope.querySelectorAll(r.sel); }catch(e){ continue; }
      for(var j=0;j<els.length;j++){
        if(els[j].getAttribute("data-dsec")!==r.id){ els[j].setAttribute("data-dsec", r.id); n++; }
      }
    }
    return n;
  }
  function assignDstyles(doc){
    if(!document.body) return false;
    var want={}, any=false, k, id;
    for(k=0;k<2;k++){
      var src=k?doc.text:doc.styles;
      for(id in (src||{})){ if(id.indexOf("ds-")===0){ want[id]=true; any=true; } }
    }
    if(!any) return false;
    var all=document.body.querySelectorAll("*");
    for(var i=0;i<all.length;i++){
      var cid=idFor(all[i]);
      if(want[cid]) all[i].setAttribute("data-dstyle", cid);
      else if(all[i].getAttribute("data-dstyle") && all[i].getAttribute("data-dstyle").indexOf("ds-")===0 && !want[all[i].getAttribute("data-dstyle")]) all[i].removeAttribute("data-dstyle");
    }
    return true;
  }
  function applyText(doc){
    if(!doc.text) return;
    for(var id in doc.text){
      var nodes=document.querySelectorAll('[data-dstyle="'+esc(id)+'"]');
      for(var i=0;i<nodes.length;i++){ if(nodes[i].textContent!==String(doc.text[id])) nodes[i].textContent=String(doc.text[id]); }
    }
  }
  var applying=0;
  function applyOrder(doc){
    var desk=(doc.layout||{}).desktop||{};
    columnIds().forEach(function(col){
      var wanted=desk[col];
      if(!wanted || !wanted.length) return;
      var container=document.querySelector('[data-dcol="'+esc(col)+'"]');
      if(!container) return;
      wanted.forEach(function(sid){
        var el=document.querySelector('[data-dsec="'+esc(sid)+'"]');
        if(!el) return;
        if(el.parentElement!==container || container.lastElementChild!==el) container.appendChild(el);
      });
    });
  }
  function insertCustomSections(doc){
    if(!doc.customSections) return;
    var first=columnIds()[0];
    doc.customSections.forEach(function(cs){
      try{
        if(!cs || !cs.html || document.querySelector('[data-dsec="'+esc(cs.id)+'"]')) return;
        var holder=document.createElement("div");
        holder.innerHTML=cs.html;
        var el=holder.firstElementChild;
        if(!el) return;
        el.setAttribute("data-dsec", cs.id);
        var anchor=cs.anchor||{};
        var colId=anchor.column && columnIds().indexOf(anchor.column)>=0 ? anchor.column : first;
        var container=colId?document.querySelector('[data-dcol="'+esc(colId)+'"]'):null;
        if(!container) return;
        var after=anchor.after?document.querySelector('[data-dsec="'+esc(anchor.after)+'"]'):null;
        if(after && after.parentElement===container) container.insertBefore(el, after.nextSibling);
        else container.appendChild(el);
        if(cs.css && !document.getElementById("dcs-"+esc(cs.id))){ var st=document.createElement("style"); st.id="dcs-"+esc(cs.id); st.textContent=String(cs.css); document.head.appendChild(st); }
        if(cs.js){ window.__designPendingJs=window.__designPendingJs||[]; window.__designPendingJs.push(String(cs.js)); }
      }catch(e){}
    });
  }
  var currentDoc={};
  function applyDom(doc){
    applying++;
    try{
      stampSections();
      applyOrder(doc);
      assignDstyles(doc);
      applyText(doc);
      insertCustomSections(doc);
    } finally {
      setTimeout(function(){ applying=Math.max(0, applying-1); }, 0);
    }
  }
  /* Apps re-render their sections (innerHTML) on state changes; whatever
     was stamped, ordered or retitled would be lost. Watch the columns and
     re-apply, ignoring the mutations this runtime causes itself. */
  var observer=null, pending=null;
  function watchColumns(){
    if(observer || typeof MutationObserver!=="function") return;
    var targets=[];
    columnIds().forEach(function(c){ var el=document.querySelector('[data-dcol="'+esc(c)+'"]'); if(el) targets.push(el); });
    if(!targets.length) return;
    observer=new MutationObserver(function(){
      if(applying) return;
      if(pending) return;
      pending=setTimeout(function(){
        pending=null;
        if(!Object.keys(currentDoc).length) return;
        applyDom(currentDoc);
        try{ if(window.__runCustomSections) window.__runCustomSections(); }catch(e){}
      }, 40);
    });
    targets.forEach(function(t){ observer.observe(t, { childList: true }); });
  }
  function apply(doc){
    currentDoc=doc||{};
    var css=buildCss(currentDoc);
    var st=document.getElementById(STYLE_ID);
    if(!st){ st=document.createElement("style"); st.id=STYLE_ID; document.head.appendChild(st); }
    st.textContent=css;
    if(document.body){ applyDom(currentDoc); watchColumns(); }
    else document.addEventListener("DOMContentLoaded", function(){ applyDom(currentDoc); watchColumns(); });
    /* Late renders (data loaded a tick later) get one more pass each. */
    setTimeout(function(){ applyDom(currentDoc); watchColumns(); }, 0);
    setTimeout(function(){ applyDom(currentDoc); watchColumns(); }, 400);
  }
  window.__applyDesignDoc=apply; /* the Design Mode editor re-applies live */
  window.__designStamp=stampSections; /* the bridge stamps before measuring */
  window.__runCustomSections=function(){
    var list=window.__designPendingJs||[];
    window.__designPendingJs=[];
    list.forEach(function(code){ try{ new Function(code)(); }catch(e){} });
  };
  var embedded=readDoc();
  apply(embedded);
  /* Online mode: the runtime ships as its own file with no embedded doc;
     the published doc is fetched from the public design endpoint. */
  if(!Object.keys(embedded).length && typeof window.__DESIGN_DOC_URL==="string"){
    try{
      fetch(window.__DESIGN_DOC_URL).then(function(r){ return r.ok ? r.json() : null; }).then(function(b){
        if(b && b.doc && typeof b.doc==="object" && Object.keys(b.doc).length){
          apply(b.doc);
          try{ if(window.__runCustomSections) window.__runCustomSections(); }catch(e){}
        }
      }).catch(function(){});
    }catch(e){}
  }
})();
</script>
</body>
</html>
