function d4ApplySearch(){
  var box = document.getElementById('d4Search');
  d4View.q = box ? String(box.value) : '';
  var cards = document.querySelectorAll('#d4Grid .js-debt-card');
  var shown = 0;
  for (var i = 0; i < cards.length; i++) {
    var d = S.debt(cards[i].getAttribute('data-debt'));
    var hit = d ? d4Matches(d) : false;
    cards[i].hidden = !hit;
    if (hit) shown++;
  }
  var note = document.getElementById('d4NoHits');
  if (note) note.hidden = shown > 0 || !cards.length;
}

S.ui.page({
  key: 'debts', label: 'My debts', group: 'PLAN', icon: 'debts',
  render: function(){ return d4DebtsHtml(); },
  after: function(params){
    d4ApplySearch();
    if (params && params.open && S.debt(params.open)) {
      var id = params.open;
      setTimeout(function(){ d4OpenDialog(id); }, 0);
      if (location.hash.indexOf('open=') >= 0) {
        try { history.replaceState(null, '', '#/debts'); } catch (e) {}
      }
    } else if (params && params.add === '1') {
      setTimeout(function(){ d4OpenDialog(null); }, 0);
      try { history.replaceState(null, '', '#/debts'); } catch (e2) {}
    }
  }
});

});

S.ui.on('[data-act="d4-delete"]', 'click', function(e, el){
  var d = S.debt(el.getAttribute('data-arg'));

  S.confirmDialog('Delete ' + d.name, 'This removes the debt and its payment history from this plan. It cannot be undone.', 'Delete it')

      S.state.payments = (S.state.payments || []).filter(function(p){ return p.debtId !== d.id; });

      S.toast(d.name + ' deleted', 'warn');
      S.ui.render();
    });

S.ui.on('[data-act="d4-quickadd"]', 'click', function(){

  var bal = Math.max(0, num('d4q-bal'));
  if (!name || bal <= 0) { S.toast('A name and a balance are needed', 'warn'); return; }
  var d = d4BlankDebt();
  d.id = S.uid();
  d.name = name;
  d.balance = bal;
  d.startBalance = bal;
  d.apr = Math.max(0, num('d4q-apr'));
  d.colour = S.PALETTE[(S.state.debts.length) % S.PALETTE.length];
  S.state.debts.push(d);
  S.save();
  S.toast('Added ' + d.name, 'good');
  S.ui.render();
});

S.ui.on('#d4Search', 'input', function(){ d4ApplySearch(); });

/* A slim additive style block for the two sliders on these pages. head.html
   is shared and must not change, so this is injected once, id guarded. */
function d5Compat(){
  if (document.getElementById('snl-w2-css')) return;
  var css = [
    "input.snl-range{-webkit-appearance:none;appearance:none;width:100%;height:40px;background:transparent;cursor:pointer}",
    "input.snl-range:focus{outline:none}",
    "input.snl-range:focus-visible::-webkit-slider-runnable-track{box-shadow:0 0 0 3px var(--accent-soft)}",
    "input.snl-range::-webkit-slider-runnable-track{height:9px;border-radius:99px;background:linear-gradient(var(--accent),var(--accent)) 0 0/var(--fill,0%) 100% no-repeat,var(--line)}",
    "input.snl-range::-webkit-slider-thumb{-webkit-appearance:none;appearance:none;width:22px;height:22px;margin-top:-6.5px;border-radius:50%;background:var(--accent);border:2px solid var(--card);box-shadow:0 1px 4px rgba(0,0,0,.22)}",
    "input.snl-range::-moz-range-track{height:9px;border-radius:99px;background:var(--line)}",
    "input.snl-range::-moz-range-progress{height:9px;border-radius:99px;background:var(--accent)}",
    "input.snl-range::-moz-range-thumb{width:20px;height:20px;border:2px solid var(--card);border-radius:50%;background:var(--accent)}"
  ].join('\n');
  var tag = document.createElement('style');
  tag.id = 'snl-w2-css';
  tag.textContent = css;
  document.head.appendChild(tag);
}
d5Compat();

function d5Fill(el){
  var min = Number(el.min) || 0, max = Number(el.max) || 100;
  var pct = max > min ? (Number(el.value) - min) / (max - min) * 100 : 0;
  el.style.setProperty('--fill', S.clamp(pct, 0, 100) + '%');
}

function d5Settings(){
  if (!S.state.settings) S.state.settings = {};
  return S.state.settings;
}

function d5Strat(){ return d5Settings().strategy || 'snowball'; }

function d5FreqWord(){
  var f = d5Settings().frequency;
  if (f === 'fortnightly') return 'fortnight';
  if (f === 'weekly') return 'week';
  return 'month';
}

function d5Colour(debt, i){
  if (debt && debt.colour) return debt.colour;
  return S.PALETTE[i % S.PALETTE.length];
}

function d5DownloadText(filename, text, mime){
  try {
    var blob = new Blob([text], { type: mime || 'text/csv;charset=utf-8' });
    var url = URL.createObjectURL(blob);
    var a = document.createElement('a');
    a.href = url;
    a.download = filename;
    document.body.appendChild(a);
    a.click();
    setTimeout(function(){ document.body.removeChild(a); URL.revokeObjectURL(url); }, 400);
    return true;
  } catch (e) { return false; }
}

function d5Csv(v){
  var s = String(v == null ? '' : v);
  return /[",\n]/.test(s) ? '"' + s.replace(/"/g, '""') + '"' : s;
}

function d5ScheduleCard(){
  var proj = S.engine.project({});
  var q = String(d5SchedQ || '').trim().toLowerCase();

  var body = proj.schedule.map(function(mo, i){
    var open = !!d5Open[mo.ym];
    var hay = (mo.label + ' ' + mo.rows.map(function(r){ return r.name; }).join(' ')).toLowerCase();
    var hit = !q || hay.indexOf(q) >= 0;
    var head = '<tr class="js-mo' + (open ? ' group-row' : '') + '" data-ym="' + S.esc(mo.ym) + '"' + (hit ? '' : ' hidden') + '>' +
      '<td><button type="button" class="btn sm ghost" data-act="d5-month" data-arg="' + S.esc(mo.ym) + '" aria-expanded="' + (open ? 'true' : 'false') + '">' +
      S.ui.svg(open ? 'chevronDown' : 'chevron', 15) + '<span>' + S.esc(mo.label) + '</span></button></td>' +
      '<td class="num">' + S.esc(S.money(mo.startBalance)) + '</td>' +
      '<td class="num">' + S.esc(S.money(mo.payment)) + '</td>' +
      '<td class="num">' + S.esc(S.money(mo.interest)) + '</td>' +
      '<td class="num">' + S.esc(S.money(mo.principal)) + '</td>' +
      '<td class="num">' + S.esc(S.money(mo.endBalance)) + '</td></tr>';

    var detail = '';
    if (open) {
      detail = mo.rows.map(function(r){
        return '<tr class="js-mo-row" data-ym="' + S.esc(mo.ym) + '"' + (hit ? '' : ' hidden') + '>' +
          '<td style="padding-left:26px"><a href="' + d4OpenDebtHref(r.debtId) + '">' + S.esc(r.name) + '</a>' +
          (r.paidOffThisMonth ? ' <span class="chip good">clears</span>' : '') + '</td>' +
          '<td class="num">' + S.esc(S.money(r.startBalance)) + '</td>' +
          '<td class="num">' + S.esc(S.money(r.payment)) + '</td>' +
          '<td class="num">' + S.esc(S.money(r.interest)) + '</td>' +
          '<td class="num">' + S.esc(S.money(r.principal)) + '</td>' +
          '<td class="num">' + S.esc(S.money(r.endBalance)) + '</td></tr>';
      }).join('');
    }
    return head + detail;
  }).join('');

  var anyHit = proj.schedule.some(function(mo){
    var hay = (mo.label + ' ' + mo.rows.map(function(r){ return r.name; }).join(' ')).toLowerCase();
    return !q || hay.indexOf(q) >= 0;
  });

  return d4Card({
    title: 'Every month until it is gone',
    sub: S.esc(S.monthsWords(proj.months)) + ' of payments, ' + S.esc(S.money(proj.totalPaid)) + ' in total',

      '<input type="search" id="d5SchedSearch" placeholder="A month or a debt name" autocomplete="off" value="' + S.esc(d5SchedQ) + '"></label></div></div>' +
      '<div class="tbl-wrap"><table class="tbl"><thead><tr>' +

/* Pressing a button blurs whatever box was being typed in, and that blur
   commits the typed value. If the commit redrew the page there and then, the
   button would be replaced before its click landed and the press would be
   swallowed, so the first press of Apply or a bump button would do nothing.
   d5RenderSoon holds the redraw until the press has been served. */
var d5BtnPress = false;
var d5RenderPending = false;
document.addEventListener('pointerdown', function(ev){
  var t = ev.target;
  d5BtnPress = !!(t && t.closest && t.closest('#view [data-act], #view button, #view label'));
}, true);
document.addEventListener('keydown', function(){ d5BtnPress = false; }, true);
document.addEventListener('click', function(){
  d5BtnPress = false;
  if (d5RenderPending) { d5RenderPending = false; S.ui.render(); }
});

function d5RenderSoon(){
  if (d5BtnPress) { d5RenderPending = true; return; }
  S.ui.render();
}

S.ui.on('[data-act="d5-bump"]', 'click', function(e, el){
  d5RenderPending = false;
  var add = Number(el.getAttribute('data-arg')) || 0;
  var st = d5Settings();
  st.extraPerMonth = Math.max(0, (Number(st.extraPerMonth) || 0) + add);
  d5SaveSettings();
  S.ui.render();
  S.toast('Extra is now ' + S.money(st.extraPerMonth) + ' a ' + d5FreqWord(), 'good');
});

function d5LiveFigures(extraValue){
  var proj = S.engine.project({ extra: Math.max(0, Number(extraValue) || 0) });
  var mins = S.engine.minimumsOnly({});
  function set(id, text){ var el = document.getElementById(id); if (el) el.textContent = text; }
  set('d5FigDate', S.engine.headline(proj).text);
  set('d5FigInt', S.money(proj.totalInterest));
  set('d5FigSave', S.money(S.round2(mins.totalInterest - proj.totalInterest)));
  set('d5FigMonths', S.monthsWords(Math.max(0, mins.months - proj.months)));
}

S.ui.on('#d5Order .oitem', 'dragstart', function(e, el){
  d5Drag = el.getAttribute('data-id');
  el.classList.add('dragging');
  if (e.dataTransfer) { e.dataTransfer.effectAllowed = 'move'; try { e.dataTransfer.setData('text/plain', d5Drag); } catch (err) {} }
});

S.ui.on('#d5Order .oitem', 'dragover', function(e, el){
  if (!d5Drag) return;
  e.preventDefault();
  if (e.dataTransfer) e.dataTransfer.dropEffect = 'move';
  var list = document.getElementById('d5Order');
  if (!list) return;
  var all = list.querySelectorAll('.oitem');
  for (var i = 0; i < all.length; i++) all[i].classList.toggle('over', all[i] === el && all[i].getAttribute('data-id') !== d5Drag);
});

S.ui.on('#d5Order .oitem', 'drop', function(e, el){
  e.preventDefault();
  var target = el.getAttribute('data-id');
  if (!d5Drag || !target || d5Drag === target) return;
  var st = d5Settings();
  var list = document.getElementById('d5Order');
  var ids = [];
  if (list) {
    var all = list.querySelectorAll('.oitem');
    for (var i = 0; i < all.length; i++) ids.push(all[i].getAttribute('data-id'));
  }
  var from = ids.indexOf(d5Drag);
  var to = ids.indexOf(target);
  if (from < 0 || to < 0) return;
  ids.splice(from, 1);
  ids.splice(to, 0, d5Drag);
  st.customOrder = ids;
  st.strategy = 'custom';
  d5Drag = null;
  d5SaveSettings();
  S.ui.render();
  S.toast('Order saved', 'good');
});

S.ui.on('#d5Order .oitem', 'dragend', function(){
  d5Drag = null;
  var list = document.getElementById('d5Order');
  if (!list) return;
  var all = list.querySelectorAll('.oitem');
  for (var i = 0; i < all.length; i++) { all[i].classList.remove('dragging'); all[i].classList.remove('over'); }
});

function d5CompareRuns(){
  var out = [];
  var mins = S.engine.minimumsOnly({});
  S.engine.STRATEGIES.forEach(function(s){
    var p = S.engine.project({ strategy: s.key });
    out.push({
      key: s.key, name: s.name, rule: s.rule, proj: p,
      months: p.months, payoffMonth: p.payoffMonth,
      totalInterest: p.totalInterest, totalPaid: p.totalPaid,
      savedVsMinimums: S.round2(mins.totalInterest - p.totalInterest),
      monthsSavedVsMinimums: mins.months - p.months
    });
  });
  out.sort(function(a, b){ return a.totalInterest - b.totalInterest || a.months - b.months; });
  return { rows: out, mins: mins };
}

function d5CompareHtml(){
  if (!S.activeDebts().filter(function(d){ return Number(d.balance) > 0; }).length) {
    return '<section class="sec sec-compare-1">' + d4Card({
      title: 'Nothing to compare yet',
      body: '<div class="empty"><p>Add a debt and all six methods can be lined up side by side.</p>' +
        '<div class="row tight" style="justify-content:center;margin-top:14px"><a class="btn primary" href="#/debts">Go to my debts</a></div></div>'
    }) + '</section>';
  }

  var run = d5CompareRuns();
  var rows = run.rows;
  var chosenKey = d5Strat();
  var chosen = null, best = rows[0], worst = rows[rows.length - 1];
  rows.forEach(function(r){ if (r.key === chosenKey) chosen = r; });
  if (!chosen) chosen = best;

  var table = '<div class="tbl-wrap"><table class="tbl"><thead><tr>' +
    '<th style="min-width:150px">Method</th><th>Debt free</th><th class="num">Months</th><th class="num">Interest</th><th class="num">Total paid</th>' +
    '<th class="num">Saved vs minimums</th><th class="num">Vs your pick</th><th class="acts"></th>' +
    '</tr></thead><tbody>' + rows.map(function(r){
      var diff = S.round2(r.totalInterest - chosen.totalInterest);
      var diffText = r.key === chosen.key ? 'Your pick' : (diff < 0 ? S.money(Math.abs(diff)) + ' less' : (diff > 0 ? S.money(diff) + ' more' : 'The same'));
      var diffCls = r.key === chosen.key ? 'c-accent' : (diff < 0 ? 'c-green' : (diff > 0 ? 'c-clay' : ''));
      return '<tr' + (r.key === chosen.key ? ' class="chosen-row"' : '') + '>' +
        '<td><b>' + S.esc(r.name) + '</b><div class="sub" style="font-size:12px">' + S.esc(r.rule) + '</div></td>' +
        '<td class="nowrap">' + S.esc(r.payoffMonth ? S.monthLabel(r.payoffMonth) : 'not clearing') + '</td>' +
        '<td class="num">' + S.esc(S.num(r.months)) + '</td>' +
        '<td class="num">' + S.esc(S.money(r.totalInterest)) + '</td>' +
        '<td class="num">' + S.esc(S.money(r.totalPaid)) + '</td>' +
        '<td class="num c-green">' + S.esc(S.money(r.savedVsMinimums)) + '</td>' +
        '<td class="num ' + diffCls + '">' + S.esc(diffText) + '</td>' +
        '<td class="acts">' + (r.key === chosen.key ? '<span class="chip accent">In use</span>'
          : S.ui.btn({ label: 'Switch to this one', kind: 'sm', act: 'd5-switch', arg: r.key })) + '</td></tr>';
    }).join('') + '</tbody></table></div>' +
    '<p class="scroll-note">Swipe the table sideways to see every column.</p>';

  var bars = d4Bars({
    rows: rows.map(function(r, i){
      return { label: r.name, sub: S.monthsWords(r.months), value: r.totalInterest,
        colour: r.key === chosen.key ? '#C6892F' : (i === 0 ? '#2F6D57' : '#4F7F97') };
    })
  });

  var maxLen = 0;
  rows.forEach(function(r){ if (r.proj.schedule.length > maxLen) maxLen = r.proj.schedule.length; });
  var lines = rows.map(function(r, i){
    var pts = [{ label: S.monthLabel(r.proj.startMonth), y: r.proj.startTotal }];
    for (var m = 0; m < maxLen; m++) {
      var mo = r.proj.schedule[m];
      pts.push({ label: mo ? mo.label : (pts[pts.length - 1].label), y: mo ? mo.endBalance : 0 });
    }
    return { name: r.name, colour: S.PALETTE[i % S.PALETTE.length], points: pts };
  });

  var gap = S.round2(worst.totalInterest - best.totalInterest);
  var monthsGap = worst.months - best.months;
  var copy = '<p>On your own numbers the cheapest method here is <b>' + S.esc(best.name) + '</b> at ' +
    S.esc(S.money(best.totalInterest)) + ' of interest, and the dearest is <b>' + S.esc(worst.name) + '</b> at ' +
    S.esc(S.money(worst.totalInterest)) + '. The gap between them is ' + S.esc(S.money(gap)) +
    (monthsGap ? ' and ' + S.esc(S.monthsWords(Math.abs(monthsGap))) : '') + '.</p>' +
    '<p style="margin-top:10px">' + (chosen.key === best.key
      ? 'You are already on the cheapest of the six. The trade off is that the smallest balances may hang around longer, so if you need an early win to stay in it, ' + S.esc(rows.filter(function(r){ return r.key === 'snowball'; }).length ? 'the snowball' : 'a smaller first target') + ' costs a little more and pays you back in motivation.'
      : 'Your pick, ' + S.esc(chosen.name) + ', costs ' + S.esc(S.money(S.round2(chosen.totalInterest - best.totalInterest))) +
        ' more than ' + S.esc(best.name) + '. That is the price of the order you like. If the early wins keep you paying, it is money well spent. If they do not, switching is one tap.') + '</p>' +
    '<p style="margin-top:10px">Every method here clears the same debts with the same money. All that changes is which one gets the extra first, so the difference is interest and time, never the amount you owe.</p>';

  return '<section class="sec sec-compare-1">' +
    '<div class="sec-head"><h2>Six ways to finish</h2><p>The same debts and the same extra, ordered six different ways.</p></div>' +
    d4Card({ title: 'Side by side', sub: 'Sorted by the least interest paid', body: table }) + '</section>' +
    '<section class="sec sec-compare-2">' + d4Card({
      title: 'Interest paid by method',
      sub: 'Shorter is cheaper',
      body: bars
    }) + '</section>' +
    '<section class="sec sec-compare-3">' + d4Card({
      title: 'What is left, month by month',
      sub: 'One line per method, from today to the last payment',
      body: d4Line({ series: lines, height: 250, minWidth: 520 })
    }) + '</section>' +
    '<section class="sec sec-compare-4">' + d4Card({
      title: 'The real trade off',
      sub: 'Written with your own figures',
      body: '<div class="note">' + copy + '</div>'
    }) + '</section>';
}

    body: d5DebtPicker('d5-bt-pick', d5If.bt.ids) +
      '<div class="filters" style="margin-top:12px">' +
      '<div class="f"><label for="d5IfBtApr">Promo rate</label><input type="text" id="d5IfBtApr" inputmode="decimal" value="' + S.esc(String(d5If.bt.apr)) + '"></div>' +
      '<div class="f"><label for="d5IfBtMonths">Promo months</label><input type="text" id="d5IfBtMonths" inputmode="numeric" value="' + S.esc(String(d5If.bt.months)) + '"></div>' +
      '<div class="f"><label for="d5IfBtFee">Fee percent</label><input type="text" id="d5IfBtFee" inputmode="decimal" value="' + S.esc(String(d5If.bt.fee)) + '"></div>' +
      '<div class="f"><label for="d5IfBtRevert">Rate after the promo</label><input type="text" id="d5IfBtRevert" inputmode="decimal" value="' + S.esc(String(d5If.bt.revert)) + '"></div>' +
      '</div>' +
      d5ResultTiles({
        date: S.engine.headline(bt.next).text, dateSub: 'Instead of ' + S.engine.headline(bt.base).text,
        monthsSaved: bt.monthsSaved, interestSaved: bt.interestSaved
      }) +
      '<div class="grid g3" style="margin-top:12px">' +
      d4Stat({ label: 'Moving across', value: S.esc(S.money(bt.moved)), sub: 'From ' + S.esc(S.num(d5If.bt.ids.length)) + ' ' + S.plural(d5If.bt.ids.length, 'debt') }) +
      d4Stat({ label: 'Fee to pay', value: S.esc(S.money(bt.fee)), sub: S.esc(S.pct(d5If.bt.fee, 2)) + ' of the balance', tone: 'warn' }) +
      d4Stat({ label: 'Break even', value: S.esc(bt.breakEvenMonths ? 'Month ' + bt.breakEvenMonths : 'Never'), sub: bt.breakEvenMonths ? 'When the saving passes the fee' : 'The fee is never earned back' }) +
      '</div>' + d5Verdict(bt.worthIt, bt.note)
  });

  /* 4. consolidation loan */
  var con = S.engine.consolidate({
    debtIds: d5If.con.ids, apr: d5If.con.apr, termMonths: d5If.con.term, feePct: d5If.con.fee
  });
  var conCard = d4Card({
    title: 'Roll them into one loan',
    sub: 'One payment, one rate, one finish date',
    actions: S.ui.btn({ label: 'Apply to my plan', kind: 'sm primary', act: 'd5-apply-con' }),
    body: d5DebtPicker('d5-con-pick', d5If.con.ids) +
      '<div class="filters" style="margin-top:12px">' +
      '<div class="f"><label for="d5IfConApr">Loan rate</label><input type="text" id="d5IfConApr" inputmode="decimal" value="' + S.esc(String(d5If.con.apr)) + '"></div>' +
      '<div class="f"><label for="d5IfConTerm">Term in months</label><input type="text" id="d5IfConTerm" inputmode="numeric" value="' + S.esc(String(d5If.con.term)) + '"></div>' +
      '<div class="f"><label for="d5IfConFee">Fee percent</label><input type="text" id="d5IfConFee" inputmode="decimal" value="' + S.esc(String(d5If.con.fee)) + '"></div>' +
      '</div>' +
      d5ResultTiles({
        date: S.engine.headline(con.next).text, dateSub: 'Instead of ' + S.engine.headline(con.base).text,
        monthsSaved: con.monthsSaved, interestSaved: con.interestSaved
      }) +
      '<div class="grid g3" style="margin-top:12px">' +
      d4Stat({ label: 'Loan amount', value: S.esc(S.money(con.principal || 0)), sub: 'Balances plus the fee' }) +
      d4Stat({ label: 'Payment a month', value: S.esc(S.money(con.payment)), sub: 'Over ' + S.esc(S.monthsWords(con.term || d5If.con.term)) }) +
      d4Stat({ label: 'Break even', value: S.esc(con.breakEvenMonths ? 'Month ' + con.breakEvenMonths : 'Never'), sub: con.breakEvenMonths ? 'When the saving passes the fee' : 'The fee is never earned back' }) +
      '</div>' + d5Verdict(con.worthIt, con.note)
  });

  return '<section class="sec sec-whatif-1">' +
    '<div class="sec-head"><h2>What if</h2><p>Try a change here first. Nothing moves until you say so.</p></div>' +
    extraCard + '</section>' +
    '<section class="sec sec-whatif-2">' + windCard + '</section>' +
    '<section class="sec sec-whatif-3">' + btCard + '</section>' +
    '<section class="sec sec-whatif-4">' + conCard + '</section>';
}

/* ---------------------------------------------------------------- */
/* shared helpers                                                    */

var SL6_KINDS = [
  { key: 'regular', label: 'Regular payment' },
  { key: 'extra', label: 'Extra payment' },
  { key: 'snowflake', label: 'Snowflake' }
];

function sl6_kindLabel(k){
  for (var i = 0; i < SL6_KINDS.length; i++) if (SL6_KINDS[i].key === k) return SL6_KINDS[i].label;
  return 'Regular payment';
}

function sl6_payments(){
  return (S.state && S.state.payments) || [];
}

function sl6_debtName(id){
  var d = S.debt(id);
  return d ? d.name : 'Removed debt';
}

function sl6_debtColour(id){
  var d = S.debt(id);
  return (d && d.colour) || '#C6892F';
}

function sl6_download(text, filename, mime){
  var blob = new Blob([text], { type: mime || 'text/plain;charset=utf-8' });
  var url = URL.createObjectURL(blob);
  var a = document.createElement('a');
  a.href = url;
  a.download = filename;
  a.style.display = 'none';
  document.body.appendChild(a);
  a.click();
  a.remove();
  setTimeout(function(){ URL.revokeObjectURL(url); }, 4000);
  return text;
}

/* A payment moves the balance of its debt. Applying stores exactly how
   much came off, so editing or deleting later puts back the same
   figure even when the balance was clamped at zero. */
function sl6_applyPayment(p){
  var d = S.debt(p.debtId);
  if (!d) { p.applied = 0; return 0; }
  var want = S.round2(Math.max(0, Number(p.amount) || 0));
  var take = Math.min(want, S.round2(Math.max(0, Number(d.balance) || 0)));
  d.balance = S.round2((Number(d.balance) || 0) - take);
  if (d.balance < 0) d.balance = 0;
  p.applied = take;
  return take;
}

function sl6_reversePayment(p){
  var d = S.debt(p.debtId);
  if (!d) return 0;
  var back = (p.applied === undefined || p.applied === null)
    ? S.round2(Math.max(0, Number(p.amount) || 0))
    : S.round2(Math.max(0, Number(p.applied) || 0));
  d.balance = S.round2((Number(d.balance) || 0) + back);
  if (!d.startBalance || d.startBalance < d.balance) d.startBalance = d.balance;
  return back;
}

function sl6_debtOptions(selected){
  return S.activeDebts().map(function(d){
    return { value: d.id, label: d.name };
  }).concat(selected && !S.debt(selected) ? [{ value: selected, label: 'Removed debt' }] : []);
}

/* ================================================================
   PAGE: log
   ================================================================ */

var sl6_logF = { debt: '', kind: '', month: '' };

function sl6_logRows(){
  var list = sl6_payments().slice();
  list = list.filter(function(p){
    if (sl6_logF.debt && p.debtId !== sl6_logF.debt) return false;
    if (sl6_logF.kind && (p.kind || 'regular') !== sl6_logF.kind) return false;
    if (sl6_logF.month && S.ymOf(p.date) !== sl6_logF.month) return false;
    return true;
  });
  list.sort(function(a, b){ return a.date < b.date ? 1 : a.date > b.date ? -1 : 0; });
  return list;
}

function sl6_logMonths(){
  var seen = {}, out = [];
  sl6_payments().forEach(function(p){
    var ym = S.ymOf(p.date);
    if (ym && !seen[ym]) { seen[ym] = 1; out.push(ym); }
  });
  out.sort();
  out.reverse();
  return out;
}

function sl6_logRender(){
  var thisYm = S.today().slice(0, 7);
  var paidNow = S.paidThisMonth(thisYm);
  var planned = S.monthlyPot();
  var all = sl6_payments();
  var totalPaid = S.round2(S.sum(all, function(p){ return p.amount; }));
  var extraPaid = S.round2(S.sum(all.filter(function(p){
    return (p.kind || 'regular') !== 'regular';
  }), function(p){ return p.amount; }));

  var gap = S.round2(paidNow - planned);
  var gapNote = gap >= 0
    ? 'You are ' + S.money(gap) + ' ahead of the plan this month.'
    : S.money(Math.abs(gap)) + ' still to go to hit the plan this month.';

  /* section 1: where this month sits */
  var s1 = '<section class="sec sec-log-1" data-dsec="d-log-1">' +
    '<div class="sec-head"><h2>Payment log</h2>' +
    '<p>Every payment you make, written down. Logging one takes it straight off that balance.</p></div>' +
    '<div class="grid g2">' +
      U.card({
        title: 'This month',
        sub: S.monthLabel(thisYm),
        actions: U.btn({ label: 'Log a payment', kind: 'primary', icon: 'plus', act: 'log-add' }),
        body: U.pair(
          { label: 'Paid so far', value: S.money(paidNow), size: 'lg', tone: paidNow >= planned ? 'good' : '' },
          { label: 'Planned', value: S.money(planned), size: 'lg' }
        ) + '<p class="note' + (gap >= 0 ? ' good' : '') + '" style="margin-top:14px">' + S.esc(gapNote) + '</p>'
      }) +
      U.card({
        title: 'Since you started',
        sub: 'Across every debt on the plan',
        body: U.pair(
          { label: 'Total paid', value: S.money(totalPaid), size: 'lg' },
          { label: 'Above the minimums', value: S.money(extraPaid), size: 'lg', tone: 'accent' }
        ) + '<div style="margin-top:14px"><div class="prog-l"><span>Paid off so far</span><span>' + S.pct(S.pctPaid(), 0) + '</span></div>' +
          U.prog(S.pctPaid()) + '</div>'
      }) +
    '</div></section>';

  /* section 2: monthly totals */
  var months = [];
  var startYm = S.addMonths(thisYm, -11);
  for (var i = 0; i < 12; i++) months.push(S.addMonths(startYm, i));
  var barRows = months.map(function(ym, ix){
    return {
      label: S.monthLabel(ym),
      value: S.paidThisMonth(ym),
      colour: ym === thisYm ? '#C6892F' : '#2F6D57'
    };
  });
  var anyBar = barRows.some(function(r){ return r.value > 0; });
  /* A run of empty months at the front reads as broken rather than honest, so
     the chart opens on the first month that has anything in it. */
  if (anyBar) {
    var firstPaid = 0;
    while (firstPaid < barRows.length - 1 && barRows[firstPaid].value <= 0) firstPaid++;
    barRows = barRows.slice(firstPaid);
  }

  var s2 = '<section class="sec sec-log-2" data-dsec="d-log-2">' +
    '<div class="sec-head"><h2>What you have been paying</h2>' +
    '<p>Each month you have logged, with this month against the plan.</p></div>' +
    U.card({
      title: 'Paid each month',
      sub: 'Every kind of payment counted together',
      body: anyBar ? U.chart.bars({ rows: barRows }) : U.empty('Log a payment and this chart fills in')
    }) + '</section>';

  /* section 3: the table */
  var rows = sl6_logRows();
  var lastYm = '';
  var monthTotal = {};
  rows.forEach(function(p){
    var ym = S.ymOf(p.date);
    monthTotal[ym] = S.round2((monthTotal[ym] || 0) + (Number(p.amount) || 0));
  });
  var tRows = [];
  rows.forEach(function(p){
    var ym = S.ymOf(p.date);
    if (ym !== lastYm) {
      lastYm = ym;
      tRows.push({
        cls: 'group-row',
        cells: [S.monthLabel(ym), '', S.money(monthTotal[ym]), '', '']
      });
    }
    tRows.push({
      id: p.id,
      cells: [
        S.esc(S.dateStr(p.date)),
        '<span class="chip" style="border-color:transparent;background:' + S.esc(sl6_debtColour(p.debtId)) + '22">' +
          S.esc(sl6_debtName(p.debtId)) + '</span>',
        S.money(p.amount),
        U.chip(S.esc(sl6_kindLabel(p.kind)), (p.kind === 'snowflake' ? 'sky' : p.kind === 'extra' ? 'accent' : '')) +
          (p.note ? '<div class="hint">' + S.esc(p.note) + '</div>' : ''),
        '<button type="button" class="btn sm" data-act="log-edit" data-arg="' + S.esc(p.id) + '">Edit</button> ' +
        '<button type="button" class="btn sm danger" data-act="log-del" data-arg="' + S.esc(p.id) + '">Delete</button>'
      ]
    });
  });

  var filterExtra =
    '<div class="f"><label for="sl6-f-debt">Debt</label><select id="sl6-f-debt" class="sl6-lf" data-f="debt">' +
      '<option value="">Every debt</option>' +
      S.activeDebts().map(function(d){

function sl6_payModal(id){
  var editing = null;
  if (id) {
    sl6_payments().forEach(function(p){ if (p.id === id) editing = p; });
  }
  var debts = S.activeDebts();
  if (!debts.length) { S.toast('Add a debt first', 'warn'); return; }
  var cur = editing || { debtId: debts[0].id, date: S.today(), amount: '', kind: 'regular', note: '' };

  var body =
    U.field({ id: 'sl6-p-debt', type: 'select', label: 'Which debt', value: cur.debtId, options: sl6_debtOptions(cur.debtId) }) +
    '<div class="grid g2">' +
      U.field({ id: 'sl6-p-date', type: 'date', label: 'Date', value: cur.date }) +
      U.field({ id: 'sl6-p-amount', label: 'Amount', value: cur.amount === '' ? '' : cur.amount, inputmode: 'decimal', placeholder: '0.00' }) +
    '</div>' +
    U.field({ id: 'sl6-p-kind', type: 'select', label: 'Kind', value: cur.kind || 'regular', options: SL6_KINDS.map(function(k){ return { value: k.key, label: k.label }; }) }) +
    U.field({ id: 'sl6-p-note', type: 'textarea', label: 'Note', value: cur.note || '', rows: 2, placeholder: 'Optional' }) +
    '<p class="note">Saving this takes the amount straight off that debt. Editing or deleting it later puts the balance back.</p>';

  U.modal({
    title: editing ? 'Edit payment' : 'Log a payment',
    body: body,
    onOpen: function(scrim){
      U.fmtInput(scrim.querySelector('#sl6-p-amount'), { cents: true });
    },
    actions: [
      { label: 'Cancel', kind: 'ghost' },
      { label: editing ? 'Save changes' : 'Log it', kind: 'primary', onClick: function(scrim){
        var debtId = scrim.querySelector('#sl6-p-debt').value;
        var date = scrim.querySelector('#sl6-p-date').value || S.today();
        var amount = S.round2(U.numValue(scrim.querySelector('#sl6-p-amount')));
        var kind = scrim.querySelector('#sl6-p-kind').value || 'regular';
        var note = scrim.querySelector('#sl6-p-note').value || '';
        if (!(amount > 0)) { S.toast('Put in an amount above zero', 'warn'); return false; }
        if (!S.debt(debtId)) { S.toast('Pick a debt', 'warn'); return false; }

        if (editing) {
          sl6_reversePayment(editing);
          editing.debtId = debtId;
          editing.date = date;
          editing.amount = amount;
          editing.kind = kind;
          editing.note = note;
          sl6_applyPayment(editing);
          S.save();
          S.toast('Payment updated', 'good');
        } else {
          var p = { id: S.uid(), debtId: debtId, date: date, amount: amount, kind: kind, note: note };
          sl6_applyPayment(p);
          S.state.payments.push(p);
          S.save();
          S.toast(S.money(amount) + ' off ' + S.debt(debtId).name, 'good');
        }
        U.render();
      } }
    ]
  });
}

function sl6_logDelete(id){
  var p = null;
  sl6_payments().forEach(function(x){ if (x.id === id) p = x; });
  if (!p) return;
  S.confirmDialog(
    'Delete this payment',
    S.money(p.amount) + ' on ' + S.dateStr(p.date) + ' for ' + sl6_debtName(p.debtId) + '. The balance goes back up by the same amount.',

  ).then(function(ok){
    if (!ok) return;
    sl6_reversePayment(p);
    var ix = S.state.payments.indexOf(p);

    S.save();

    U.render();
  });
}

var sl6_calYm = null;

function sl6_pad2(n){ return (n < 10 ? '0' : '') + n; }

function sl6_icsEscape(s){
  return String(s == null ? '' : s)
    .replace(/\\/g, '\\\\').replace(/;/g, '\\;').replace(/,/g, '\\,').replace(/\r?\n/g, '\\n');
}

function sl6_icsStamp(d){
  return d.getUTCFullYear() + sl6_pad2(d.getUTCMonth() + 1) + sl6_pad2(d.getUTCDate()) +
    'T' + sl6_pad2(d.getUTCHours()) + sl6_pad2(d.getUTCMinutes()) + sl6_pad2(d.getUTCSeconds()) + 'Z';
}

function sl6_icsDay(dateStr){ return String(dateStr || '').replace(/-/g, ''); }

function sl6_nextDay(dateStr){
  var d = S.parseDate(dateStr);
  d.setDate(d.getDate() + 1);
  return d.getFullYear() + '-' + sl6_pad2(d.getMonth() + 1) + '-' + sl6_pad2(d.getDate());
}

/* events: [{ uid, date, summary, description, monthDay }] */
function sl6_buildIcs(events){
  var now = sl6_icsStamp(new Date());
  var lines = [
    'BEGIN:VCALENDAR',
    'VERSION:2.0',
    'PRODID:-//AY Studios//Debt Snowball//EN',
    'CALSCALE:GREGORIAN',
    'METHOD:PUBLISH'
  ];
  events.forEach(function(e){
    lines.push('BEGIN:VEVENT');
    lines.push('UID:' + sl6_icsEscape(e.uid) + '@debtsnowball.aystudios.app');
    lines.push('DTSTAMP:' + now);
    lines.push('DTSTART;VALUE=DATE:' + sl6_icsDay(e.date));
    lines.push('DTEND;VALUE=DATE:' + sl6_icsDay(sl6_nextDay(e.date)));
    lines.push('RRULE:FREQ=MONTHLY;BYMONTHDAY=' + (e.monthDay || S.parseDate(e.date).getDate()));
    lines.push('SUMMARY:' + sl6_icsEscape(e.summary));
    if (e.description) lines.push('DESCRIPTION:' + sl6_icsEscape(e.description));
    lines.push('TRANSP:TRANSPARENT');
    lines.push('BEGIN:VALARM');
    lines.push('TRIGGER:-P1D');
    lines.push('ACTION:DISPLAY');
    lines.push('DESCRIPTION:' + sl6_icsEscape(e.summary));
    lines.push('END:VALARM');
    lines.push('END:VEVENT');
  });
  lines.push('END:VCALENDAR');
  return lines.join('\r\n') + '\r\n';
}

function sl6_buildIcsTodo(events){
  var now = sl6_icsStamp(new Date());
  var lines = ['BEGIN:VCALENDAR', 'VERSION:2.0', 'PRODID:-//AY Studios//Debt Snowball//EN', 'CALSCALE:GREGORIAN'];
  events.forEach(function(e){
    lines.push('BEGIN:VTODO');
    lines.push('UID:todo-' + sl6_icsEscape(e.uid) + '@debtsnowball.aystudios.app');
    lines.push('DTSTAMP:' + now);
    lines.push('DUE;VALUE=DATE:' + sl6_icsDay(e.date));
    lines.push('RRULE:FREQ=MONTHLY;BYMONTHDAY=' + (e.monthDay || S.parseDate(e.date).getDate()));
    lines.push('SUMMARY:' + sl6_icsEscape(e.summary));
    if (e.description) lines.push('DESCRIPTION:' + sl6_icsEscape(e.description));
    lines.push('STATUS:NEEDS-ACTION');
    lines.push('END:VTODO');
  });
  lines.push('END:VCALENDAR');
  return lines.join('\r\n') + '\r\n';
}

function sl6_googleUrl(e){
  var start = sl6_icsDay(e.date);
  var end = sl6_icsDay(sl6_nextDay(e.date));
  return 'https://calendar.google.com/calendar/render?action=TEMPLATE' +
    '&text=' + encodeURIComponent(e.summary) +
    '&dates=' + start + '/' + end +
    '&details=' + encodeURIComponent(e.description || '') +
    '&recur=' + encodeURIComponent('RRULE:FREQ=MONTHLY;BYMONTHDAY=' + (e.monthDay || S.parseDate(e.date).getDate()));
}

/* one reminder event per debt, from the month showing */
function sl6_calEvents(ym){
  var proj = E.project({});
  var sched = null;
  for (var i = 0; i < proj.schedule.length; i++) if (proj.schedule[i].ym === ym) sched = proj.schedule[i];
  var past = ym < proj.startMonth;
  var out = [];

  if (past) {
    sl6_payments().forEach(function(p){
      if (S.ymOf(p.date) !== ym) return;
      var d = S.debt(p.debtId);
      out.push({
        uid: p.id,
        debtId: p.debtId,
        name: sl6_debtName(p.debtId),
        colour: sl6_debtColour(p.debtId),
        date: p.date,
        day: S.parseDate(p.date).getDate(),
        amount: p.amount,
        planned: false,
        dueDay: d ? d.dueDay : S.parseDate(p.date).getDate()
      });
    });
  } else {
    S.activeDebts().forEach(function(d){
      var amount = null;
      if (sched) {
        sched.rows.forEach(function(r){ if (r.debtId === d.id && r.payment > 0) amount = r.payment; });
      }
      if (amount === null) return;
      var date = S.dueDate(ym, d.dueDay);
      out.push({
        uid: 'due-' + d.id + '-' + ym,
        debtId: d.id,
        name: d.name,
        colour: d.colour,
        date: date,
        day: S.parseDate(date).getDate(),
        amount: amount,
        planned: true,
        dueDay: d.dueDay
      });
    });
  }
  out.sort(function(a, b){ return a.day - b.day; });
  return out;
}

function sl6_next30(){
  var out = [];
  var today = S.parseDate(S.today());
  var proj = E.project({});
  for (var k = 0; k <= 30; k++) {
    var d0 = new Date(today.getTime());
    d0.setDate(d0.getDate() + k);
    var ym = d0.getFullYear() + '-' + sl6_pad2(d0.getMonth() + 1);
    var dayNum = d0.getDate();
    var sched = null;
    for (var i = 0; i < proj.schedule.length; i++) if (proj.schedule[i].ym === ym) sched = proj.schedule[i];
    S.activeDebts().forEach(function(d){
      var due = S.dueDate(ym, d.dueDay);
      if (S.parseDate(due).getDate() !== dayNum) return;
      var amount = S.minPaymentFor(d, null, ym);
      if (sched) sched.rows.forEach(function(r){ if (r.debtId === d.id) amount = r.payment; });
      if (!(amount > 0)) return;
      out.push({ date: due, name: d.name, colour: d.colour, amount: amount, days: k, debtId: d.id });
    });
  }
  return out;
}

function sl6_calRender(){
  var ym = sl6_calYm || S.today().slice(0, 7);
  sl6_calYm = ym;
  var events = sl6_calEvents(ym);
  var byDay = {};
  events.forEach(function(e){
    if (!byDay[e.day]) byDay[e.day] = [];
    byDay[e.day].push(e);
  });

  var first = S.parseDate(ym + '-01');
  var lead = first.getDay();
  var dim = S.daysInMonth(ym);
  var prevYm = S.addMonths(ym, -1);
  var prevDim = S.daysInMonth(prevYm);
  var todayStr = S.today();

  var cells = '';
  var cellCount = Math.ceil((lead + dim) / 7) * 7;
  for (var c = 0; c < cellCount; c++) {
    var dayNum, out = false, cellYm = ym;
    if (c < lead) { dayNum = prevDim - lead + 1 + c; out = true; cellYm = prevYm; }
    else if (c >= lead + dim) { dayNum = c - lead - dim + 1; out = true; cellYm = S.addMonths(ym, 1); }
    else { dayNum = c - lead + 1; }
    var dateStr = cellYm + '-' + sl6_pad2(dayNum);
    var evs = out ? [] : (byDay[dayNum] || []);
    var shown = evs.slice(0, 2);
    var inner = '<div class="slcal-n">' + dayNum + '</div>' +
      shown.map(function(e){
        return '<span class="slcal-ev" style="background:' + S.esc(U.onWhite(e.colour)) + '">' +
          '<b>' + S.money(e.amount) + '</b><i>' + S.esc(e.name) + '</i></span>';
      }).join('') +
      (evs.length > shown.length ? '<span class="slcal-more">and ' + (evs.length - shown.length) + ' more</span>' : '');
    cells += '<div class="slcal-d' + (out ? ' out' : '') + (dateStr === todayStr ? ' now' : '') + '">' + inner + '</div>';
  }

  var monthTotal = S.round2(S.sum(events, function(e){ return e.amount; }));
  var biggest = events.reduce(function(m, e){ return e.amount > m ? e.amount : m; }, 0);

  var s1 = '<section class="sec sec-calendar-1" data-dsec="d-calendar-1">' +
    '<div class="sec-head"><h2>Calendar and reminders</h2>' +
    '<p>Every due day for the month, and reminder files you can add to any calendar app without an account.</p></div>' +
    U.card({
      title: S.monthLabel(ym),
      sub: events.length ? 'Due this month' : 'Nothing due this month',
      actions:
        U.btn({ label: 'Previous', act: 'cal-prev' }) +
        U.btn({ label: 'This month', act: 'cal-now' }) +
        U.btn({ label: 'Next', act: 'cal-next' }),
      body: '<div class="pair" style="margin-bottom:16px">' +
          '<div><div class="pair-l">Due this month</div><div class="pair-v">' + S.money(monthTotal) + '</div></div>' +
          '<div><div class="pair-l">Largest one</div><div class="pair-v">' + S.money(biggest) + '</div></div>' +
        '</div>' +
        '<div class="slcal"><div class="slcal-dow">' +
          S.DOW.map(function(d){ return '<span>' + d + '</span>'; }).join('') +
        '</div><div class="slcal-grid">' + cells + '</div></div>'
    }) + '</section>';

  var listHtml = events.length
    ? '<div class="sllist">' + events.map(function(e){
        return '<div class="li"><span class="dot" style="background:' + S.esc(e.colour) + '"></span>' +
          '<div><div class="nm">' + S.esc(e.name) + '</div>' +
          '<div class="wh">' + S.esc(S.dateStr(e.date)) + (e.planned ? ' due' : ' paid') + '</div></div>' +
          '<div class="am">' + S.money(e.amount) + '</div></div>';
      }).join('') + '</div>'
    : U.empty('Nothing is due in this month');

  var n30 = sl6_next30();
  var n30Html = n30.length
    ? '<div class="sllist">' + n30.map(function(e){
        return '<div class="li"><span class="dot" style="background:' + S.esc(e.colour) + '"></span>' +
          '<div><div class="nm">' + S.esc(e.name) + '</div>' +
          '<div class="wh">' + S.esc(S.dateStr(e.date)) + ', ' + (e.days === 0 ? 'today' : 'in ' + e.days + ' ' + S.plural(e.days, 'day', 'days')) + '</div></div>' +
          '<div class="am">' + S.money(e.amount) + '</div></div>';
      }).join('') + '</div>'
    : U.empty('Nothing due in the next thirty days');

  var s2 = '<section class="sec sec-calendar-2" data-dsec="d-calendar-2">' +
    '<div class="sec-head"><h2>What is coming</h2>' +
    '<p>The month as a list, and everything landing in the next thirty days.</p></div>' +
    '<div class="grid g2">' +
      U.card({ title: S.monthLabel(ym) + ' as a list', body: listHtml }) +
      U.card({ title: 'Next thirty days', sub: 'Counting from today', body: n30Html }) +
    '</div></section>';

  var planMap = sl6_plannedMap(ym);
  var debtRows = S.activeDebts().map(function(d){
    var amount = planMap[d.id] > 0 ? planMap[d.id] : S.minPaymentFor(d, null, ym);
    return {
      id: d.id,
      cells: [
        '<span class="chip" style="border-color:transparent;background:' + S.esc(d.colour) + '22">' + S.esc(d.name) + '</span>',
        'Day ' + d.dueDay + ' each month',
        S.money(amount),
        '<button type="button" class="btn sm" data-act="cal-ics" data-arg="' + S.esc(d.id) + '">Calendar file</button> ' +
        '<button type="button" class="btn sm" data-act="cal-gcal" data-arg="' + S.esc(d.id) + '">Google</button> ' +
        '<button type="button" class="btn sm" data-act="cal-rem" data-arg="' + S.esc(d.id) + '">Reminders</button>'
      ]
    };
  });

  var s3 = '<section class="sec sec-calendar-3" data-dsec="d-calendar-3">' +
    '<div class="sec-head"><h2>Set the reminders</h2>' +
    '<p>The calendar file is made here on your device and repeats every month. Nothing is sent anywhere.</p></div>' +
    U.card({
      title: 'Reminders per debt',
      sub: 'Or take the whole plan in one file',
      actions: U.btn({ label: 'Whole plan calendar', kind: 'primary', icon: 'download', act: 'cal-ics-all' }) +
        U.btn({ label: 'Whole plan reminders', icon: 'download', act: 'cal-rem-all' }),
      body: debtRows.length ? U.table({
        cols: [
          { label: 'Debt' },
          { label: 'Falls on', cls: 'nowrap' },
          { label: 'Amount', align: 'num', width: '110px' },
          { label: '', align: 'acts', width: '280px' }
        ],
        rows: debtRows
      }) : U.empty('Add a debt and its reminder shows up here')
    }) +
    '<p class="note accent" style="margin-top:14px">The file uses a monthly repeat rule, so one download covers every month until the debt is gone.</p>' +
    '</section>';

  return s1 + s2 + s3;
}

/* The month grid and the thirty day list both show what the plan puts on a
   debt that month, so the reminder has to say the same number. Falling back
   to the minimum keeps a debt the projection has already cleared honest. */
function sl6_plannedMap(ym){
  var map = {};
  var proj = E.project({});
  for (var i = 0; i < proj.schedule.length; i++) {
    if (proj.schedule[i].ym !== ym) continue;
    proj.schedule[i].rows.forEach(function(r){
      if (r.payment > 0) map[r.debtId] = S.round2(r.payment);
    });
  }
  return map;
}

function sl6_debtEvent(d){
  var ym = sl6_calYm || S.today().slice(0, 7);
  var planned = sl6_plannedMap(ym);
  var amount = planned[d.id] > 0 ? planned[d.id] : S.minPaymentFor(d, null, ym);
  return {
    uid: 'debt-' + d.id,
    date: S.dueDate(ym, d.dueDay),
    monthDay: d.dueDay,
    summary: 'Pay ' + d.name + ' ' + S.money(amount),
    description: 'Debt Snowball reminder. ' + d.name + (d.lender ? ' with ' + d.lender : '') +
      '. Planned payment ' + S.money(amount) + ' on day ' + d.dueDay + ' of each month.'
  };
}

var SL6_EXTRAS = [25, 50, 100, 200, 500];

function sl6_income(){
  if (!S.state.income) S.state.income = { monthlyNet: 0, essentials: 0, notes: '' };
  return S.state.income;
}

function sl6_dtiReading(pct){
  if (pct <= 0) return 'Put your monthly take home in and this fills itself out.';
  if (pct < 15) return 'Under fifteen percent. There is room here to push the extra payment up.';
  if (pct < 30) return 'Between fifteen and thirty percent. This is the usual range and it is workable.';
  if (pct < 40) return 'Between thirty and forty percent. Lenders start to treat this as stretched.';
  return 'Over forty percent of your take home goes to minimums. Getting the smallest balance gone first frees the most room.';
}

function sl6_budRender(){
  var inc = sl6_income();
  var net = S.round2(inc.monthlyNet);
  var ess = S.round2(inc.essentials);
  var left = S.round2(net - ess);
  var mins = S.totalMinimums();
  var pot = S.monthlyPot();
  var dti = net > 0 ? S.round2(mins / net * 100) : 0;
  var spare = S.round2(left - pot);

  var s1 = '<section class="sec sec-budget-1" data-dsec="d-budget-1">' +
    '<div class="sec-head"><h2>Money coming in</h2>' +
    '<p>What lands each month, what has to go out, and what is left to throw at the debt.</p></div>' +
    '<div class="grid g2">' +
      U.card({
        title: 'Your month',
        sub: 'Take home after tax, and the costs you cannot skip',
        body: '<div class="grid g2">' +
            U.field({ id: 'sl6-b-net', label: 'Monthly take home', value: net || '', inputmode: 'decimal', placeholder: '0.00' }) +
            U.field({ id: 'sl6-b-ess', label: 'Essential costs', value: ess || '', inputmode: 'decimal', placeholder: '0.00' }) +
          '</div>' +
          U.field({ id: 'sl6-b-notes', type: 'textarea', label: 'What is in that essentials figure', value: inc.notes || '', rows: 2, placeholder: 'Rent, food, fuel, insurance, phone' }) +
          '<div class="row">' + U.btn({ label: 'Save', kind: 'primary', icon: 'check', act: 'bud-save' }) + '</div>'
      }) +
      U.card({
        title: 'What is left',
        sub: 'Take home less the essentials',
        body: U.pair(
          { label: 'Left each month', value: S.money(left), size: 'lg', tone: left > 0 ? 'good' : 'warn' },
          { label: 'Going to debt', value: S.money(pot), size: 'lg', tone: 'accent' }
        ) +

      }) +
      U.card({
        title: 'Where the month goes',
        sub: 'Take home split three ways',
        body: net > 0 ? U.chart.donut({
          slices: [
            { label: 'Essentials', value: Math.max(0, ess), colour: '#8C9799' },
            { label: 'Debt payments', value: Math.max(0, Math.min(pot, Math.max(0, left))), colour: '#C6892F' },
            { label: 'Everything else', value: Math.max(0, left - pot), colour: '#2F6D57' }
          ],
          size: 168,
          centreTop: S.money(net),
          centreSub: 'take home'
        }) : U.empty('Add your take home to see the split')
      }) +
    '</div></section>';

  /* how much extra could you find */
  var extraRows = SL6_EXTRAS.map(function(x){
    var w = E.whatIf(x);
    return {
      extra: x,
      monthsSaved: w.monthsSaved,
      interestSaved: w.interestSaved,
      payoffMonth: w.payoffMonth
    };

  var s3 = '<section class="sec sec-budget-3" data-dsec="d-budget-3">' +
    '<div class="sec-head"><h2>How much extra could you find</h2>' +
    '<p>What each extra amount on top of the plan is worth in months and in interest.</p></div>' +
    U.card({
      title: 'Extra each month',
      sub: 'On top of the ' + S.money(S.extraMonthly()) + ' already in the plan',
      body: U.table({
        cols: [
          { label: 'Extra a month', align: 'num', width: '130px' },
          { label: 'Months saved', align: 'num', width: '130px' },
          { label: 'Interest saved', align: 'num', width: '140px' },
          { label: 'Debt free' },
          { label: '', align: 'acts', width: '140px' }
        ],
        rows: extraRows.map(function(r){
          return {
            cells: [
              S.money(r.extra),
              r.monthsSaved > 0 ? S.monthsWords(r.monthsSaved) : 'None',
              S.money(r.interestSaved),

            ]
          };
        }),

      }) +
      '<p class="note accent" style="margin-top:14px">Adding an extra amount here raises the monthly extra on your plan straight away. You can take it back off in Settings.</p>'
    }) + '</section>';

  /* snowflakes */
  var flakes = (S.state.snowflakes || []).slice();
  flakes.sort(function(a, b){ return a.date < b.date ? 1 : a.date > b.date ? -1 : 0; });
  var flakeTotal = S.round2(S.sum(flakes, function(f){ return f.amount; }));
  var flakeApplied = S.round2(S.sum(flakes.filter(function(f){ return f.applied; }), function(f){ return f.amount; }));

  var s4 = '<section class="sec sec-budget-4" data-dsec="d-budget-4">' +

          { label: 'Date', width: '120px', cls: 'nowrap' },

            ]
          };
        })
      }) : U.empty('Nothing logged yet')) + '</div>'
    }) + '</section>';

  return s1 + s2 + s3 + s4;
}

function sl6_flakeApply(id){
  var f = null;
  (S.state.snowflakes || []).forEach(function(x){ if (x.id === id) f = x; });
  if (!f) return;
  var proj = E.project({});
  var targetId = proj.order && proj.order.length ? proj.order[0] : (S.activeDebts()[0] || {}).id;
  var target = S.debt(targetId);
  if (!target) { S.toast('Add a debt first', 'warn'); return; }
  var w = E.windfall(f.amount, S.ymOf(f.date) || S.today().slice(0, 7));

  var body =
    '<p>' + S.money(f.amount) + ' from ' + S.esc(f.source || 'a snowflake') + ' goes onto <b>' + S.esc(target.name) + '</b>, the debt at the front of your order.</p>' +
    '<div class="pair" style="margin-top:14px">' +
      '<div><div class="pair-l">Debt free now</div><div class="pair-v">' + (w.base.payoffMonth ? S.esc(S.monthLabel(w.base.payoffMonth)) : 'Not clearing') + '</div></div>' +
      '<div><div class="pair-l">With this</div><div class="pair-v">' + (w.payoffMonth ? S.esc(S.monthLabel(w.payoffMonth)) : 'Not clearing') + '</div></div>' +
    '</div>' +
    '<div class="pair" style="margin-top:12px">' +
      '<div><div class="pair-l">Months saved</div><div class="pair-v">' + (w.monthsSaved > 0 ? S.monthsWords(w.monthsSaved) : 'None') + '</div></div>' +
      '<div><div class="pair-l">Interest saved</div><div class="pair-v">' + S.money(w.interestSaved) + '</div></div>' +
    '</div>' +
    '<p class="note" style="margin-top:14px">Nothing is saved until you say so. Applying it logs a snowflake payment and takes it off that balance.</p>';

  U.modal({
    title: 'Apply this snowflake',
    body: body,
    actions: [
      { label: 'Not yet', kind: 'ghost' },
      { label: 'Apply it', kind: 'primary', onClick: function(){
        var p = {
          id: S.uid(),
          debtId: target.id,
          date: f.date || S.today(),
          amount: S.round2(f.amount),
          kind: 'snowflake',
          note: f.source || 'Snowflake'
        };
        sl6_applyPayment(p);
        S.state.payments.push(p);
        f.applied = true;
        S.save();
        S.toast(S.money(f.amount) + ' off ' + target.name, 'good');
        U.render();
      } }
    ]
  });
}

function sl6_flakeDelete(id){
  var f = null;
  (S.state.snowflakes || []).forEach(function(x){ if (x.id === id) f = x; });
  if (!f) return;
  S.confirmDialog(
    'Delete this snowflake',
    S.money(f.amount) + ' from ' + (f.source || 'a snowflake') + '.' +
    (f.applied ? ' The payment it created stays in the payment log. Delete it there if you want the balance back.' : ''),
    'Delete it'
  ).then(function(ok){
    if (!ok) return;
    var ix = S.state.snowflakes.indexOf(f);
    if (ix >= 0) S.state.snowflakes.splice(ix, 1);
    S.save();
    U.render();
  });
}

U.on('.sl6-lf', 'change', function(e, el){
  var f = el.getAttribute('data-f');
  if (!f) return;
  sl6_logF[f] = el.value;
  U.render();
});

U.on('[data-act]', 'click', function(e, el){
  var act = el.getAttribute('data-act');
  var arg = el.getAttribute('data-arg') || '';

  if (act === 'log-add') { sl6_payModal(null); return; }
  if (act === 'log-edit') { sl6_payModal(arg); return; }
  if (act === 'log-del') { sl6_logDelete(arg); return; }
  if (act === 'log-csv') { sl6_logCsv(); return; }

  if (act === 'cal-prev') { sl6_calYm = S.addMonths(sl6_calYm || S.today().slice(0, 7), -1); U.render(); return; }
  if (act === 'cal-next') { sl6_calYm = S.addMonths(sl6_calYm || S.today().slice(0, 7), 1); U.render(); return; }
  if (act === 'cal-now') { sl6_calYm = S.today().slice(0, 7); U.render(); return; }

  if (act === 'cal-ics' || act === 'cal-rem') {
    var d = S.debt(arg);
    if (!d) return;
    var ev = sl6_debtEvent(d);
    var text = act === 'cal-ics' ? sl6_buildIcs([ev]) : sl6_buildIcsTodo([ev]);
    window.__debtsnowballLastIcs = text;
    sl6_download(text, 'debt-snowball-' + (act === 'cal-rem' ? 'reminder-' : '') + d.id + '.ics', 'text/calendar;charset=utf-8');
    S.toast(act === 'cal-rem' ? 'Reminder file downloaded, open it to add it' : 'Calendar file downloaded, open it to add it', 'good');
    return;
  }
  if (act === 'cal-gcal') {
    var gd = S.debt(arg);
    if (!gd) return;
    window.open(sl6_googleUrl(sl6_debtEvent(gd)), '_blank', 'noopener');
    return;
  }
  if (act === 'cal-ics-all' || act === 'cal-rem-all') {
    var evs = S.activeDebts().map(sl6_debtEvent);
    if (!evs.length) { S.toast('Add a debt first', 'warn'); return; }
    var all = act === 'cal-ics-all' ? sl6_buildIcs(evs) : sl6_buildIcsTodo(evs);
    window.__debtsnowballLastIcs = all;
    sl6_download(all, 'debt-snowball-plan' + (act === 'cal-rem-all' ? '-reminders' : '') + '.ics', 'text/calendar;charset=utf-8');
    S.toast('Downloaded, open it to add every reminder at once', 'good');
    return;
  }

  if (act === 'bud-save') { sl6_budSave(); return; }
  if (act === 'bud-extra') {
    var add = Number(arg) || 0;
    S.state.settings.extraPerMonth = S.round2((Number(S.state.settings.extraPerMonth) || 0) + add);
    S.save();
    S.toast(S.money(add) + ' a month added to the plan', 'good');
    U.render();
    return;
  }
  if (act === 'bud-fl-add') { sl6_flakeAdd(); return; }
  if (act === 'bud-fl-apply') { sl6_flakeApply(arg); return; }
  if (act === 'bud-fl-del') { sl6_flakeDelete(arg); return; }
});

function sl7_scores(){
  if (!S.state.scores) S.state.scores = [];
  return S.state.scores;
}

function sl7_sortedScores(){
  var l = sl7_scores().slice();
  l.sort(function(a, b){ return a.date < b.date ? -1 : a.date > b.date ? 1 : 0; });
  return l;
}

/* The shared line chart pins its floor at zero, which flattens a score
   line into nothing. Plotting the gap above a base and adding the base
   back inside the formatter keeps every printed figure real and the
   line readable. */
function sl7_scoreSeries(list, colour, height){
  var ys = list.map(function(s){ return Number(s.score) || 0; });
  var lo = Math.min.apply(null, ys), hi = Math.max.apply(null, ys);
  var pad = Math.max(12, Math.round((hi - lo) * 0.35));
  var base = Math.max(0, lo - pad);
  return U.chart.line({
    series: [{ name: 'Score', colour: colour, points: list.map(function(s){
      return { label: S.monthLabel(S.ymOf(s.date)), y: (Number(s.score) || 0) - base };
    }) }],
    height: height,
    yFmt: function(v){ return String(Math.round(v + base)); }
  });
}

function sl7_scoreBand(n){
  n = Number(n) || 0;
  if (n >= 853) return { label: 'Excellent', tone: 'good' };
  if (n >= 735) return { label: 'Very good', tone: 'good' };
  if (n >= 662) return { label: 'Good', tone: 'accent' };
  if (n >= 550) return { label: 'Average', tone: 'accent' };
  return { label: 'Building', tone: 'warn' };
}

  });
  var prevByDate = {};

function sl7_mstore(){
  if (!S.state.milestones) S.state.milestones = { celebrated: [] };
  if (!S.state.milestones.celebrated) S.state.milestones.celebrated = [];
  if (!S.state.milestones.dates) S.state.milestones.dates = {};
  return S.state.milestones;
}

/* A milestone that has just come true is written down with the day it
   happened, so it keeps a real date and not only a projected one. */
function sl7_markDone(list){
  var st = sl7_mstore();
  var changed = false;
  list.forEach(function(m){
    if (!m.done) return;
    if (st.celebrated.indexOf(m.key) < 0) { st.celebrated.push(m.key); changed = true; }
    if (!st.dates[m.key]) { st.dates[m.key] = S.today(); changed = true; }
  });
  if (changed) S.save();
  return st;
}

function sl7_streak(){
  var pays = (S.state.payments || []);
  var has = {};
  pays.forEach(function(p){ var ym = S.ymOf(p.date); if (ym) has[ym] = true; });
  var thisYm = S.today().slice(0, 7);
  var start = has[thisYm] ? thisYm : S.addMonths(thisYm, -1);
  var n = 0, ym = start;
  while (has[ym] && n < 600) { n++; ym = S.addMonths(ym, -1); }
  var months = [];
  for (var i = 11; i >= 0; i--) {
    var m = S.addMonths(thisYm, -i);
    months.push({ ym: m, on: !!has[m] });
  }
  return { count: n, months: months, live: !!has[thisYm] };
}

      actions: U.btn({ label: 'Print this page', icon: 'print', act: 'ms-print' }),

      body: '<div class="slstreak">' +

          '<div class="w"><div class="stat-label">' + (st2.count === 1 ? 'Month in a row' : 'Months in a row') + '</div>' +
          '<p class="sub" style="margin-top:6px">' +
            (st2.count === 0
              ? 'Nothing logged yet this month or last. One payment starts it.'
              : 'The last twelve months are below. A filled square is a month with a payment in the log.') +
          '</p></div>' +
        '</div>' +
        '<div class="sldots">' + st2.months.map(function(m){
          return '<b class="' + (m.on ? 'on' : '') + '" title="' + S.esc(S.monthLabel(m.ym)) + '">' + S.esc(S.MON[Number(m.ym.slice(5, 7)) - 1]) + '</b>';
        }).join('') + '</div>'
    }) + '</section>';

  return s1 + s2 + s3;
}

/* Balance at the end of each past month, worked back from the payment
   log: what is owing now plus everything paid after that month. */
function sl7_history(startMonth){
  var pays = (S.state.payments || []).filter(function(p){ return !!S.ymOf(p.date); });
  if (!pays.length) return [];
  var months = pays.map(function(p){ return S.ymOf(p.date); }).sort();
  var from = months[0];
  var out = [];
  var total = S.totalDebt();
  var ym = from;
  var guard = 0;
  while (ym < startMonth && guard < 600) {
    var after = S.sum(pays.filter(function(p){ return S.ymOf(p.date) > ym; }), function(p){ return p.amount; });
    out.push({ label: S.monthLabel(ym), y: S.round2(total + after), ym: ym });
    ym = S.addMonths(ym, 1);
    guard++;
  }
  return out;
}

function sl7_reportsRender(){
  var proj = E.project({});
  var mins = E.minimumsOnly();
  var hist = sl7_history(proj.startMonth);

  /* balance over time */
  var planPoints = hist.map(function(h){ return { label: h.label, y: h.y }; })
    .concat(proj.schedule.map(function(m){ return { label: S.monthLabel(m.ym), y: m.endBalance }; }));
  var minPoints = hist.map(function(h){ return { label: h.label, y: h.y }; })
    .concat((mins && mins.schedule ? mins.schedule : []).map(function(m){ return { label: S.monthLabel(m.ym), y: m.endBalance }; }));

  var balChart = planPoints.length > 1 ? U.chart.line({
    series: [

    ],

  }) : U.empty('Add a debt and the balance line starts here');

  var histNote = hist.length
    ? 'Everything up to ' + S.esc(hist[hist.length - 1].label) + ' is what you actually paid, taken from the payment log. From ' + S.esc(S.monthLabel(proj.startMonth)) + ' on it is the projection.'
    : 'This is the projection from ' + S.esc(S.monthLabel(proj.startMonth)) + '. Log payments and the earlier part fills in with what really happened.';
  if (proj.payoffMonth && mins && mins.payoffMonth && mins.payoffMonth !== proj.payoffMonth) {
    histNote += ' Your plan finishes in ' + S.esc(S.monthLabel(proj.payoffMonth)) + '. On minimums only the red line runs on to ' + S.esc(S.monthLabel(mins.payoffMonth)) + '.';

  var s1 = '<section class="sec sec-reports-1" data-dsec="d-reports-1">' +

    }) + '</section>';

  /* interest and principal */
  var ipChart = proj.schedule.length ? U.chart.line({
    series: [
      { name: 'Principal', colour: '#2F6D57', points: proj.schedule.map(function(m){ return { label: S.monthLabel(m.ym), y: S.round2(m.principal) }; }) },
      { name: 'Interest', colour: '#B25439', points: proj.schedule.map(function(m){ return { label: S.monthLabel(m.ym), y: S.round2(m.interest) }; }) }
    ],
    height: 200,
    area: false
  }) : U.empty('No months to chart yet');

  var typeTotals = {};
  S.activeDebts().forEach(function(d){
    var k = S.typeLabel(d.type);
    typeTotals[k] = S.round2((typeTotals[k] || 0) + (Number(d.balance) || 0));
  });
  var typeKeys = Object.keys(typeTotals);
  var donut = typeKeys.length ? U.chart.donut({
    slices: typeKeys.map(function(k, i){ return { label: k, value: typeTotals[k], colour: U.chartColour(i) }; }),
    size: 176,
    centreTop: S.money(S.totalDebt()),
    centreSub: 'owing now'
  }) : U.empty('Add a debt to see the split');

  var s2 = '<section class="sec sec-reports-2" data-dsec="d-reports-2">' +
    '<div class="sec-head"><h2>Where the money goes</h2>' +
    '<p>How much of each month lands on the balance, and what you owe by kind of debt.</p></div>' +
    '<div class="grid g2">' +
      U.card({ title: 'Principal and interest each month', sub: 'Every month of the plan', body: ipChart }) +
      U.card({ title: 'What you owe by type', body: donut }) +
    '</div></section>';

  /* payoff order timeline */
  var orderRows = (proj.order || []).map(function(id, i){
    var d = S.debt(id);
    var info = proj.byDebt[id];
    if (!d || !info) return null;
    return {
      label: d.name,
      sub: info.payoffMonth ? S.monthLabel(info.payoffMonth) : 'Not clearing yet',
      value: info.months || 0,
      colour: d.colour || U.chartColour(i)
    };
  }).filter(Boolean);

  var payMonths = [];
  var payTotals = {};
  (S.state.payments || []).forEach(function(p){
    var ym = S.ymOf(p.date);
    if (!ym) return;
    if (!payTotals[ym]) { payTotals[ym] = 0; payMonths.push(ym); }
    payTotals[ym] = S.round2(payTotals[ym] + (Number(p.amount) || 0));
  });
  payMonths.sort();
  var payRows = payMonths.slice(-12).map(function(ym, i){
    return { label: S.monthLabel(ym), value: payTotals[ym], colour: U.chartColour(i % 6) };
  });

  var s3 = '<section class="sec sec-reports-3" data-dsec="d-reports-3">' +

      }) +
    '</div></section>';

  /* credit overlay */
  var scores = sl7_sortedScores();
  var scoreChart = scores.length > 1
    ? sl7_scoreSeries(scores, '#4F7F97', 180)
    : U.empty('Log two score entries and the line appears here');

  /* A bar per score reads as six near identical bars, because the scale runs
     from zero. The pair of figures below says the same thing far better: how
     far the score has moved and how much debt went out the door over the very
     same stretch. */
  var scoreMoveBody = '';
  if (scores.length > 1) {
    var sFirst = scores[0], sLast = scores[scores.length - 1];
    var moved = Math.round((Number(sLast.score) || 0) - (Number(sFirst.score) || 0));
    var clearedSince = S.round2(S.sum((S.state.payments || []).filter(function(p){
      return String(p.date || '') >= String(sFirst.date || '');
    }), function(p){ return p.amount; }));
    scoreMoveBody = U.pair(
      { label: 'Score movement', value: (moved > 0 ? '+' : '') + String(moved), sub: 'Since ' + S.esc(S.dateStr(sFirst.date)), size: 'lg', tone: moved > 0 ? 'good' : moved < 0 ? 'warn' : '' },
      { label: 'Paid off in that time', value: S.money(clearedSince), sub: 'From your payment log', size: 'lg' }
    ) + '<p class="note" style="margin-top:14px">Lenders read the balance on your cards more than almost anything else, so the two lines tend to move together. Keep clearing and the score usually follows within a couple of statement cycles.</p>';
  }

  var s4 = '<section class="sec sec-reports-4" data-dsec="d-reports-4">' +
    '<div class="sec-head"><h2>Credit score alongside the plan</h2>' +
    '<p>The same score line from the credit page, next to the balance you have been clearing.</p></div>' +
    '<div class="grid g2">' +
      U.card({ title: 'Score over time', body: scoreChart }) +
      U.card({ title: 'Score against the balance', sub: scores.length > 1 ? 'The two moving together' : 'Nothing to show yet', body: scoreMoveBody || U.empty('Add score entries on the credit page') }) +
    '</div></section>';

  /* printable summary */
  var head = E.headline(proj);
  var s5 = '<section class="sec sec-reports-5 printable" data-dsec="d-reports-5">' +
    '<div class="sec-head"><h2>One page summary</h2>' +
    '<p>The figures worth keeping, laid out to print on a single sheet.</p></div>' +
    U.card({
      title: 'Debt Snowball summary',
      sub: S.dateLong(S.today()),
      actions: U.btn({ label: 'Print', kind: 'primary', icon: 'print', act: 'rp-print' }),

          '<div><div class="l">Owing now</div><div class="v">' + S.money(S.totalDebt()) + '</div></div>' +

          '<div><div class="l">Debt free</div><div class="v">' + S.esc(head.text) + '</div></div>' +
          '<div><div class="l">Time to go</div><div class="v">' + (proj.months ? S.esc(S.monthsWords(proj.months)) : 'Not set') + '</div></div>' +
          '<div><div class="l">Interest still to pay</div><div class="v">' + S.money(proj.totalInterest) + '</div></div>' +
          '<div><div class="l">Going in each month</div><div class="v">' + S.money(S.monthlyPot()) + '</div></div>' +
          '<div><div class="l">Strategy</div><div class="v">' + S.esc(E.strategy(proj.strategy).name) + '</div></div>' +
          '<div><div class="l">Minimums each month</div><div class="v">' + S.money(S.totalMinimums()) + '</div></div>' +
        '</div>' +
        '<div style="margin-top:16px">' + (orderRows.length ? '<div class="olist">' + orderRows.map(function(r, i){
          return '<div class="oitem"><span class="rank">' + (i + 1) + '</span>' +
            '<div><div class="oname">' + S.esc(r.label) + '</div>' +
            '<div class="owhy">Clears ' + S.esc(r.sub) + '</div></div>' +
            '<div class="ofig">' + S.esc(S.monthsWords(r.value)) + '</div></div>';
        }).join('') + '</div>' : '') + '</div>'
    }) + '</section>';

  return s1 + s2 + s3 + s4 + s5;

function downloadFile(name, text, mime){
  var blob = new Blob([text], { type: mime || 'text/plain;charset=utf-8' });
  var url = URL.createObjectURL(blob);
  var a = document.createElement('a');
  a.href = url;
  a.download = name;
  a.rel = 'noopener';
  a.style.display = 'none';
  document.body.appendChild(a);
  a.click();
  setTimeout(function(){
    if (a.parentNode) a.parentNode.removeChild(a);
    URL.revokeObjectURL(url);
  }, 800);
}

function csvCell(v){
  if (v === null || v === undefined) return '';
  var s = String(v);
  if (/[",\r\n]/.test(s)) return '"' + s.replace(/"/g, '""') + '"';
  return s;
}

function csvText(rows){
  var out = [];
  for (var i = 0; i < rows.length; i++) {
    var line = [];
    for (var j = 0; j < rows[i].length; j++) line.push(csvCell(rows[i][j]));
    out.push(line.join(','));
  }
  return out.join('\r\n') + '\r\n';
}

}

/* A restore only goes ahead if the file really is a Debt Snowball document. */
function validateDoc(text){
  var doc;
  try { doc = JSON.parse(text); } catch (e) { return { ok: false, why: 'That file is not readable JSON.' }; }
  if (!doc || typeof doc !== 'object' || Array.isArray(doc)) return { ok: false, why: 'That file does not hold a Debt Snowball document.' };
  if (!Array.isArray(doc.debts)) return { ok: false, why: 'That file has no list of debts in it, so it is not a Debt Snowball backup.' };
  if (!doc.settings || typeof doc.settings !== 'object') return { ok: false, why: 'That file has no settings block, so it is not a Debt Snowball backup.' };
  for (var i = 0; i < doc.debts.length; i++) {
    var d = doc.debts[i];
    if (!d || typeof d !== 'object') return { ok: false, why: 'One of the debts in that file is not readable.' };
    if (d.balance !== undefined && isNaN(Number(d.balance))) return { ok: false, why: 'One of the debts in that file has a balance that is not a number.' };
  }
  return {
    ok: true, doc: doc,
    debts: doc.debts.length,
    payments: Array.isArray(doc.payments) ? doc.payments.length : 0,
    scores: Array.isArray(doc.scores) ? doc.scores.length : 0,
    who: doc.settings.name || ''
  };
}

function sheetSummary(){

function sheetTracker(){
  var start = S.totalStart();
  if (!start) return noDebtsSheet();
  var paid = S.paidOff();
  var pct = S.clamp((paid / start) * 100, 0, 100);
  var per = start / 100;
  var full = Math.floor(pct);
  var part = pct - full >= 0.5 && full < 100;
  var grid = '<div class="colour-grid">';
  for (var i = 0; i < 100; i++) {
    var cls = i < full ? ' on' : (i === full && part ? ' part' : '');
    grid += '<span class="sq' + cls + '"></span>';
  }
  grid += '</div>';
  var body = '<p class="sub">One square is ' + money(per) + ' off the total you started with. Colour a square in every time another ' + money(per) + ' is gone.</p>' +
    grid +
    '<div style="height:14px"></div>' +
    pairTile({ label: 'Started at', value: money(start) }, { label: 'Gone so far', value: money(paid) });
  return card({ title: 'Colour it in', sub: 'Stick this on the fridge.', body: body });
}

function renderPrintIndex(){

function renderPrint(params){
  var key = params && params.sheet ? String(params.sheet) : '';
  if (key && SHEET_BY_KEY[key]) return renderSheetView(SHEET_BY_KEY[key]);

function afterPrint(params){
  if (params && params.print === '1') {
    setTimeout(function(){ try { window.print(); } catch (e) {} }, 250);
  }
}

function startRestore(text){
  var v = validateDoc(text);
  if (!v.ok) {
    S.toast(v.why, 'bad');
    return;
  }
  var summary = 'That file holds ' + S.plural(v.debts, 'debt') + ', ' +
    S.plural(v.payments, 'payment') + ' and ' + S.plural(v.scores, 'credit score') +
    (v.who ? ', saved under the name ' + v.who : '') + '.';
  S.confirmDialog('Restore this backup?', summary + ' Everything currently on this device will be replaced.', 'Continue')
    .then(function(yes){
      if (!yes) return null;
      return S.confirmDialog('This cannot be undone', 'Your current plan will be gone the moment this file loads. Restore it?', 'Yes, restore it');
    })
    .then(function(sure){
      if (!sure) return;
      try {
        S.importDoc(text);
      } catch (e) {
        S.toast('That file could not be restored.', 'bad');
        return;
      }
      U.applyTheme();
      U.refreshBar();
      U.render();
      S.toast('Backup restored.', 'good');
    });
}

function currencyOptions(){
  var cur = (S.state.settings.currency || 'AUD');
  var common = '', more = '';
  for (var i = 0; i < S.CURRENCIES.length; i++) {
    var c = S.CURRENCIES[i];
    var label = c.code + ' ' + c.symbol + '  ' + S.currencyName(c.code);
    var opt = '<option value="' + esc(c.code) + '"' + (c.code === cur ? ' selected' : '') + '>' + esc(label) + '</option>';
    if (i < COMMON_COUNT) common += opt; else more += opt;
  }
  return '<optgroup label="Used most often">' + common + '</optgroup>' +
    '<optgroup label="More currencies">' + more + '</optgroup>';
}

  for (var i = 0; i < 30; i++) {

    out += '<option value="' + esc(ym) + '"' + (ym === cur ? ' selected' : '') + '>' + esc(S.monthLabel(ym)) + '</option>';

function injectCss(){
  if (document.getElementById('debtsnowball-js8-css')) return;
  var st = document.createElement('style');
  st.id = 'debtsnowball-js8-css';
  st.textContent = EXTRA_CSS;
  document.head.appendChild(st);
}

/* ================================================================== */
/* events                                                              */

U.on('[data-act="print-open"]', 'click', function(e, el){
  U.go('print', { sheet: el.getAttribute('data-arg') });
});

U.on('[data-act="print-open-now"]', 'click', function(e, el){
  U.go('print', { sheet: el.getAttribute('data-arg'), print: '1' });
});

U.on('[data-act="print-back"]', 'click', function(){ U.go('print'); });

U.on('[data-act="print-now"]', 'click', function(){
  try { window.print(); } catch (err) {}
});

U.on('[data-act="guide-print"]', 'click', function(){
  try { window.print(); } catch (err) {}
});

U.on('[data-act="guide-jump"]', 'click', function(e, el){
  var id = el.getAttribute('data-arg');
  if (id === 'top') { window.scrollTo(0, 0); return; }
  var target = document.getElementById(id);
  if (!target) return;
  try { target.scrollIntoView({ behavior: 'smooth', block: 'start' }); }
  catch (err) { target.scrollIntoView(); }
});

U.on('[data-act="csv"]', 'click', function(e, el){ exportCsv(el.getAttribute('data-arg')); });
U.on('[data-act="backup"]', 'click', function(){ exportBackup(); });

U.on('[data-act="restore-pick"]', 'click', function(){
  var input = document.getElementById('restoreFile');
  if (input) input.click();
});

U.on('#restoreFile', 'change', function(e, el){
  var file = el.files && el.files[0];
  if (!file) return;
  var reader = new FileReader();
  reader.onload = function(){
    el.value = '';
    startRestore(String(reader.result || ''));
  };
  reader.onerror = function(){
    el.value = '';
    S.toast('That file could not be read.', 'bad');
  };
  reader.readAsText(file);
});

U.on('#setCurrency', 'change', function(e, el){
  var c = S.currency(el.value);
  S.state.settings.currency = c.code;
  S.state.settings.symbol = c.symbol;
  S.state.settings.locale = c.locale;
  S.save();
  U.refreshBar();
  U.render();
  S.toast('Figures are now shown in ' + c.code + '.', 'good');
});

U.on('#setTheme', 'change', function(e, el){
  var mode = el.value === 'dark' ? 'dark' : 'light';
  S.state.settings.theme = mode;
  S.save();
  U.applyTheme(mode);
});

U.on('#setStart', 'change', function(e, el){
  S.state.settings.startMonth = el.value;
  S.save();
  U.refreshBar();
  S.toast('The plan now starts in ' + S.monthLabel(el.value) + '.', 'good');
});

U.on('[data-act="save-look"]', 'click', function(){
  var nameEl = document.getElementById('setName');
  var themeEl = document.getElementById('setTheme');
  S.state.settings.name = nameEl ? String(nameEl.value || '').slice(0, 80) : '';
  if (themeEl) S.state.settings.theme = themeEl.value === 'dark' ? 'dark' : 'light';
  S.save();
  U.applyTheme();
  S.toast('Saved.', 'good');
});

function readRule(){
  var pctEl = document.getElementById('setPct');
  var floorEl = document.getElementById('setFloor');
  return {
    pct: S.clamp(pctEl ? Number(pctEl.value) || 0 : 2, 0, 100),
    floor: Math.max(0, floorEl ? Number(floorEl.value) || 0 : 25)
  };
}

U.on('[data-act="save-rule"]', 'click', function(){
  S.state.settings.minRule = readRule();
  S.save();
  S.toast('Saved as the default minimum rule.', 'good');
});

U.on('[data-act="apply-rule"]', 'click', function(){
  var rule = readRule();
  S.confirmDialog('Apply this rule to your debts?',
    'Every debt without a fixed minimum payment will use ' + S.num(rule.pct, 2) + ' per cent of the balance, never less than ' + money(rule.floor) + '.',
    'Apply it').then(function(yes){
      if (!yes) return;
      var n = 0;
      var list = S.state.debts || [];
      for (var i = 0; i < list.length; i++) {
        if (list[i].minPayment > 0) continue;
        list[i].minRule = { pct: rule.pct, floor: rule.floor };
        n++;
      }
      S.state.settings.minRule = rule;
      S.save();
      U.render();
      S.toast(n ? 'Updated ' + S.plural(n, 'debt') + '.' : 'Every debt has a fixed minimum, so nothing changed.', n ? 'good' : '');
    });
});

U.on('[data-act="demo"]', 'click', function(){
  S.confirmDialog('Load the sample plan?', 'The sample replaces whatever is on this device. Download a backup first if your own figures are in here.', 'Load it')
    .then(function(yes){
      if (!yes) return;
      S.seedDemo();
      U.applyTheme();
      U.refreshBar();
      U.render();
      S.toast('Sample plan loaded.', 'good');
    });
});

U.on('[data-act="clear-all"]', 'click', function(){
  S.confirmDialog('Clear everything?', 'This deletes every debt, payment and credit score from this device.', 'Continue')
    .then(function(yes){
      if (!yes) return null;
      return S.confirmDialog('Last check', 'There is no undo. Debt Snowball will reopen with a blank plan.', 'Yes, clear it all');
    })
    .then(function(sure){
      if (!sure) return;
      S.clearAll();
      U.applyTheme();
      U.refreshBar();
      U.render();
      S.toast('Everything has been cleared.', 'good');
    });
});

/* ================================================================== */
/* pages                                                               */

U.page({ key: 'print', label: 'Print and export', group: 'SET UP', icon: 'print', render: renderPrint, after: afterPrint });
U.page({ key: 'guide', label: 'How it works', group: 'SET UP', icon: 'guide', render: renderGuide });
U.page({ key: 'settings', label: 'Settings', group: 'SET UP', icon: 'settings', render: renderSettings });

/* ================================================================== */
/* the widget api the AY platform reads                                */

window.AY_WIDGET_API = {
  getState: function(){
    var proj = projection();
    var focus = null;
    if (proj && proj.order && proj.order.length) {
      var d = S.debt(proj.order[0]);
      if (d) focus = { name: d.name, balance: d.balance };
    }
    return {
      totalDebt: S.totalDebt(),
      paidOff: S.paidOff(),
      pctPaid: S.pctPaid(),
      payoffMonth: proj ? proj.payoffMonth : null,
      monthsLeft: proj ? proj.months : null,
      interestLeft: proj ? proj.totalInterest : 0,
      focusDebt: focus,
      strategy: S.state.settings.strategy
    };
  },
  onChange: function(fn){ S.onChange(fn); },
  fmt: function(n, opts){ return S.money(n, opts); }
};

/* ================================================================== */
/* boot                                                                */

function init(){
  S.load();
  injectCss();
  U.applyTheme(S.state.settings.theme);
  if (!location.hash || !/^#\//.test(location.hash)) location.hash = '#/dashboard';
  U.mount();
  U.render();
  S.state.log = S.state.log || {};
  S.state.log.lastOpened = S.today();
  S.save();
}

function start(){ bootFromCloud(function(){ init(); }); }

if (document.readyState === 'loading') window.addEventListener('DOMContentLoaded', start);
else start();

})();


})();
</script>
