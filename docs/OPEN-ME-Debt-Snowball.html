/* =====================================================================
   Debt Snowball js2: the payoff engine.
   Every figure the app shows about the future comes from here. Money is
   rounded to two decimal places at every step so the schedule adds up
   exactly the way a bank statement would.
   ===================================================================== */

var E = S.engine = {};

var MONTH_CAP = 600;
var CENT = 0.004;

function r2(n){ return Math.round(((Number(n) || 0) + Number.EPSILON) * 100) / 100; }
function n0(v){ var n = Number(v); return isFinite(n) ? n : 0; }

/* ---------------------------------------------------------------- */

E.STRATEGIES = [
  { key: 'snowball', name: 'Snowball', rule: 'Smallest balance first',
    blurb: 'Clear the smallest debt first so you get a debt gone quickly, then roll its payment into the next one. Usually costs a little more interest, and it is the easiest to stick with.' },
  { key: 'avalanche', name: 'Avalanche', rule: 'Highest interest rate first',
    blurb: 'Attack the highest rate first. This is the mathematically cheapest order, though the first debt can take a while to clear.' },
  { key: 'cashflow', name: 'Cash flow first', rule: 'Biggest minimum payment first',
    blurb: 'Clear the debt with the largest required payment first. Every debt you close frees up the most monthly cash, which helps if things are tight.' },
  { key: 'tsunami', name: 'Highest interest cost', rule: 'Biggest balance times rate first',
    blurb: 'Target the debt costing you the most dollars per month, not just the highest rate. A large balance at a middling rate can beat a small balance at a high one.' },
  { key: 'quickwins', name: 'Quick wins', rule: 'Fewest months to clear first',
    blurb: 'Order by how close each debt already is to being finished at its current payment. Front loads the wins.' },
  { key: 'custom', name: 'My own order', rule: 'You choose, drag to reorder',
    blurb: 'Set the order yourself. Useful when one debt matters for a reason a formula cannot see, such as money owed to family.' }
];

E.strategy = function(key){
  for (var i = 0; i < E.STRATEGIES.length; i++) if (E.STRATEGIES[i].key === key) return E.STRATEGIES[i];
  return E.STRATEGIES[0];
};

/* Months to clear one debt on its own at its current minimum. Used by
   the quick wins order. Returns a big number when the minimum does not
   even cover the interest. */
E.monthsAlone = function(debt){
  var bal = n0(debt.balance);
  if (bal <= 0) return 0;
  var m = 0;
  while (bal > CENT && m < MONTH_CAP) {
    var rate = S.effectiveApr(debt, S.addMonths(S.today().slice(0, 7), m)) / 100 / 12;
    var interest = r2(bal * rate);
    bal = r2(bal + interest);
    var pay = S.minPaymentFor(debt, bal, null);
    if (pay <= interest + CENT && pay < bal) return MONTH_CAP;
    bal = r2(bal - Math.min(pay, bal));
    m++;
  }
  return m;
};

/* ---------------------------------------------------------------- */
/* the order the extra money attacks the debts in                    */

E.order = function(debts, strategy, customOrder){
  var list = (debts || S.activeDebts()).filter(function(d){ return n0(d.balance) > 0; });
  var key = strategy || (S.state && S.state.settings.strategy) || 'snowball';
  var copy = list.slice();
  if (key === 'custom') {
    var wanted = customOrder || (S.state && S.state.settings.customOrder) || [];
    copy.sort(function(a, b){
      var ia = wanted.indexOf(a.id), ib = wanted.indexOf(b.id);
      if (ia < 0) ia = 9999;
      if (ib < 0) ib = 9999;
      return ia - ib || n0(a.balance) - n0(b.balance);
    });
    return copy.map(function(d){ return d.id; });
  }
  var score = {};
  var months = {};
  if (key === 'quickwins') copy.forEach(function(d){ months[d.id] = E.monthsAlone(d); });
  copy.forEach(function(d){
    if (key === 'snowball') score[d.id] = n0(d.balance);
    else if (key === 'avalanche') score[d.id] = -S.effectiveApr(d, null);
    else if (key === 'cashflow') score[d.id] = -S.minPaymentFor(d);
    else if (key === 'tsunami') score[d.id] = -(n0(d.balance) * S.effectiveApr(d, null) / 100);
    else if (key === 'quickwins') score[d.id] = months[d.id];
    else score[d.id] = n0(d.balance);
  });
  copy.sort(function(a, b){
    var s = score[a.id] - score[b.id];
    if (Math.abs(s) > 0.0001) return s;
    /* ties break on the smaller balance, then the name, so the order
       never wobbles between renders */
    var bs = n0(a.balance) - n0(b.balance);
    if (Math.abs(bs) > 0.0001) return bs;
    return String(a.name).localeCompare(String(b.name));
  });
  return copy.map(function(d){ return d.id; });
};

E.orderReason = function(debt, key){
  if (key === 'snowball') return S.money(debt.balance) + ' owing';
  if (key === 'avalanche') return S.pct(S.effectiveApr(debt, null), 2) + ' rate';
  if (key === 'cashflow') return S.money(S.minPaymentFor(debt)) + ' a month required';
  if (key === 'tsunami') return 'about ' + S.money(n0(debt.balance) * S.effectiveApr(debt, null) / 100 / 12) + ' of interest a month';
  if (key === 'quickwins') {
    var m = E.monthsAlone(debt);
    return m >= MONTH_CAP ? 'will not clear on the minimum' : S.monthsWords(m) + ' at the minimum';
  }
  return 'your chosen order';
};

/* ---------------------------------------------------------------- */
/* helpers on the settings                                           */

function toMonthly(amount, freq){
  var a = n0(amount);
  if (freq === 'fortnightly') return r2(a * 26 / 12);
  if (freq === 'weekly') return r2(a * 52 / 12);
  return r2(a);
}

function settings(){ return (S.state && S.state.settings) || {}; }

/* ---------------------------------------------------------------- */
/* the projection                                                    */

/* opts = { debts, strategy, extra, startMonth, frequency, customOrder,
            roundUp, lump:{ym,amount}|null }
   extra is given in the same units as the settings figure, that is per
   period of the chosen frequency, and is converted to a monthly equal
   inside here. */
E.project = function(opts){
  opts = opts || {};
  var st = settings();
  var source = opts.debts || S.activeDebts();
  var debts = source.filter(function(d){ return n0(d.balance) > 0 && !d.archived; });
  var strategy = opts.strategy || st.strategy || 'snowball';
  var customOrder = opts.customOrder || st.customOrder || [];
  var startMonth = opts.startMonth || st.startMonth || S.today().slice(0, 7);
  var freq = opts.frequency || st.frequency || 'monthly';
  var roundUp = opts.roundUp === undefined ? !!st.roundUp : !!opts.roundUp;
  var extraRaw = opts.extra === undefined || opts.extra === null ? n0(st.extraPerMonth) : n0(opts.extra);
  var extra = toMonthly(extraRaw, freq);
  var lump = opts.lump && opts.lump.ym ? { ym: String(opts.lump.ym).slice(0, 7), amount: r2(opts.lump.amount) } : null;

  var attack = E.order(debts, strategy, customOrder);
  var work = debts.map(function(d){
    return { d: d, bal: r2(d.balance), interest: 0, paid: 0, payoffMonth: null, months: 0, monthPay: 0, monthInt: 0, startBal: 0 };
  });
  var byId = {};
  work.forEach(function(w){ byId[w.d.id] = w; });

  /* The pot stays the size it was on day one: every minimum plus the
     extra. That is what makes a cleared debt's payment roll into the
     next one instead of leaking back into spending. */
  var basePot = r2(S.sum(work, function(w){ return S.minPaymentFor(w.d, w.bal, startMonth); }) + extra);

  var schedule = [], totalInterest = 0, totalPaid = 0, m = 0, truncated = false;

  while (m < MONTH_CAP) {
    var ym = S.addMonths(startMonth, m);
    var active = work.filter(function(w){ return w.bal > CENT; });
    if (!active.length) break;

    var startTotal = r2(S.sum(active, function(w){ return w.bal; }));
    var monthInt = 0;

    /* 1. interest for the month goes on first */
    active.forEach(function(w){
      var rate = S.effectiveApr(w.d, ym) / 100 / 12;
      var i = r2(w.bal * rate);
      w.startBal = w.bal;
      w.monthInt = i;
      w.monthPay = 0;
      w.bal = r2(w.bal + i);
      w.interest = r2(w.interest + i);
      monthInt = r2(monthInt + i);
    });

    /* 2. every debt gets its minimum, capped at what is owed */
    var pot = r2(basePot + (lump && lump.ym === ym ? lump.amount : 0));
    var left = pot;
    active.forEach(function(w){
      if (left <= CENT || w.bal <= CENT) return;
      var min = S.minPaymentFor(w.d, w.bal, ym);
      var pay = Math.min(min, w.bal, left);
      if (roundUp && pay > 0) pay = Math.min(Math.ceil(pay / 10) * 10, w.bal, left);
      pay = r2(pay);
      w.monthPay = r2(w.monthPay + pay);
      w.bal = r2(w.bal - pay);
      left = r2(left - pay);
    });

    /* 3. whatever is left attacks the target debt, and the moment that
       debt hits zero the rest of the money moves straight on to the
       next one in the same month */
    var guard = 0;
    while (left > CENT && guard < 100) {
      guard++;
      var spent = 0;
      for (var oi = 0; oi < attack.length; oi++) {
        var w2 = byId[attack[oi]];
        if (!w2 || w2.bal <= CENT) continue;
        var pay2 = r2(Math.min(w2.bal, left));
        w2.monthPay = r2(w2.monthPay + pay2);
        w2.bal = r2(w2.bal - pay2);
        left = r2(left - pay2);
        spent = r2(spent + pay2);
        if (left <= CENT) break;
      }
      if (spent <= CENT) break;
    }

    /* 4. write the month down */
    var rows = [], payment = 0;
    active.forEach(function(w){
      if (w.bal <= CENT) w.bal = 0;
      rows.push({
        debtId: w.d.id, name: w.d.name,
        startBalance: w.startBal, payment: w.monthPay, interest: w.monthInt,
        principal: r2(w.monthPay - w.monthInt), endBalance: w.bal,
        paidOffThisMonth: w.bal === 0
      });
      payment = r2(payment + w.monthPay);
      w.paid = r2(w.paid + w.monthPay);
      if (w.bal === 0 && !w.payoffMonth) { w.payoffMonth = ym; w.months = m + 1; }
    });

    totalInterest = r2(totalInterest + monthInt);
    totalPaid = r2(totalPaid + payment);
    schedule.push({
      ym: ym, label: S.monthLabel(ym), startBalance: startTotal, payment: payment,
      interest: monthInt, principal: r2(payment - monthInt),
      endBalance: r2(S.sum(work, function(w){ return w.bal; })), rows: rows
    });
    m++;
  }

  if (work.some(function(w){ return w.bal > CENT; })) truncated = true;

  var months = schedule.length;
  var payoffMonth = months ? schedule[months - 1].ym : null;
  var payoffDate = null;
  if (payoffMonth) {
    var lastDay = 15;
    work.forEach(function(w){ if (w.payoffMonth === payoffMonth) lastDay = Math.max(lastDay, n0(w.d.dueDay) || 15); });
    payoffDate = S.dueDate(payoffMonth, lastDay);
  }

  var byDebt = {};
  work.forEach(function(w){
    byDebt[w.d.id] = {
      payoffMonth: w.payoffMonth, months: w.months || months,
      totalInterest: r2(w.interest), totalPaid: r2(w.paid)
    };
  });

  var out = {
    months: months, payoffMonth: payoffMonth, payoffDate: payoffDate,
    totalInterest: r2(totalInterest), totalPaid: r2(totalPaid),
    schedule: schedule, byDebt: byDebt, order: attack,
    warnings: [], truncated: truncated,
    startMonth: startMonth, strategy: strategy, extraMonthly: extra,
    monthlyPot: basePot, startTotal: r2(S.sum(debts, function(d){ return d.balance; }))
  };
  out.warnings = E.warningsFor(debts, out);
  return out;
};

/* ---------------------------------------------------------------- */
/* warnings                                                          */

E.warningsFor = function(debts, proj){
  var out = [];
  var nowYm = S.today().slice(0, 7);

  debts.forEach(function(d){
    var rate = S.effectiveApr(d, nowYm) / 100 / 12;
    var interest = r2(n0(d.balance) * rate);
    var min = S.minPaymentFor(d, null, nowYm);

    if (interest > 0 && min <= interest + CENT) {
      out.push({
        debtId: d.id, kind: 'negative-amortisation',
        text: d.name + ' charges about ' + S.money(interest, { cents: true }) + ' of interest a month and the minimum is ' + S.money(min, { cents: true }) + '. Paying only the minimum makes this balance grow, not shrink.'
      });
    }

    if (d.promoEndsOn) {
      var monthsToEnd = S.monthsBetween(nowYm, String(d.promoEndsOn).slice(0, 7));
      if (monthsToEnd >= 0 && monthsToEnd <= 3) {
        out.push({
          debtId: d.id, kind: 'promo-ending',
          text: 'The promo rate on ' + d.name + ' runs out on ' + S.dateStr(d.promoEndsOn) + ', which is ' + (monthsToEnd === 0 ? 'this month' : S.monthsWords(monthsToEnd) + ' away') + '. After that the rate goes to ' + S.pct(d.apr, 2) + '.'
        });
      }
      if (d.deferredInterest) {
        var endYm = String(d.promoEndsOn).slice(0, 7);
        var info = proj && proj.byDebt ? proj.byDebt[d.id] : null;
        var clearedFirst = info && info.payoffMonth && info.payoffMonth <= endYm;
        if (!clearedFirst) {
          var balAtEnd = E.balanceAt(proj, d.id, endYm);
          var backMonths = Math.max(1, S.monthsBetween(S.ymOf(d.openedOn) || proj.startMonth, endYm));
          var cost = r2(balAtEnd * (n0(d.apr) / 100 / 12) * backMonths);
          out.push({
            debtId: d.id, kind: 'deferred-interest',
            text: d.name + ' has deferred interest. On this plan about ' + S.money(balAtEnd) + ' is still owing when the promo ends on ' + S.dateStr(d.promoEndsOn) + ', and the back dated interest would be roughly ' + S.money(cost) + '. Clearing it before that date avoids the lot.'
          });
        }
      }
    }
  });

  var inc = (S.state && S.state.income) || {};
  var spare = r2(n0(inc.monthlyNet) - n0(inc.essentials));
  if (n0(inc.monthlyNet) > 0 && proj && spare < proj.monthlyPot - CENT) {
    out.push({
      debtId: null, kind: 'min-too-low',
      text: 'This plan needs ' + S.money(proj.monthlyPot) + ' a month and the money left after your essentials is ' + S.money(spare) + '. Either the extra is set too high or something in the budget has to move.'
    });
  }

  return out;
};

/* the balance of one debt at the end of a given month in a projection */
E.balanceAt = function(proj, debtId, ym){
  if (!proj || !proj.schedule) return 0;
  var last = 0;
  for (var i = 0; i < proj.schedule.length; i++) {
    var mo = proj.schedule[i];
    if (mo.ym > ym) break;
    for (var j = 0; j < mo.rows.length; j++) if (mo.rows[j].debtId === debtId) last = mo.rows[j].endBalance;
  }
  return r2(last);
};

/* ---------------------------------------------------------------- */
/* the comparisons                                                   */

E.minimumsOnly = function(opts){
  return E.project(Object.assign({}, opts || {}, { extra: 0, roundUp: false, lump: null }));
};

E.compare = function(strategies){
  var keys = strategies && strategies.length ? strategies : E.STRATEGIES.map(function(s){ return s.key; });
  var base = E.minimumsOnly();
  return keys.map(function(k){
    var p = E.project({ strategy: k });
    return {
      key: k, name: E.strategy(k).name, rule: E.strategy(k).rule,
      months: p.months, payoffMonth: p.payoffMonth, payoffDate: p.payoffDate,
      totalInterest: p.totalInterest, totalPaid: p.totalPaid,
      savedVsMinimums: r2(base.totalInterest - p.totalInterest),
      monthsSavedVsMinimums: base.months - p.months,
      truncated: p.truncated
    };
  }).sort(function(a, b){ return a.totalInterest - b.totalInterest || a.months - b.months; });
};

E.whatIf = function(deltaExtra){
  var st = settings();
  var now = E.project({});
  var next = E.project({ extra: Math.max(0, n0(st.extraPerMonth) + n0(deltaExtra)) });
  return {
    delta: n0(deltaExtra), now: now, next: next,
    monthsSaved: now.months - next.months,
    interestSaved: r2(now.totalInterest - next.totalInterest),
    payoffMonth: next.payoffMonth, months: next.months,
    totalInterest: next.totalInterest, totalPaid: next.totalPaid
  };
};

E.windfall = function(amount, ym){
  var base = E.project({});
  var withIt = E.project({ lump: { ym: ym || S.today().slice(0, 7), amount: n0(amount) } });
  return {
    amount: r2(amount), ym: ym || S.today().slice(0, 7),
    base: base, next: withIt,
    monthsSaved: base.months - withIt.months,
    interestSaved: r2(base.totalInterest - withIt.totalInterest),
    payoffMonth: withIt.payoffMonth, months: withIt.months,
    totalInterest: withIt.totalInterest, totalPaid: withIt.totalPaid
  };
};

/* ---------------------------------------------------------------- */
/* balance transfer and consolidation                                */

function pickDebts(ids){
  var all = S.activeDebts();
  if (!ids || !ids.length) return [];
  return all.filter(function(d){ return ids.indexOf(d.id) >= 0; });
}
function otherDebts(ids){
  var all = S.activeDebts();
  return all.filter(function(d){ return !ids || ids.indexOf(d.id) < 0; });
}
function breakEven(base, next, upfrontFee){
  /* the first month where sticking with the old debts has cost more
     interest than the new arrangement plus its fee */
  var a = 0, b = r2(upfrontFee);
  var n = Math.max(base.schedule.length, next.schedule.length);
  for (var i = 0; i < n; i++) {
    a = r2(a + (base.schedule[i] ? base.schedule[i].interest : 0));
    b = r2(b + (next.schedule[i] ? next.schedule[i].interest : 0));
    if (a > b) return i + 1;
  }
  return null;
}

/* opts = { debtIds, newApr, promoMonths, feePct, revertApr } */
E.balanceTransfer = function(opts){
  opts = opts || {};
  var ids = opts.debtIds || [];
  var moving = pickDebts(ids);
  var base = E.project({});
  if (!moving.length) {
    return { worthIt: false, saving: 0, breakEvenMonths: null, fee: 0, moved: 0,
      base: base, next: base, monthsSaved: 0, interestSaved: 0,
      note: 'Pick at least one debt to move across.' };
  }
  var st = settings();
  var startMonth = st.startMonth || S.today().slice(0, 7);
  var moved = r2(S.sum(moving, function(d){ return d.balance; }));
  var fee = r2(moved * n0(opts.feePct) / 100);
  var minSum = r2(S.sum(moving, function(d){ return S.minPaymentFor(d); }));
  var promoMonths = Math.max(0, Math.round(n0(opts.promoMonths)));
  var card = {
    id: 'bt-new', name: 'Transferred balance', lender: '', type: 'card',
    balance: r2(moved + fee), apr: n0(opts.revertApr), minPayment: minSum,
    minRule: { pct: 2, floor: 25 }, creditLimit: 0, dueDay: 15,
    promoApr: n0(opts.newApr), promoEndsOn: S.dueDate(S.addMonths(startMonth, Math.max(0, promoMonths - 1)), 28),
    deferredInterest: false, openedOn: null, notes: '', archived: false,
    colour: '#4F7F97', startBalance: r2(moved + fee)
  };
  var next = E.project({ debts: otherDebts(ids).concat([card]) });
  var saving = r2(base.totalPaid - next.totalPaid);
  return {
    worthIt: saving > 0,
    saving: saving,
    interestSaved: r2(base.totalInterest - next.totalInterest),
    fee: fee, moved: moved,
    breakEvenMonths: breakEven(base, next, fee),
    monthsSaved: base.months - next.months,
    newBalance: card.balance,
    promoEndsOn: card.promoEndsOn,
    base: base, next: next,
    note: saving > 0
      ? 'Moving ' + S.money(moved) + ' costs ' + S.money(fee) + ' in fees and saves about ' + S.money(saving) + ' overall.'
      : 'On these figures the fee of ' + S.money(fee) + ' costs more than the transfer saves.'
  };
};

/* opts = { debtIds, apr, termMonths, feePct, amount } */
E.consolidate = function(opts){
  opts = opts || {};
  var ids = opts.debtIds || [];
  var moving = pickDebts(ids);
  var base = E.project({});
  if (!moving.length) {
    return { worthIt: false, saving: 0, breakEvenMonths: null, fee: 0,
      base: base, next: base, monthsSaved: 0, interestSaved: 0, payment: 0,
      note: 'Pick at least two debts to roll into one loan.' };
  }
  var moved = r2(opts.amount ? n0(opts.amount) : S.sum(moving, function(d){ return d.balance; }));
  var fee = r2(moved * n0(opts.feePct) / 100);
  var principal = r2(moved + fee);
  var apr = n0(opts.apr);
  var term = Math.max(1, Math.round(n0(opts.termMonths) || 36));
  var i = apr / 100 / 12;
  var pay = i > 0 ? r2(principal * i / (1 - Math.pow(1 + i, -term))) : r2(principal / term);
  var loan = {
    id: 'con-new', name: 'Consolidation loan', lender: '', type: 'personal',
    balance: principal, apr: apr, minPayment: pay, minRule: { pct: 2, floor: 25 },
    creditLimit: 0, dueDay: 15, promoApr: null, promoEndsOn: null,
    deferredInterest: false, openedOn: null, notes: '', archived: false,
    colour: '#2F6D57', startBalance: principal
  };
  var next = E.project({ debts: otherDebts(ids).concat([loan]) });
  var saving = r2(base.totalPaid - next.totalPaid);
  return {
    worthIt: saving > 0,
    saving: saving,
    interestSaved: r2(base.totalInterest - next.totalInterest),
    fee: fee, moved: moved, principal: principal, payment: pay, term: term,
    breakEvenMonths: breakEven(base, next, fee),
    monthsSaved: base.months - next.months,
    base: base, next: next,
    note: saving > 0
      ? 'One loan of ' + S.money(principal) + ' at ' + S.pct(apr, 2) + ' over ' + S.monthsWords(term) + ' is about ' + S.money(pay) + ' a month and saves roughly ' + S.money(saving) + '.'
      : 'One loan of ' + S.money(principal) + ' at ' + S.pct(apr, 2) + ' over ' + S.monthsWords(term) + ' would cost about ' + S.money(Math.abs(saving)) + ' more than the current plan.'
  };
};

/* ---------------------------------------------------------------- */
/* milestones                                                        */

E.milestones = function(projection){
  var proj = projection || E.project({});
  var out = [];
  var startTotal = r2(S.totalStart());
  var nowOwing = r2(S.totalDebt());
  var paidAlready = r2(Math.max(0, startTotal - nowOwing));

  function monthForRemaining(target){
    for (var i = 0; i < proj.schedule.length; i++) {
      if (proj.schedule[i].endBalance <= target + CENT) return proj.schedule[i].ym;
    }
    return null;
  }

  /* percentage steps */
  [10, 25, 50, 75, 90].forEach(function(p){
    var target = r2(startTotal * (1 - p / 100));
    var done = nowOwing <= target + CENT;
    var ym = done ? null : monthForRemaining(target);
    out.push({
      key: 'pct-' + p, kind: 'percent', pct: p,
      label: p + '% of the debt gone',
      sub: S.money(r2(startTotal * p / 100)) + ' of ' + S.money(startTotal) + ' paid off',
      projectedMonth: ym, projectedDate: ym ? S.monthLabel(ym) : null,
      done: done, sort: startTotal * p / 100
    });
  });

  /* every debt cleared */
  S.activeDebts().forEach(function(d){
    var info = proj.byDebt[d.id];
    var done = n0(d.balance) <= CENT;
    out.push({
      key: 'debt-' + d.id, kind: 'debt', debtId: d.id,
      label: d.name + ' cleared',
      sub: done ? 'Finished' : S.money(d.balance) + ' to go at ' + S.pct(S.effectiveApr(d, null), 2),
      projectedMonth: info ? info.payoffMonth : null,
      projectedDate: info && info.payoffMonth ? S.monthLabel(info.payoffMonth) : null,
      done: done, sort: paidAlready + n0(d.balance)
    });
  });

  /* the first thousand of interest saved against paying minimums only */
  var mins = E.minimumsOnly();
  var savedMonth = null, a = 0, b = 0;
  for (var i = 0; i < Math.max(mins.schedule.length, proj.schedule.length); i++) {
    a = r2(a + (mins.schedule[i] ? mins.schedule[i].interest : 0));
    b = r2(b + (proj.schedule[i] ? proj.schedule[i].interest : 0));
    if (a - b >= 1000) { savedMonth = proj.schedule[i] ? proj.schedule[i].ym : mins.schedule[i].ym; break; }
  }
  if (savedMonth) {
    out.push({
      key: 'saved-1000', kind: 'saving',
      label: S.money(1000) + ' of interest saved',
      sub: 'Compared with paying only the minimums',
      projectedMonth: savedMonth, projectedDate: S.monthLabel(savedMonth),
      done: false, sort: startTotal * 0.3
    });
  }

  /* one year to go */
  if (proj.months > 12) {
    var oneYear = proj.schedule[proj.months - 13];
    out.push({
      key: 'one-year-left', kind: 'countdown',
      label: 'One year left',
      sub: 'Twelve payments from the finish',
      projectedMonth: oneYear.ym, projectedDate: S.monthLabel(oneYear.ym),
      done: false, sort: startTotal * 0.95
    });
  }

  /* the last payment */
  if (proj.payoffMonth) {
    out.push({
      key: 'debt-free', kind: 'finish',
      label: 'Debt free',
      sub: 'The final payment clears the last balance',
      projectedMonth: proj.payoffMonth, projectedDate: S.monthLabel(proj.payoffMonth),
      done: nowOwing <= CENT, sort: startTotal * 1.01
    });
  }

  var celebrated = (S.state && S.state.milestones && S.state.milestones.celebrated) || [];
  out.forEach(function(x){ x.celebrated = celebrated.indexOf(x.key) >= 0; });

  out.sort(function(x, y){
    if (x.done !== y.done) return x.done ? -1 : 1;
    if (x.projectedMonth && y.projectedMonth && x.projectedMonth !== y.projectedMonth) return x.projectedMonth < y.projectedMonth ? -1 : 1;
    return x.sort - y.sort;
  });

  var nextFound = false;
  out.forEach(function(x){
    x.next = false;
    if (!nextFound && !x.done) { x.next = true; nextFound = true; }
  });
  return out;
};

/* A one line headline the dashboard and the top bar both use. */
E.headline = function(proj){
  var p = proj || E.project({});
  if (!p.months) return { text: 'No debts yet', month: null };
  if (p.truncated) return { text: 'Not clearing yet', month: null };
  return { text: S.monthLabel(p.payoffMonth), month: p.payoffMonth, months: p.months };
};

/* o = { cols:[{key,label,align,width,cls}], rows:[{cells:[],cls,id}] or
        [[cell,...]], empty, search:{id,placeholder}, foot, note } */
U.table = function(o){
  o = o || {};
  var cols = o.cols || [];
  var rows = o.rows || [];
  var head = '<thead><tr>' + cols.map(function(c){
    var hcls = [c.align || '', c.cls || ''].join(' ').trim();
    return '<th' + (hcls ? ' class="' + attr(hcls) + '"' : '') + (c.width ? ' style="width:' + attr(c.width) + '"' : '') + '>' + (c.label || '') + '</th>';
  }).join('') + '</tr></thead>';

  var bodyRows = rows.map(function(r){
    var cells = r && r.cells ? r.cells : r;
    var rcls = r && r.cls ? r.cls : '';
    var rid = r && r.id ? ' data-row-id="' + attr(r.id) + '"' : '';
    return '<tr' + (rcls ? ' class="' + attr(rcls) + '"' : '') + rid + '>' + (cells || []).map(function(cell, i){
      var c = cols[i] || {};
      var dcls = [c.align || '', c.cls || ''].join(' ').trim();
      return '<td' + (dcls ? ' class="' + attr(dcls) + '"' : '') + '>' + (cell == null ? '' : cell) + '</td>';
    }).join('') + '</tr>';
  }).join('');

  if (!rows.length) {
    return '<div class="tbl-block">' + (o.search ? '<div class="filters">' + U.searchBox(o.search.id || U.uidAttr(), o.search.placeholder) + '</div>' : '') +
      U.empty(o.empty || 'Nothing here yet') + '</div>';
  }

  return '<div class="tbl-block">' +
    (o.search ? '<div class="filters">' + U.searchBox(o.search.id || U.uidAttr(), o.search.placeholder) + (o.search.extra || '') + '</div>' : '') +
    '<div class="tbl-wrap"><table class="tbl">' + head + '<tbody>' + bodyRows + '</tbody>' +
    (o.foot ? '<tfoot>' + o.foot + '</tfoot>' : '') + '</table></div>' +
    '<p class="scroll-note">Swipe the table sideways to see every column.</p>' +
    (o.note ? '<p class="sub">' + o.note + '</p>' : '') +
    '</div>';
};

U.uidAttr = function(){ return 'f' + Math.random().toString(36).slice(2, 8); };

/* charts, all drawn here, nothing external                          */

U.chart = {};

var CHART_COLOURS = ['#C6892F', '#2F6D57', '#4F7F97', '#B25439', '#6C5B8E', '#8C9799'];
U.chartColour = function(i){ return CHART_COLOURS[i % CHART_COLOURS.length]; };

/* a debt colour is picked to tell debts apart, not to be read on, so anywhere
   white sits on top of one we darken it until the text actually passes */
function slHexRgb(h){
  h = String(h || '').trim().replace('#', '');
  if (h.length === 3) h = h[0] + h[0] + h[1] + h[1] + h[2] + h[2];
  if (!/^[0-9a-fA-F]{6}$/.test(h)) return null;
  return [parseInt(h.slice(0, 2), 16), parseInt(h.slice(2, 4), 16), parseInt(h.slice(4, 6), 16)];
}
function slLum(c){
  var f = c.map(function(v){ v /= 255; return v <= 0.03928 ? v / 12.92 : Math.pow((v + 0.055) / 1.055, 2.4); });
  return 0.2126 * f[0] + 0.7152 * f[1] + 0.0722 * f[2];
}
U.onWhite = function(colour){
  var c = slHexRgb(colour);
  if (!c) return colour;
  var base = [16, 24, 26], mix = 1;
  for (var step = 0; step < 12; step++) {
    var cur = c.map(function(v, i){ return v * mix + base[i] * (1 - mix); });
    if ((1.05) / (slLum(cur) + 0.05) >= 4.6 || mix <= 0.4) {
      return 'rgb(' + cur.map(Math.round).join(',') + ')';
    }
    mix -= 0.06;
  }
  return colour;
};

function svgOpen(w, h, extraCls){
  return '<svg class="' + cls(['ch', extraCls]) + '" viewBox="0 0 ' + w + ' ' + h + '" width="100%" height="' + h + '" preserveAspectRatio="none" role="img">';
}

/* o = { series:[{name,colour,points:[{label,y}]}], height, yFmt, area,
        labelEvery } */
U.chart.line = function(o){ return lineChart(o); };
function lineChart(o){
  o = o || {};
  var series = (o.series || []).filter(function(s){ return s && s.points && s.points.length; });
  var h = o.height || 200;
  var w = 720;
  /* Labels live in HTML around the drawing, so they keep their reading
     size on every width while the lines stretch to fill the card. */
  var padL = 8, padR = 8, padT = 8, padB = 8;
  var fmt = o.yFmt || function(v){ return S.money(v); };
  if (!series.length) return U.empty('No figures to chart yet');

  var maxY = 0, minY = 0, n = 0;
  series.forEach(function(s){
    s.points.forEach(function(p){ if (p.y > maxY) maxY = p.y; if (p.y < minY) minY = p.y; });
    if (s.points.length > n) n = s.points.length;
  });
  if (maxY === minY) maxY = minY + 1;
  var span = maxY - minY;
  var innerW = w - padL - padR, innerH = h - padT - padB;
  function X(i){ return padL + (n <= 1 ? innerW / 2 : innerW * i / (n - 1)); }
  function Y(v){ return padT + innerH - innerH * ((v - minY) / span); }

  var grid = '';
  [0, 0.5, 1].forEach(function(f){
    var y = padT + innerH * f;
    grid += '<line class="ch-grid" x1="' + padL + '" y1="' + y.toFixed(1) + '" x2="' + (w - padR) + '" y2="' + y.toFixed(1) + '"/>';
  });

  var paths = '', dots = '', labels = '';
  series.forEach(function(s, si){
    var colour = s.colour || U.chartColour(si);
    var d = s.points.map(function(p, i){ return (i ? 'L' : 'M') + X(i).toFixed(1) + ' ' + Y(p.y).toFixed(1); }).join(' ');
    if (o.area !== false && series.length === 1) {
      paths += '<path class="ch-area" d="' + d + ' L' + X(s.points.length - 1).toFixed(1) + ' ' + (padT + innerH) + ' L' + X(0).toFixed(1) + ' ' + (padT + innerH) + ' Z" fill="' + colour + '" opacity=".10"/>';
    }
    paths += '<path d="' + d + '" fill="none" stroke="' + colour + '" stroke-width="2.2" stroke-linejoin="round" stroke-linecap="round" vector-effect="non-scaling-stroke"/>';
    var lastI = s.points.length - 1;
    dots += '<i class="ch-dot" style="left:' + (X(lastI) / w * 100).toFixed(2) + '%;top:' + (Y(s.points[lastI].y) / h * 100).toFixed(2) + '%;background:' + attr(colour) + '"></i>';
  });

  /* key values are written beside the chart, never hidden behind a hover */
  var first = series[0].points[0], last = series[0].points[series[0].points.length - 1];
  var top = '<div class="ch-top">' + S.esc(fmt(maxY)) + '</div>';
  labels += '<div class="ch-x"><span>' + S.esc(String(first.label || '')) + '</span><span>' + S.esc(String(last.label || '')) + '</span></div>';

  var legend = series.length > 1 ? '<div class="ch-legend">' + series.map(function(s, si){
    return '<span class="ch-key"><i style="background:' + attr(s.colour || U.chartColour(si)) + '"></i>' + S.esc(s.name || '') + '</span>';
  }).join('') + '</div>' : '';

  return '<div class="chart">' + top + '<div class="ch-box">' + svgOpen(w, h, 'ch-line') +
    '<g>' + grid + paths + '</g></svg>' + dots + '</div>' + labels +
    '<div class="ch-ends"><span>' + S.esc(fmt(first.y)) + '</span><span>' + S.esc(fmt(last.y)) + '</span></div>' +
    legend + '</div>';
}

/* o = { rows:[{label,value,colour,sub}], height, fmt, horizontal } */
U.chart.bars = function(o){ return barsChart(o); };
function barsChart(o){
  o = o || {};
  var rows = (o.rows || []).slice();
  if (!rows.length) return U.empty('No figures to chart yet');
  var fmt = o.fmt || function(v){ return S.money(v); };
  var max = 0;
  rows.forEach(function(r){ if (Math.abs(r.value) > max) max = Math.abs(r.value); });
  if (!max) max = 1;
  return '<div class="chart bars">' + rows.map(function(r, i){
    var w = S.clamp(Math.abs(r.value) / max * 100, 0, 100);
    return '<div class="bar-row">' +
      '<div class="bar-label">' + S.esc(String(r.label)) + (r.sub ? '<i>' + S.esc(String(r.sub)) + '</i>' : '') + '</div>' +
      '<div class="bar-track"><span style="width:' + S.num(w, 2) + '%;background:' + attr(r.colour || U.chartColour(i)) + '"></span></div>' +
      '<div class="bar-value">' + S.esc(fmt(r.value)) + '</div>' +
      '</div>';
  }).join('') + '</div>';
}

/* o = { slices:[{label,value,colour}], size, centreTop, centreSub, fmt } */
U.chart.donut = function(o){ return donutChart(o); };
function donutChart(o){
  o = o || {};
  var slices = (o.slices || []).filter(function(s){ return s && Number(s.value) > 0; });
  if (!slices.length) return U.empty('No figures to chart yet');
  var fmt = o.fmt || function(v){ return S.money(v); };
  var size = o.size || 180;
  var r = size / 2 - 14, cx = size / 2, cy = size / 2;
  var circ = 2 * Math.PI * r;
  var total = slices.reduce(function(a, s){ return a + Number(s.value); }, 0);
  var offset = 0;
  var arcs = slices.map(function(s, i){
    var frac = Number(s.value) / total;
    var len = circ * frac;
    var seg = '<circle cx="' + cx + '" cy="' + cy + '" r="' + r.toFixed(2) + '" fill="none" ' +
      'stroke="' + attr(s.colour || U.chartColour(i)) + '" stroke-width="14" ' +
      'stroke-dasharray="' + (len - 1.5).toFixed(2) + ' ' + (circ - len + 1.5).toFixed(2) + '" ' +
      'stroke-dashoffset="' + (-offset).toFixed(2) + '" transform="rotate(-90 ' + cx + ' ' + cy + ')"><title>' +
      S.esc(String(s.label) + ': ' + fmt(s.value)) + '</title></circle>';
    offset += len;
    return seg;
  }).join('');

  return '<div class="chart donut-wrap">' +
    '<div class="donut"><svg viewBox="0 0 ' + size + ' ' + size + '" width="' + size + '" height="' + size + '" role="img">' + arcs + '</svg>' +
    '<div class="donut-mid"><div class="figure">' + S.esc(o.centreTop || fmt(total)) + '</div>' +
    (o.centreSub ? '<div class="sub">' + S.esc(o.centreSub) + '</div>' : '') + '</div></div>' +
    '<ul class="ch-legend col">' + slices.map(function(s, i){
      return '<li class="ch-key"><i style="background:' + attr(s.colour || U.chartColour(i)) + '"></i>' +
        '<span class="k">' + S.esc(String(s.label)) + '</span><span class="v">' + S.esc(fmt(s.value)) + '</span></li>';
    }).join('') + '</ul></div>';
}

/* o = { pct, label, top, bottom } */
U.chart.thermo = function(o){ return thermoChart(o); };
function thermoChart(o){
  o = o || {};
  var pct = S.clamp(o.pct, 0, 100);
  return '<div class="thermo" role="img" aria-label="' + attr((o.label || 'Progress') + ': ' + S.num(pct, 0) + ' percent') + '">' +
    '<div class="thermo-tube"><span class="thermo-fill" style="height:' + S.num(pct, 2) + '%"></span>' +
    '<b class="thermo-bulb"></b></div>' +
    '<div class="thermo-side">' +
    '<div class="figure lg">' + S.pct(pct, 0) + '</div>' +
    '<div class="stat-label">' + S.esc(o.label || 'Paid off so far') + '</div>' +
    (o.top ? '<div class="sub">' + o.top + '</div>' : '') +
    (o.bottom ? '<div class="sub">' + o.bottom + '</div>' : '') +
    '</div></div>';
}

/* ---------------------------------------------------------------- */
/* modal and confirm                                                 */

/* o = { title, body, actions:[{label,kind,cls,act,close,onClick}], wide,
        onOpen, onClose }. onClose fires once however the dialog goes away:
        an action, the close button, the scrim, Escape or another modal. */
U.modal = function(o){
  o = o || {};
  U.closeModal();
  var root = document.getElementById('modalRoot');
  if (!root) return null;
  var scrim = document.createElement('div');
  scrim.className = 'modal-scrim';
  scrim.setAttribute('role', 'dialog');
  scrim.setAttribute('aria-modal', 'true');
  scrim.innerHTML = '<div class="modal' + (o.wide ? ' wide' : '') + '">' +
    '<div class="modal-head"><h2>' + (o.title || '') + '</h2>' +
    '<button type="button" class="ib" data-modal-close="1" aria-label="Close">' + U.svg('close', 20) + '</button></div>' +
    '<div class="modal-body">' + (o.body || '') + '</div>' +
    '<div class="modal-foot"></div></div>';

  var foot = scrim.querySelector('.modal-foot');
  var acts = o.actions || [{ label: 'Close', kind: 'ghost', close: true }];
  acts.forEach(function(a){
    var b = document.createElement('button');
    b.type = 'button';
    b.className = a.cls ? ('btn ' + String(a.cls).replace(/\bbtn\b/g, '')).replace(/\s+/g, ' ').trim() : cls(['btn', a.kind || 'ghost']);
    b.innerHTML = '<span>' + S.esc(a.label || '') + '</span>';
    b.addEventListener('click', function(){
      var keep = false;
      if (a.onClick) keep = a.onClick(scrim) === false;
      if (a.close !== false && !keep) U.closeModal();
    });
    foot.appendChild(b);
  });

  scrim.addEventListener('mousedown', function(e){
    if (e.target === scrim) U.closeModal();
  });
  scrim.addEventListener('click', function(e){
    var c = e.target.closest ? e.target.closest('[data-modal-close]') : null;
    if (c) U.closeModal();
  });

  root.appendChild(scrim);
  document.body.classList.add('has-modal');
  var focusable = scrim.querySelector('input, select, textarea, button.primary, button');
  if (focusable) focusable.focus();
  U._modalOnClose = typeof o.onClose === 'function' ? o.onClose : null;
  if (o.onOpen) o.onOpen(scrim);
  U._modal = scrim;
  return scrim;
};

U.closeModal = function(){
  var root = document.getElementById('modalRoot');
  var onClose = U._modalOnClose;
  U._modalOnClose = null;
  if (root) root.innerHTML = '';
  document.body.classList.remove('has-modal');
  U._modal = null;
  if (onClose) onClose();
};

/* ---------------------------------------------------------------- */
/* inputs                                                            */

/* Turns a text input into a money field: shows a tidy figure when it is
   not being edited, a plain number while it is. Returns the value. */
U.fmtInput = function(el, opts){
  if (!el) return 0;
  var node = typeof el === 'string' ? document.querySelector(el) : el;
  if (!node) return 0;
  opts = opts || {};
  function raw(){ return Number(String(node.value).replace(/[^0-9.\-]/g, '')) || 0; }
  function show(){ node.value = raw() ? S.money(raw(), { cents: opts.cents, bare: true }) : ''; }
  if (!node.dataset.fmtBound) {
    node.dataset.fmtBound = '1';
    node.setAttribute('inputmode', 'decimal');
    node.addEventListener('focus', function(){ var v = raw(); node.value = v ? String(v) : ''; node.select(); });
    node.addEventListener('blur', show);
    show();
  }
  return raw();
};

U.numValue = function(sel){
  var node = typeof sel === 'string' ? document.querySelector(sel) : sel;
  if (!node) return 0;
  return Number(String(node.value).replace(/[^0-9.\-]/g, '')) || 0;
};

U.field = function(o){
  o = o || {};
  var id = o.id || U.uidAttr();
  var inner;
  if (o.type === 'select') {
    inner = '<select id="' + attr(id) + '"' + (o.name ? ' name="' + attr(o.name) + '"' : '') + '>' +
      (o.options || []).map(function(op){
        return '<option value="' + attr(op.value) + '"' + (String(op.value) === String(o.value) ? ' selected' : '') + '>' + S.esc(op.label) + '</option>';
      }).join('') + '</select>';
  } else if (o.type === 'textarea') {
    inner = '<textarea id="' + attr(id) + '" rows="' + (o.rows || 3) + '"' + (o.placeholder ? ' placeholder="' + attr(o.placeholder) + '"' : '') + '>' + S.esc(o.value == null ? '' : o.value) + '</textarea>';
  } else if (o.type === 'checkbox') {
    return '<label class="chk"><input type="checkbox" id="' + attr(id) + '"' + (o.value ? ' checked' : '') + '><span>' + S.esc(o.label || '') + '</span></label>';
  } else {
    inner = '<input type="' + attr(o.type || 'text') + '" id="' + attr(id) + '"' +
      (o.value == null ? '' : ' value="' + attr(o.value) + '"') +
      (o.placeholder ? ' placeholder="' + attr(o.placeholder) + '"' : '') +
      (o.step ? ' step="' + attr(o.step) + '"' : '') +
      (o.min != null ? ' min="' + attr(o.min) + '"' : '') +
      (o.inputmode ? ' inputmode="' + attr(o.inputmode) + '"' : '') + '>';
  }
  return '<div class="field' + (o.wide ? ' wide' : '') + '">' +
    '<label for="' + attr(id) + '">' + S.esc(o.label || '') + '</label>' + inner +
    (o.hint ? '<p class="hint">' + S.esc(o.hint) + '</p>' : '') + '</div>';
};

/* ---------------------------------------------------------------- */
/* delegated events, scoped to the page area                         */

var handlers = [];
var boundTypes = {};

U.on = function(sel, evt, fn){
  handlers.push({ sel: sel, evt: evt, fn: fn, scope: '#view' });
  bindType(evt);
};

U.onAny = function(sel, evt, fn){
  handlers.push({ sel: sel, evt: evt, fn: fn, scope: null });
  bindType(evt);
};

function bindType(evt){
  if (boundTypes[evt]) return;
  boundTypes[evt] = true;
  document.addEventListener(evt, function(e){
    var view = document.getElementById('view');
    for (var i = 0; i < handlers.length; i++) {
      var h = handlers[i];
      if (h.evt !== evt) continue;
      var t = e.target && e.target.closest ? e.target.closest(h.sel) : null;
      if (!t) continue;
      if (h.scope === '#view' && (!view || !view.contains(t))) continue;
      h.fn(e, t);
    }
  }, true);
}

/* ---------------------------------------------------------------- */
/* pages and the router                                              */

U.page = function(def){
  if (!def || !def.key) return;
  if (U._byKey[def.key]) {
    var i = U.PAGES.indexOf(U._byKey[def.key]);
    if (i >= 0) U.PAGES.splice(i, 1);
  }
  U._byKey[def.key] = def;
  U.PAGES.push(def);
  U.PAGES.sort(function(a, b){
    var ia = U.ORDER.indexOf(a.key), ib = U.ORDER.indexOf(b.key);
    if (ia < 0) ia = 900 + U.PAGES.indexOf(a);
    if (ib < 0) ib = 900 + U.PAGES.indexOf(b);
    return ia - ib;
  });
  if (U._mounted) U.renderRail();
};

U.current = function(){
  var raw = String(location.hash || '').replace(/^#\/?/, '');
  var bits = raw.split('?');
  var key = bits[0] || '';
  if (!U._byKey[key]) key = U.PAGES.length ? U.PAGES[0].key : 'dashboard';
  var params = {};
  if (bits[1]) bits[1].split('&').forEach(function(kv){
    var p = kv.split('=');
    params[decodeURIComponent(p[0])] = decodeURIComponent(p[1] || '');
  });
  return { key: key, params: params };
};

U.go = function(key, params){
  var q = '';
  if (params) {
    var parts = [];
    Object.keys(params).forEach(function(k){ parts.push(encodeURIComponent(k) + '=' + encodeURIComponent(params[k])); });
    if (parts.length) q = '?' + parts.join('&');
  }
  var next = '#/' + key + q;
  if (location.hash === next) U.render();
  else location.hash = next;
};

U.renderRail = function(){
  var host = document.getElementById('railNav');
  if (!host) return;
  var cur = U.current().key;
  var html = '';
  var groups = U.GROUPS.slice();
  U.PAGES.forEach(function(p){ if (p.group && groups.indexOf(p.group) < 0) groups.push(p.group); });
  groups.forEach(function(g){
    var items = U.PAGES.filter(function(p){ return (p.group || 'PLAN') === g; });
    if (!items.length) return;
    html += '<div class="rail-grp"><div class="rail-grp-h">' + S.esc(g) + '</div>';
    items.forEach(function(p){
      html += '<a class="nav' + (p.key === cur ? ' on' : '') + '" href="#/' + attr(p.key) + '"' +
        (p.key === cur ? ' aria-current="page"' : '') + ' title="' + attr(p.label) + '">' +
        U.svg(p.icon || 'dashboard', 20) + '<span>' + S.esc(p.label) + '</span></a>';
    });
    html += '</div>';
  });
  host.innerHTML = html;
};

U.setTitle = function(text){
  var h = document.getElementById('pageTitle');
  if (h) h.textContent = text;
  document.title = text ? text + ' | Debt Snowball' : 'Debt Snowball';
};

U.render = function(){
  var view = document.getElementById('view');
  if (!view) return;
  var cur = U.current();
  var def = U._byKey[cur.key];
  U.params = cur.params;
  U.renderRail();
  if (!def) {
    view.innerHTML = '<section class="sec sec-empty-1">' + U.card({ title: 'Nothing to show yet', body: '<p class="sub">This page has not loaded.</p>' }) + '</section>';
    return;
  }
  U.setTitle(def.label);
  var html = '';
  try {
    html = def.render(cur.params) || '';
  } catch (err) {
    html = '<section class="sec sec-error-1">' + U.card({
      title: 'This page could not be drawn',
      body: '<p class="sub">' + S.esc(String(err && err.message ? err.message : err)) + '</p>'
    }) + '</section>';
  }
  view.innerHTML = html;
  view.scrollTop = 0;
  if (def.after) { try { def.after(cur.params); } catch (e2) {} }
  U.syncScrollNotes();
  U.closeDrawer();
  U.refreshBar();
  window.scrollTo(0, 0);
};

/* the swipe hint under a table is only true when the table really is wider
   than the screen it is on, so measure each one once the page is drawn */
U.syncScrollNotes = function(){
  var notes = document.querySelectorAll('.scroll-note');
  for (var i = 0; i < notes.length; i++) {
    var n = notes[i];
    var w = n.previousElementSibling;
    if (w && !w.classList.contains('tbl-wrap')) w = w.querySelector ? w.querySelector('.tbl-wrap') : null;
    var over = !!w && w.scrollWidth > w.clientWidth + 2;
    n.style.display = over ? '' : 'none';
  }
};

var uScrollNoteTimer = null;
window.addEventListener('resize', function(){
  if (uScrollNoteTimer) clearTimeout(uScrollNoteTimer);
  uScrollNoteTimer = setTimeout(function(){ U.syncScrollNotes(); }, 150);
});

/* ---------------------------------------------------------------- */
/* the shell: theme, drawer, top bar                                 */

U.applyTheme = function(mode){
  var m = mode || (S.state && S.state.settings.theme) || 'light';
  document.documentElement.setAttribute('data-theme', m === 'dark' ? 'dark' : 'light');
  var meta = document.querySelector('meta[name="theme-color"]');
  if (meta) meta.setAttribute('content', m === 'dark' ? '#12191B' : '#F7F3EC');
  var btn = document.getElementById('themeBtn');
  if (btn) btn.innerHTML = U.svg(m === 'dark' ? 'sun' : 'moon', 20);
};

U.toggleTheme = function(){
  var next = (S.state.settings.theme === 'dark') ? 'light' : 'dark';
  S.state.settings.theme = next;
  S.save();
  U.applyTheme(next);
};

U.openDrawer = function(){
  var app = document.getElementById('app'), scrim = document.getElementById('scrim'), btn = document.getElementById('menuBtn');
  if (!app) return;
  app.setAttribute('data-drawer', 'open');
  if (scrim) scrim.hidden = false;
  if (btn) btn.setAttribute('aria-expanded', 'true');
};

U.closeDrawer = function(){
  var app = document.getElementById('app'), scrim = document.getElementById('scrim'), btn = document.getElementById('menuBtn');
  if (!app) return;
  app.setAttribute('data-drawer', 'closed');
  if (scrim) scrim.hidden = true;
  if (btn) btn.setAttribute('aria-expanded', 'false');
};

U.toggleRail = function(){
  var app = document.getElementById('app');
  if (!app) return;
  var mini = app.getAttribute('data-rail') === 'mini';
  app.setAttribute('data-rail', mini ? 'full' : 'mini');
  var t = document.getElementById('railToggle');
  if (t) {
    t.setAttribute('aria-label', mini ? 'Narrow the side menu' : 'Widen the side menu');
    var span = t.querySelector('span');
    if (span) span.textContent = mini ? 'Narrow the menu' : 'Widen the menu';
  }
};

/* the debt free date pill and the currency chip */
U.refreshBar = function(){
  var text = document.getElementById('freeDateText');
  if (text) {
    var head = { text: 'No debts yet' };
    try { head = S.engine.headline(); } catch (e) {}
    text.textContent = S.activeDebts().length ? 'Debt free ' + head.text : 'No debts yet';
  }
  var cur = document.getElementById('currencyText');
  if (cur) cur.textContent = (S.state && S.state.settings.currency) || 'AUD';
};

U.mount = function(){
  if (U._mounted) { U.render(); return; }
  U._mounted = true;

  U.applyTheme();

  var menuBtn = document.getElementById('menuBtn');
  if (menuBtn) {
    menuBtn.innerHTML = U.svg('menu', 22);
    menuBtn.addEventListener('click', function(){
      var app = document.getElementById('app');
      if (app && app.getAttribute('data-drawer') === 'open') U.closeDrawer();
      else U.openDrawer();
    });
  }
  var scrim = document.getElementById('scrim');
  if (scrim) scrim.addEventListener('click', U.closeDrawer);

  var themeBtn = document.getElementById('themeBtn');
  if (themeBtn) themeBtn.addEventListener('click', U.toggleTheme);

  var guideBtn = document.getElementById('guideBtn');
  if (guideBtn) {
    guideBtn.innerHTML = U.svg('guide', 20);
    guideBtn.addEventListener('click', function(){ U.go('guide'); });
  }

  var pill = document.getElementById('freeDatePill');
  if (pill) pill.addEventListener('click', function(){ U.go('plan'); });

  var chip = document.getElementById('currencyChip');
  if (chip) chip.addEventListener('click', function(){ U.go('settings'); });

  var railToggle = document.getElementById('railToggle');
  if (railToggle) railToggle.addEventListener('click', U.toggleRail);

  window.addEventListener('hashchange', U.render);

  document.addEventListener('keydown', function(e){
    if (e.key === 'Escape') { U.closeModal(); U.closeDrawer(); }
  });

  /* live search on any table built by U.table. Only primary rows are
     matched and toggled; an expansion row (tr[data-parent="<key>"]) follows
     the primary row that carries data-row="<key>", and its own open or
     closed state (the hidden attribute) is left alone. */
  U.onAny('.tbl-search', 'input', function(e, el){
    var block = el.closest('.tbl-block');
    if (!block) return;
    var q = String(el.value || '').trim().toLowerCase();
    var rows = block.querySelectorAll('tbody tr');
    var shown = 0, miss = {};
    var i;
    for (i = 0; i < rows.length; i++) {
      if (rows[i].hasAttribute('data-parent')) continue;
      var hit = !q || rows[i].textContent.toLowerCase().indexOf(q) >= 0;
      rows[i].classList.toggle('search-miss', !hit);
      var key = rows[i].getAttribute('data-row');
      if (key != null) miss[key] = !hit;
      if (hit) shown++;
    }
    for (i = 0; i < rows.length; i++) {
      var parent = rows[i].getAttribute('data-parent');
      if (parent == null) continue;
      rows[i].classList.toggle('search-miss', !!miss[parent]);
    }
    var note = block.querySelector('.no-hits');
    if (!shown && !note) {
      var p = document.createElement('p');
      p.className = 'sub no-hits';
      p.textContent = 'Nothing matches that search.';
      block.appendChild(p);
    } else if (shown && note) {
      note.remove();
    }
  });

  U.render();
  U.refreshBar();
};

/* If the boot code has not called mount by the time the first frame is
   over, bring the shell up anyway so the app is never a blank page. */
setTimeout(function(){ if (!U._mounted) U.mount(); }, 0);

/* =====================================================================
   Debt Snowball js4: the dashboard and the my debts page.

   Markup here is written against the class names that actually exist in
   head.html, so every block is styled without touching the stylesheet.
   One small compat block is injected at load for the few names js3's
   shared components emit that head.html does not carry yet.
   ===================================================================== */


/* ---------------------------------------------------------------- */
/* small building blocks, written with head.html's own classes        */

function d4Card(o){
  o = o || {};
  var head = '';
  if (o.title || o.sub || o.actions) {
    head = '<div class="card-head card-h"><div class="card-titles"><div class="card-t">' + (o.title || '') + '</div>' +
      (o.sub ? '<div class="card-sub">' + o.sub + '</div>' : '') + '</div>' +
      (o.actions ? '<div class="card-acts card-actions">' + o.actions + '</div>' : '') + '</div>';
  }
  return '<div class="card' + (o.cls ? ' ' + o.cls : '') + '"' + (o.id ? ' id="' + S.esc(o.id) + '"' : '') + '>' +
    head + (o.body || '') + '</div>';
}

/* Every summary tile is a link to its own page. */
/* Strategy names already ending in "order" must not get a second one. */
function d4OrderLabel(key){
  var n = S.engine.strategy(key).name;
  return /order$/i.test(n) ? n : n + ' order';
}

function d4Stat(o){
  o = o || {};
  var inner = '<div class="stat-l">' + (o.label || '') + '</div>' +
    '<div class="stat-v">' + (o.value == null ? '' : o.value) + '</div>' +
    (o.sub ? '<div class="stat-s">' + o.sub + '</div>' : '');
  var cls = 'stat' + (o.tone ? ' tone-' + o.tone : '');
  if (o.href) return '<a class="' + cls + '" href="' + S.esc(o.href) + '">' + inner + '</a>';
  return '<div class="' + cls + '">' + inner + '</div>';
}

/* Two figures in one tile sit side by side, never stacked. */
function d4Pair(a, b){
  function half(x){
    return '<div><div class="pair-l">' + (x.label || '') + '</div>' +
      '<div class="pair-v">' + (x.value == null ? '' : x.value) + '</div>' +
      (x.sub ? '<div class="sub" style="margin-top:3px">' + x.sub + '</div>' : '') + '</div>';
  }
  return '<div class="pair">' + half(a) + half(b) + '</div>';
}

function d4Thermo(pct, top, bottom){
  var p = S.clamp(pct, 0, 100);
  var ticks = '';
  [25, 50, 75].forEach(function(t){ ticks += '<i style="left:' + t + '%"></i>'; });
  return '<div class="thermo" role="img" aria-label="' + S.esc(S.num(p, 0)) + ' percent paid off">' +
    '<div class="tube"><span style="width:' + S.num(p, 2) + '%"></span>' + ticks + '</div>' +
    '<div><div class="tval">' + S.pct(p, 0) + '</div>' +
    '<div class="tlab">' + S.esc(top || 'paid off so far') + '</div>' +
    (bottom ? '<div class="tlab">' + S.esc(bottom) + '</div>' : '') + '</div></div>';
}

function d4UtilBar(debt){
  var pct = S.utilisation(debt);
  if (pct == null) return '';
  var p = S.clamp(pct, 0, 100);
  var kind = pct >= 80 ? ' class="high"' : (pct >= 30 ? ' class="mid"' : '');
  return '<div><div class="util"><span' + kind + ' style="width:' + S.num(p, 2) + '%"></span><i style="left:30%"></i><i style="left:80%"></i></div>' +
    '<div class="util-legend"><span>' + S.pct(pct, 0) + ' of the limit used</span>' +
    '<span>limit ' + S.esc(S.money(debt.creditLimit)) + '</span></div></div>';
}

function d4ProgBar(debt){
  var start = Math.max(Number(debt.startBalance) || 0, Number(debt.balance) || 0);
  var paid = Math.max(0, start - (Number(debt.balance) || 0));
  var pct = start > 0 ? S.clamp(paid / start * 100, 0, 100) : 0;
  return '<div><div class="prog-l"><span>' + S.esc(S.money(paid)) + ' paid off</span><span>' + S.pct(pct, 0) + '</span></div>' +
    S.ui.prog(pct) + '</div>';
}

/* A line chart that keeps its shape and its type size on every width.
   Drawn here rather than stretched, so the labels stay readable. */
function d4Line(o){
  o = o || {};
  var series = (o.series || []).filter(function(s){ return s && s.points && s.points.length; });
  if (!series.length) return '<div class="empty">Nothing to chart yet</div>';
  /* On a phone the SVG is drawn at close to its real pixel size, so the
     labels stay at their proper reading size instead of being scaled down. */
  var narrow = window.innerWidth < 700;
  var h = o.height || 230, w = narrow ? Math.max(280, window.innerWidth - 54) : 720;
  var padL = narrow ? 58 : 68, padR = narrow ? 10 : 16, padT = 14, padB = 30;
  var fmt = o.yFmt || function(v){ return S.money(v); };
  var maxY = 0, n = 0;
  series.forEach(function(s){
    s.points.forEach(function(p){ if (Number(p.y) > maxY) maxY = Number(p.y); });
    if (s.points.length > n) n = s.points.length;
  });
  if (!(maxY > 0)) maxY = 1;
  var innerW = w - padL - padR, innerH = h - padT - padB;
  function X(i){ return padL + (n <= 1 ? innerW / 2 : innerW * i / (n - 1)); }
  function Y(v){ return padT + innerH - innerH * (Number(v) / maxY); }

  var grid = '', ylab = '';
  [0, 0.25, 0.5, 0.75, 1].forEach(function(f){
    var y = padT + innerH * (1 - f);
    grid += '<line class="gridline" x1="' + padL + '" y1="' + y.toFixed(1) + '" x2="' + (w - padR) + '" y2="' + y.toFixed(1) + '"/>';
    ylab += '<text x="' + (padL - 9) + '" y="' + (y + 4).toFixed(1) + '" text-anchor="end">' + S.esc(fmt(maxY * f)) + '</text>';
  });

  var paths = '', dots = '';
  series.forEach(function(s, si){
    var colour = s.colour || S.PALETTE[si % S.PALETTE.length];
    var d = s.points.map(function(p, i){ return (i ? 'L' : 'M') + X(i).toFixed(1) + ' ' + Y(p.y).toFixed(1); }).join(' ');
    if (series.length === 1) {
      paths += '<path d="' + d + ' L' + X(s.points.length - 1).toFixed(1) + ' ' + (padT + innerH).toFixed(1) +
        ' L' + X(0).toFixed(1) + ' ' + (padT + innerH).toFixed(1) + ' Z" fill="' + S.esc(colour) + '" opacity=".12"/>';
    }
    paths += '<path d="' + d + '" fill="none" stroke="' + S.esc(colour) + '" stroke-width="2.4" stroke-linejoin="round" stroke-linecap="round"/>';
    var li = s.points.length - 1;
    dots += '<circle cx="' + X(li).toFixed(1) + '" cy="' + Y(s.points[li].y).toFixed(1) + '" r="3.6" fill="' + S.esc(colour) + '"/>';
  });

  var xlab = '';
  var base = series[0].points;
  var picks = n <= 1 ? [0] : [0, Math.round((n - 1) / 2), n - 1];
  picks.forEach(function(i, k){
    var p = base[i] || base[base.length - 1];
    if (!p) return;
    var anchor = k === 0 ? 'start' : (k === picks.length - 1 ? 'end' : 'middle');
    xlab += '<text x="' + X(i).toFixed(1) + '" y="' + (h - 9) + '" text-anchor="' + anchor + '">' + S.esc(String(p.label || '')) + '</text>';
  });

  var legend = series.length > 1 ? '<div class="chart-legend">' + series.map(function(s, si){
    return '<span><i class="dot" style="background:' + S.esc(s.colour || S.PALETTE[si % S.PALETTE.length]) + '"></i>' + S.esc(s.name || '') + '</span>';
  }).join('') + '</div>' : '';

  return '<div class="chart-wrap"><svg class="chart' + (narrow ? ' chart-narrow' : '') + '" viewBox="0 0 ' + w + ' ' + h + '" width="' + w + '" height="' + h + '" ' +
    'role="img" style="max-width:100%;height:auto' + (narrow ? '' : ';min-width:' + (o.minWidth || 460) + 'px') + '">' +
    grid + ylab + paths + dots + xlab +
    '<line class="axis" x1="' + padL + '" y1="' + (padT + innerH).toFixed(1) + '" x2="' + (w - padR) + '" y2="' + (padT + innerH).toFixed(1) + '"/>' +
    '</svg></div>' + legend;
}

/* Horizontal bars, used on the compare page. */
function d4Bars(o){
  o = o || {};
  var rows = o.rows || [];
  if (!rows.length) return '<div class="empty">Nothing to chart yet</div>';
  var fmt = o.fmt || function(v){ return S.money(v); };
  var max = 0;
  rows.forEach(function(r){ if (Math.abs(Number(r.value)) > max) max = Math.abs(Number(r.value)); });
  if (!max) max = 1;
  return '<div>' + rows.map(function(r, i){
    var pctW = S.clamp(Math.abs(Number(r.value)) / max * 100, 0, 100);
    var colour = r.colour || S.PALETTE[i % S.PALETTE.length];
    return '<div style="display:grid;grid-template-columns:minmax(92px,168px) minmax(0,1fr) auto;gap:11px;align-items:center;margin-bottom:10px">' +
      '<div style="font-size:13px;min-width:0"><b style="font-weight:600">' + S.esc(String(r.label)) + '</b>' +
      (r.sub ? '<div class="sub" style="font-size:12px">' + S.esc(String(r.sub)) + '</div>' : '') + '</div>' +
      '<div style="height:14px;border-radius:99px;background:var(--bg-soft);border:1px solid var(--line-soft);overflow:hidden">' +
      '<span style="display:block;height:100%;width:' + S.num(pctW, 2) + '%;background:' + S.esc(colour) + ';border-radius:99px"></span></div>' +
      '<div style="font-family:var(--font-display);font-weight:600;font-size:15px;white-space:nowrap">' + S.esc(fmt(r.value)) + '</div>' +
      '</div>';
  }).join('') + '</div>';
}

function d4TypeChip(debt){
  var t = null;
  for (var i = 0; i < S.DEBT_TYPES.length; i++) if (S.DEBT_TYPES[i].key === debt.type) t = S.DEBT_TYPES[i];
  var label = t ? t.label : 'Something else';
  return '<span class="chip">' + S.esc(label) + '</span>';
}

function d4PromoChip(debt){
  if (debt.promoApr === null || debt.promoApr === undefined || !debt.promoEndsOn) return '';
  var tone = debt.deferredInterest ? 'warn' : 'sky';
  return '<span class="chip ' + tone + '">' + S.esc(S.pct(debt.promoApr, 2)) + ' until ' + S.esc(S.dateStr(debt.promoEndsOn)) + '</span>';
}

function d4OpenDebtHref(id){ return '#/debts?open=' + encodeURIComponent(id); }

var d4Draft = null;

/* The default minimum rule lives in Settings; a new debt starts from it. */
function d4DefaultRule(){
  var r = (S.state && S.state.settings && S.state.settings.minRule) || {};
  var pct = Number(r.pct), floor = Number(r.floor);
  return { pct: pct > 0 ? pct : 2, floor: floor >= 0 && r.floor != null ? floor : 25 };
}

function d4BlankDebt(){
  return {
    id: null, name: '', lender: '', type: 'card', balance: 0, apr: 0,
    minPayment: 0, minRule: d4DefaultRule(), creditLimit: 0, dueDay: 15,
    promoApr: null, promoEndsOn: null, deferredInterest: false, openedOn: null,
    notes: '', archived: false, colour: S.PALETTE[0], startBalance: 0
  };
}

function d4DialogBody(d){
  var autoMin = !(Number(d.minPayment) > 0);
  var typeOpts = S.DEBT_TYPES.map(function(t){ return { value: t.key, label: t.label }; });

  for (var i = 1; i <= 31; i++) dayOpts.push({ value: i, label: String(i) });

      'style="background:' + S.esc(c) + '" title="' + S.esc(c) + '" aria-label="Use the colour ' + S.esc(c) + '"></button>';
  }).join('');

  return '<div class="grid g2" style="gap:0 14px">' +

    S.ui.field({ id: 'd4f-lender', label: 'Who is it with', value: d.lender, placeholder: 'Westpac' }) +
    S.ui.field({ id: 'd4f-type', label: 'Type', type: 'select', value: d.type, options: typeOpts }) +
    S.ui.field({ id: 'd4f-balance', label: 'Balance owing', value: d.balance, inputmode: 'decimal' }) +
    S.ui.field({ id: 'd4f-apr', label: 'Interest rate a year', value: d.apr, inputmode: 'decimal', hint: 'Enter 20.99 for 20.99 percent' }) +
    S.ui.field({ id: 'd4f-limit', label: 'Credit limit', value: d.creditLimit, inputmode: 'decimal', hint: 'Leave at zero for a loan' }) +
    S.ui.field({ id: 'd4f-due', label: 'Payment due on day', type: 'select', value: d.dueDay, options: dayOpts }) +
    S.ui.field({ id: 'd4f-start', label: 'Balance when you started', value: d.startBalance, inputmode: 'decimal', hint: 'Used for the progress bar' }) +
    '</div>' +

    '<div class="note" style="margin:4px 0 14px">' +
    S.ui.field({ id: 'd4f-automin', type: 'checkbox', value: autoMin, label: 'Work out my minimum for me' }) +
    '<div id="d4f-minfixed"' + (autoMin ? ' hidden' : '') + '>' +
    S.ui.field({ id: 'd4f-min', label: 'Minimum payment a month', value: d.minPayment, inputmode: 'decimal' }) +
    '</div>' +
    '<div id="d4f-minrule" class="grid g2" style="gap:0 14px"' + (autoMin ? '' : ' hidden') + '>' +
    S.ui.field({ id: 'd4f-minpct', label: 'Percent of the balance', value: (d.minRule && d.minRule.pct) || d4DefaultRule().pct, inputmode: 'decimal' }) +
    S.ui.field({ id: 'd4f-minfloor', label: 'Never less than', value: (d.minRule && d.minRule.floor != null) ? d.minRule.floor : d4DefaultRule().floor, inputmode: 'decimal' }) +
    '</div></div>' +

    '<div class="note" style="margin-bottom:14px">' +
    '<div class="lbl">Promotional rate</div>' +
    '<div class="grid g2" style="gap:0 14px">' +
    S.ui.field({ id: 'd4f-promoapr', label: 'Promo rate', value: (d.promoApr === null || d.promoApr === undefined) ? '' : d.promoApr, inputmode: 'decimal', placeholder: 'Leave blank for none' }) +
    S.ui.field({ id: 'd4f-promoend', label: 'Promo ends on', type: 'date', value: d.promoEndsOn ? String(d.promoEndsOn).slice(0, 10) : '' }) +
    '</div>' +
    S.ui.field({ id: 'd4f-deferred', type: 'checkbox', value: !!d.deferredInterest, label: 'Interest is deferred, it gets back dated if the balance is not cleared in time' }) +

function d4ReadDialog(){
  var d = d4Draft || d4BlankDebt();
  function val(id){ var el = document.getElementById(id); return el ? el.value : ''; }
  function chk(id){ var el = document.getElementById(id); return !!(el && el.checked); }
  function num(id){ return Number(String(val(id)).replace(/[^0-9.\-]/g, '')) || 0; }

  d.name = String(val('d4f-name')).trim() || 'Debt';
  d.lender = String(val('d4f-lender')).trim();
  d.type = val('d4f-type') || 'card';
  d.balance = Math.max(0, num('d4f-balance'));
  d.apr = Math.max(0, num('d4f-apr'));
  d.creditLimit = Math.max(0, num('d4f-limit'));
  d.dueDay = Math.min(31, Math.max(1, Math.round(num('d4f-due')) || 15));
  d.startBalance = Math.max(0, num('d4f-start'));
  if (!d.startBalance || d.startBalance < d.balance) d.startBalance = d.balance;

  if (chk('d4f-automin')) {
    d.minPayment = 0;
    d.minRule = { pct: Math.max(0, num('d4f-minpct')) || d4DefaultRule().pct, floor: Math.max(0, num('d4f-minfloor')) };
  } else {
    d.minPayment = Math.max(0, num('d4f-min'));
    d.minRule = d.minRule || d4DefaultRule();
  }

  var promoRaw = String(val('d4f-promoapr')).trim();
  if (promoRaw === '') { d.promoApr = null; d.promoEndsOn = null; d.deferredInterest = false; }
  else {
    d.promoApr = Math.max(0, num('d4f-promoapr'));
    d.promoEndsOn = val('d4f-promoend') || null;
    d.deferredInterest = chk('d4f-deferred');
    if (!d.promoEndsOn) { d.promoApr = null; d.deferredInterest = false; }
  }
  d.openedOn = val('d4f-opened') || null;
  d.notes = String(val('d4f-notes'));
  return d;
}

function d4OpenDialog(id){
  var existing = id ? S.debt(id) : null;
  d4Draft = existing ? JSON.parse(JSON.stringify(existing)) : d4BlankDebt();
  S.ui.modal({
    wide: true,
    title: existing ? 'Edit ' + S.esc(existing.name) : 'Add a debt',
    body: d4DialogBody(d4Draft),
    actions: [
      { label: 'Cancel', kind: 'ghost' },
      { label: existing ? 'Save changes' : 'Add this debt', kind: 'primary', onClick: function(){
        var d = d4ReadDialog();
        if (existing) {
          for (var k in d) if (Object.prototype.hasOwnProperty.call(d, k)) existing[k] = d[k];
          S.toast('Saved ' + d.name, 'good');
        } else {
          d.id = S.uid();
          S.state.debts.push(d);
          S.toast('Added ' + d.name, 'good');
        }
        S.save();
        d4Draft = null;
        S.ui.render();
      } }
    ],
    onOpen: function(scrim){
      var auto = scrim.querySelector('#d4f-automin');
      var fixed = scrim.querySelector('#d4f-minfixed');
      var rule = scrim.querySelector('#d4f-minrule');
      if (auto) auto.addEventListener('change', function(){
        if (fixed) fixed.hidden = auto.checked;
        if (rule) rule.hidden = !auto.checked;
      });
      var name = scrim.querySelector('#d4f-name');
      if (name) name.focus();
    }
  });
}

function d4NextDueDate(debt){
  var todayStr = S.today();
  var ym = todayStr.slice(0, 7);
  var candidate = S.dueDate(ym, debt.dueDay);
  if (candidate < todayStr) candidate = S.dueDate(S.addMonths(ym, 1), debt.dueDay);
  return candidate;
}

function d4DaysUntil(dateStr){
  var a = S.parseDate(S.today()), b = S.parseDate(dateStr);
  return Math.round((b.getTime() - a.getTime()) / 86400000);
}

function d4WarnTitle(kind){
  if (kind === 'negative-amortisation') return 'This balance is growing';
  if (kind === 'promo-ending') return 'A promo rate is about to end';
  if (kind === 'deferred-interest') return 'Deferred interest is waiting';
  if (kind === 'min-too-low') return 'The plan needs more than is spare';
  return 'Worth a look';
}

function d4DashboardHtml(){
  var debts = S.activeDebts();
  var live = debts.filter(function(d){ return Number(d.balance) > 0; });

  if (!live.length) {
    return '<section class="sec sec-dashboard-1">' + d4Card({
      title: 'Start with one debt',
      sub: 'Add what you owe and Debt Snowball works out the date it is all gone.',
      body: '<div class="empty"><p>No debts on this plan yet.</p>' +
        '<div class="row tight" style="justify-content:center;margin-top:14px">' +
        S.ui.btn({ label: 'Add a debt', kind: 'primary', icon: 'plus', act: 'd4-add' }) +
        S.ui.btn({ label: 'Load the sample plan', act: 'd4-demo' }) + '</div></div>'
    }) + '</section>';
  }

  var proj = S.engine.project({});
  var mins = S.engine.minimumsOnly({});
  var head = S.engine.headline(proj);
  var thisYm = proj.startMonth;
  var firstMonth = proj.schedule.length ? proj.schedule[0] : null;

  var interestLeft = proj.totalInterest;
  var interestSaved = S.round2(mins.totalInterest - proj.totalInterest);
  var monthsSaved = mins.months - proj.months;
  var thisMonthPay = firstMonth ? firstMonth.payment : S.monthlyPot();

  /* hero */
  var hero = '<div class="hero">' +
    '<div class="split" style="align-items:flex-end;justify-content:space-between">' +
    '<div style="min-width:0">' +
    '<div class="stat-l">Still owing today</div>' +
    '<div class="figure xl">' + S.esc(S.money(S.totalDebt())) + '</div>' +
    '<div class="row tight" style="margin-top:12px">' +
    '<a class="pill good" href="#/plan">' + S.ui.svg('milestone', 17) + '<span>Debt free ' + S.esc(head.text) + '</span></a>' +
    '<a class="pill ghost" href="#/plan">' + S.esc(d4OrderLabel(proj.strategy)) + '</a>' +
    '</div></div>' +
    '<div style="flex:1 1 280px;min-width:0">' +
    d4Pair(
      { label: 'Paid off so far', value: S.esc(S.money(S.paidOff())) },
      /* the headline figure above is already the amount still owing, so this
         side carries the figure it is measured against instead of repeating it */
      { label: 'Started at', value: S.esc(S.money(S.totalStart())) }
    ) + '</div></div>' +
    '<div style="margin-top:20px">' + d4Thermo(S.pctPaid(), 'of the total paid off', S.monthsWords(proj.months) + ' left on this plan') + '</div>' +
    '</div>';

  /* four tiles, each one a link to the page it belongs to */
  var tiles = '<div class="grid g4">' +
    d4Stat({ label: 'Interest still to pay', value: S.esc(S.money(interestLeft)), sub: 'On the ' + S.esc(d4OrderLabel(proj.strategy)), href: '#/plan', tone: 'warn' }) +
    d4Stat({ label: 'Interest saved', value: S.esc(S.money(interestSaved)), sub: 'Against paying minimums only', href: '#/compare', tone: 'good' }) +
    d4Stat({ label: 'Months saved', value: S.esc(S.num(Math.max(0, monthsSaved))), sub: monthsSaved > 0 ? S.esc(S.monthsWords(monthsSaved)) + ' sooner' : 'Add some extra to pull this forward', href: '#/compare', tone: 'good' }) +
    d4Stat({ label: 'Paying this month', value: S.esc(S.money(thisMonthPay)), sub: S.esc(S.money(S.totalMinimums())) + ' minimums plus ' + S.esc(S.money(S.extraMonthly())) + ' extra', href: '#/plan', tone: 'accent' }) +
    '</div>';

  /* focus debt */
  var focusId = proj.order && proj.order.length ? proj.order[0] : null;
  var focus = S.debt(focusId);
  var focusHtml = '';
  if (focus) {
    var row = null;
    if (firstMonth) for (var fi = 0; fi < firstMonth.rows.length; fi++) if (firstMonth.rows[fi].debtId === focus.id) row = firstMonth.rows[fi];
    var payNow = row ? row.payment : S.minPaymentFor(focus);
    var info = proj.byDebt[focus.id];
    focusHtml = d4Card({
      title: 'Attack this one now',
      sub: S.esc(S.engine.strategy(proj.strategy).rule) + ', so ' + S.esc(focus.name) + ' is first in line',
      actions: '<a class="btn" href="' + d4OpenDebtHref(focus.id) + '">Open this debt</a>',
      body: '<div class="split" style="justify-content:space-between;align-items:flex-start">' +
        '<div style="min-width:0;flex:1 1 220px">' +
        '<div class="dname" style="font-size:17px">' + S.esc(focus.name) + '</div>' +
        '<div class="dlender">' + S.esc(focus.lender || S.typeLabel(focus.type)) + ' at ' + S.esc(S.pct(S.effectiveApr(focus, thisYm), 2)) + '</div>' +
        '<div style="margin-top:12px">' + d4ProgBar(focus) + '</div></div>' +
        '<div style="flex:1 1 200px;min-width:0">' +
        d4Pair(
          { label: 'Pay this month', value: S.esc(S.money(payNow)) },
          { label: 'Gone by', value: S.esc(info && info.payoffMonth ? S.monthLabel(info.payoffMonth) : 'later') }
        ) + '</div></div>'
    });
  }

  /* balance over time */
  var pts = [{ label: S.monthLabel(thisYm), y: proj.startTotal }];
  proj.schedule.forEach(function(mo){ pts.push({ label: mo.label, y: mo.endBalance }); });
  var chart = d4Card({
    title: 'What is left, month by month',
    sub: 'Every balance added together, from now until the last payment',

    body: d4Line({ series: [{ name: 'Total owing', colour: '#C6892F', points: pts }], height: 230 })
  });

  /* next 30 days */
  var upcoming = live.map(function(d){
    var due = d4NextDueDate(d);
    var pay = S.minPaymentFor(d);
    if (firstMonth) for (var i = 0; i < firstMonth.rows.length; i++) if (firstMonth.rows[i].debtId === d.id) pay = firstMonth.rows[i].payment;
    return { debt: d, due: due, days: d4DaysUntil(due), pay: pay };
  }).filter(function(x){ return x.days >= 0 && x.days <= 30; })
    .sort(function(a, b){ return a.due < b.due ? -1 : a.due > b.due ? 1 : 0; });

  var upHtml = upcoming.length

          '<span class="ofig">' + S.esc(S.money(x.pay)) + '</span></a>';

    : '<div class="empty">Nothing falls due in the next 30 days.</div>';

  var upcomingCard = d4Card({
    title: 'Due in the next 30 days',
    sub: 'Tap a row to open that debt',
    actions: '<a class="btn sm" href="#/calendar">Full calendar</a>',
    body: upHtml
  });

  /* milestone */
  var stones = [];
  try { stones = S.engine.milestones(proj) || []; } catch (e) { stones = []; }
  var nextThree = stones.filter(function(x){ return !x.done; }).slice(0, 3);
  var stoneHtml = nextThree.map(function(st){
    var href = st.debtId && S.debt(st.debtId) ? d4OpenDebtHref(st.debtId) : '#/milestones';
    return '<a class="oitem" href="' + href + '"><span class="rank">' + S.ui.svg('star', 15) + '</span>' +
      '<span style="min-width:0"><span class="oname">' + S.esc(st.label) + '</span>' +
      '<span class="owhy" style="display:block">' + S.esc(st.sub || '') + '</span></span>' +
      '<span class="ofig">' + S.esc(st.projectedDate || 'done') + '</span></a>';
  }).join('');

  /* warnings, each one opens the debt that raised it */
  var warns = proj.warnings || [];
  var warnHtml = warns.length ? '<section class="sec sec-dashboard-6">' +
    '<div class="sec-head"><h2>Worth knowing</h2><p>Things Debt Snowball spotted in your own numbers.</p></div>' +
    warns.map(function(w){
      var inner = S.ui.svg('warning', 20) + '<div><b>' + S.esc(d4WarnTitle(w.kind)) + '</b><p>' + S.esc(w.text) + '</p></div>';
      if (w.debtId && S.debt(w.debtId)) return '<a class="warn-card" href="' + d4OpenDebtHref(w.debtId) + '">' + inner + '</a>';
      return '<div class="warn-card">' + inner + '</div>';
    }).join('') + '</section>' : '';

  return '<section class="sec sec-dashboard-1">' + hero + '</section>' +
    '<section class="sec sec-dashboard-2">' + tiles + '</section>' +

    '<div style="flex:1 1 300px;min-width:0">' + d4Card({
      title: 'The next wins',
      sub: 'Each one opens the debt behind it',
      actions: '<a class="btn sm" href="#/milestones">All milestones</a>',
      body: stoneHtml ? '<div class="olist">' + stoneHtml + '</div>' : '<div class="empty">Every milestone on this plan is done.</div>'
    }) + '</div></div></section>' +
    warnHtml;
}

/* page: my debts                                                     */

var d4View = { type: 'all', status: 'active', sort: 'balance-desc', q: '' };

function d4Matches(d){
  var q = String(d4View.q || '').trim().toLowerCase();
  if (!q) return true;
  var hay = (d.name + ' ' + (d.lender || '') + ' ' + S.typeLabel(d.type) + ' ' + (d.notes || '')).toLowerCase();
  return hay.indexOf(q) >= 0;
}

function d4Filtered(){
  var all = ((S.state && S.state.debts) || []).slice();
  return all.filter(function(d){
    if (d4View.type !== 'all' && d.type !== d4View.type) return false;
    if (d4View.status === 'active') return !d.archived && Number(d.balance) > 0;
    if (d4View.status === 'cleared') return !d.archived && !(Number(d.balance) > 0);
    if (d4View.status === 'archived') return !!d.archived;
    return true;
  }).sort(function(a, b){
    var s = d4View.sort;
    if (s === 'name') return String(a.name).localeCompare(String(b.name));
    if (s === 'balance-asc') return Number(a.balance) - Number(b.balance);
    if (s === 'apr-desc') return S.effectiveApr(b, null) - S.effectiveApr(a, null);
    if (s === 'min-desc') return S.minPaymentFor(b) - S.minPaymentFor(a);
    if (s === 'due') return Number(a.dueDay) - Number(b.dueDay);
    if (s === 'progress-desc') {
      function pr(d){ var st = Math.max(Number(d.startBalance) || 0, Number(d.balance) || 0); return st > 0 ? (st - Number(d.balance)) / st : 0; }
      return pr(b) - pr(a);
    }
    return Number(b.balance) - Number(a.balance);
  });
}

function d4DebtCard(d){
  var apr = S.effectiveApr(d, null);
  var cleared = !(Number(d.balance) > 0);
  return '<div class="card debt-card js-debt-card" data-debt="' + S.esc(d.id) + '" data-hit="1" style="padding-left:22px">' +
    '<span class="colour-bar" style="background:' + S.esc(d.colour) + '"></span>' +
    '<div class="dtop"><div style="min-width:0;flex:1">' +
    '<div class="dname">' + S.esc(d.name) + '</div>' +
    '<div class="dlender">' + S.esc(d.lender || 'No lender saved') + '</div></div>' +
    '<div class="row tight">' + d4TypeChip(d) +
    (d.archived ? '<span class="chip">Archived</span>' : '') +
    (cleared && !d.archived ? '<span class="chip good">Cleared</span>' : '') + '</div></div>' +
    '<div class="dbal">' + S.esc(S.money(d.balance)) + '</div>' +
    (d4PromoChip(d) ? '<div class="row tight">' + d4PromoChip(d) + '</div>' : '') +
    '<div class="dmeta">' +
    '<div><div class="k">Rate</div><div class="v">' + S.esc(S.pct(apr, 2)) + '</div></div>' +
    '<div><div class="k">Minimum</div><div class="v">' + S.esc(S.money(S.minPaymentFor(d))) + '</div></div>' +
    '<div><div class="k">Due day</div><div class="v">' + S.esc(String(d.dueDay)) + '</div></div>' +
    '</div>' +
    d4ProgBar(d) +
    d4UtilBar(d) +
    (d.notes ? '<p class="sub">' + S.esc(d.notes) + '</p>' : '') +
    /* no inline margin here: the stylesheet pins this action row to the
       bottom of the card (.debt-card > .row.tight:last-child) so the Edit /
       Archive / Delete buttons line up across a row of cards. An inline
       margin-top would win over that rule and break the alignment. */
